<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Farm Clicker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        color: #e5e7eb;
        background:
          radial-gradient(
            circle at top,
            rgba(59, 130, 246, 0.18),
            transparent 30%
          ),
          linear-gradient(180deg, #0b1220 0%, #111827 45%, #0f172a 100%);
      }
      .app {
        max-width: 480px;
        margin: 0 auto;
        min-height: 100vh;
        padding: 16px 14px 28px;
      }
      .card {
        background: rgba(17, 24, 39, 0.88);
        border: 1px solid rgba(59, 130, 246, 0.18);
        border-radius: 24px;
        padding: 16px;
        margin-bottom: 16px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.25);
        backdrop-filter: blur(8px);
      }
      .top-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
      }
      .title {
        font-size: 28px;
        font-weight: 800;
        color: #f8fafc;
        line-height: 1.1;
      }
      .subtitle {
        margin-top: 6px;
        color: #94a3b8;
        font-size: 13px;
      }
      .level-badge {
        min-width: 90px;
        text-align: center;
        padding: 14px 12px;
        border-radius: 18px;
        font-size: 16px;
        font-weight: 800;
        color: #fff;
        background: linear-gradient(135deg, #2563eb, #60a5fa);
        box-shadow: 0 10px 24px rgba(37, 99, 235, 0.28);
      }
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }
      .stat-box {
        background: rgba(30, 41, 59, 0.85);
        border: 1px solid rgba(148, 163, 184, 0.14);
        border-radius: 18px;
        padding: 12px 8px;
        text-align: center;
      }
      .stat-label {
        color: #94a3b8;
        font-size: 11px;
        margin-bottom: 8px;
      }
      .stat-value {
        color: #f8fafc;
        font-size: 18px;
        font-weight: 800;
      }
      .section-title {
        font-size: 18px;
        font-weight: 800;
        color: #f8fafc;
        margin-bottom: 12px;
      }
      .status-line {
        margin-top: 12px;
        text-align: center;
        color: #cbd5e1;
        font-size: 14px;
        font-weight: 700;
        line-height: 1.5;
      }
      .tap-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 10px 0 2px;
      }
      .tap-btn {
        width: 200px;
        height: 200px;
        border: none;
        border-radius: 50%;
        cursor: pointer;
        color: #fff;
        font-size: 34px;
        font-weight: 900;
        letter-spacing: 1px;
        background: radial-gradient(
          circle at 30% 20%,
          #93c5fd,
          #3b82f6 55%,
          #1d4ed8 100%
        );
        box-shadow:
          0 20px 50px rgba(37, 99, 235, 0.34),
          inset 0 8px 18px rgba(255, 255, 255, 0.22);
        transition: transform 0.08s ease;
      }
      .tap-btn:active {
        transform: scale(0.96);
      }
      .tap-hint {
        margin-top: 18px;
        text-align: center;
        color: #94a3b8;
        font-size: 14px;
      }
      .menu-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }
      .menu-btn {
        background: rgba(30, 41, 59, 0.85);
        border: 1px solid rgba(148, 163, 184, 0.14);
        border-radius: 22px;
        min-height: 98px;
        padding: 12px 8px;
        cursor: pointer;
        color: #f8fafc;
        font-size: 13px;
        font-weight: 800;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .menu-emoji {
        font-size: 30px;
        line-height: 1;
      }
      .main-btn {
        width: 100%;
        border: none;
        border-radius: 18px;
        padding: 16px;
        margin-top: 12px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 800;
        color: white;
        background: linear-gradient(135deg, #2563eb, #60a5fa);
        box-shadow: 0 12px 28px rgba(37, 99, 235, 0.25);
      }
      .floating {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: 240px;
        z-index: 999;
        pointer-events: none;
        font-size: 24px;
        font-weight: 900;
        color: #93c5fd;
        text-shadow: 0 2px 14px rgba(59, 130, 246, 0.5);
        animation: floatUp 0.9s ease forwards;
      }
      @keyframes floatUp {
        0% {
          opacity: 1;
          transform: translateX(-50%) translateY(0) scale(0.95);
        }
        100% {
          opacity: 0;
          transform: translateX(-50%) translateY(-70px) scale(1.12);
        }
      }
      .modal {
        position: fixed;
        inset: 0;
        background: rgba(2, 6, 23, 0.78);
        display: none;
        align-items: flex-end;
        justify-content: center;
        z-index: 1000;
      }
      .modal.show {
        display: flex;
      }
      .modal-sheet {
        width: 100%;
        max-width: 480px;
        background: #0f172a;
        border-top-left-radius: 24px;
        border-top-right-radius: 24px;
        border: 1px solid rgba(59, 130, 246, 0.16);
        padding: 16px;
        max-height: 86vh;
        overflow: auto;
      }
      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
      }
      .modal-title {
        font-size: 20px;
        font-weight: 800;
        color: #f8fafc;
      }
      .close-btn {
        width: 40px;
        height: 40px;
        border-radius: 14px;
        border: none;
        background: rgba(30, 41, 59, 0.9);
        color: #f8fafc;
        font-size: 18px;
        cursor: pointer;
      }
      .tabs {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 10px;
        margin-bottom: 14px;
      }
      .tab-btn {
        border: none;
        border-radius: 16px;
        padding: 12px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 800;
        color: #e2e8f0;
        background: rgba(30, 41, 59, 0.9);
      }
      .tab-btn.active {
        color: #fff;
        background: linear-gradient(135deg, #2563eb, #60a5fa);
      }
      .modal-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .tile {
        background: rgba(30, 41, 59, 0.92);
        border: 1px solid rgba(148, 163, 184, 0.14);
        border-radius: 18px;
        padding: 14px;
      }
      .tile-title {
        color: #94a3b8;
        font-size: 13px;
        margin-bottom: 8px;
      }
      .tile-value {
        color: #f8fafc;
        font-size: 18px;
        font-weight: 800;
      }
      .tile-row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-top: 10px;
        color: #cbd5e1;
        font-size: 13px;
      }
      .buy-btn {
        width: 100%;
        border: none;
        border-radius: 14px;
        padding: 12px;
        margin-top: 12px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 800;
        color: #fff;
        background: linear-gradient(135deg, #2563eb, #60a5fa);
      }
      .buy-btn.green {
        background: linear-gradient(135deg, #15803d, #22c55e);
      }
      .buy-btn.gold {
        background: linear-gradient(135deg, #b45309, #f59e0b);
      }
      .note {
        color: #94a3b8;
        font-size: 13px;
        line-height: 1.45;
      }
      .warn {
        color: #fca5a5;
        font-size: 13px;
        line-height: 1.45;
        margin-top: 8px;
        font-weight: 700;
      }
      .wheel-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .wheel-disc {
        width: 240px;
        height: 240px;
        border-radius: 50%;
        border: 8px solid #1d4ed8;
        background: conic-gradient(
          #60a5fa 0deg 45deg,
          #1e40af 45deg 90deg,
          #93c5fd 90deg 135deg,
          #2563eb 135deg 180deg,
          #60a5fa 180deg 225deg,
          #1e40af 225deg 270deg,
          #93c5fd 270deg 315deg,
          #2563eb 315deg 360deg
        );
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
        position: relative;
        overflow: hidden;
        transition: transform 3.2s cubic-bezier(0.18, 0.89, 0.32, 1.08);
      }
      .wheel-center {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 78px;
        height: 78px;
        border-radius: 50%;
        background: #0f172a;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 16px;
        border: 4px solid #60a5fa;
        z-index: 5;
      }
      .wheel-pointer {
        width: 0;
        height: 0;
        border-left: 16px solid transparent;
        border-right: 16px solid transparent;
        border-top: 24px solid #f8fafc;
        margin-bottom: -8px;
      }
      .wheel-label {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 74px;
        margin-left: -37px;
        text-align: center;
        transform-origin: center -72px;
        z-index: 2;
        pointer-events: none;
      }
      .wheel-label span {
        display: block;
        font-size: 12px;
        font-weight: 800;
        color: #ffffff;
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.45);
        line-height: 1.15;
      }
      .share-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        align-items: center;
      }
      .code-box,
      .input-box {
        width: 100%;
        padding: 12px;
        border-radius: 12px;
        border: none;
        background: #1e293b;
        color: #fff;
        font-size: 14px;
      }
      .full {
        grid-column: 1 / -1;
      }
      .levelup-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(2, 6, 23, 0.78);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2000;
      }
      .levelup-box {
        width: calc(100% - 32px);
        max-width: 360px;
        background: #0f172a;
        border: 1px solid rgba(59, 130, 246, 0.18);
        border-radius: 24px;
        padding: 20px 18px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        text-align: center;
      }
      .levelup-title {
        font-size: 28px;
        font-weight: 900;
        margin-bottom: 10px;
        color: #f8fafc;
      }
      .levelup-level {
        font-size: 20px;
        font-weight: 800;
        color: #60a5fa;
        margin-bottom: 12px;
      }
      .levelup-reward {
        color: #cbd5e1;
        font-size: 16px;
        line-height: 1.5;
        margin-bottom: 16px;
      }
      .levelup-btn {
        width: 100%;
        border: none;
        border-radius: 16px;
        padding: 14px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 800;
        color: white;
        background: linear-gradient(135deg, #2563eb, #60a5fa);
      }
      .wheel-rewards-box {
        width: 100%;
        max-width: 320px;
        background: rgba(30, 41, 59, 0.92);
        border: 1px solid rgba(148, 163, 184, 0.14);
        border-radius: 18px;
        padding: 12px;
        text-align: center;
      }
      .wheel-rewards-title {
        font-size: 14px;
        font-weight: 800;
        color: #f8fafc;
        margin-bottom: 8px;
      }
      .wheel-rewards-list {
        color: #cbd5e1;
        font-size: 13px;
        line-height: 1.6;
      }
      .wheel-disc {
        overflow: hidden;
      }
      .wheel-label {
        position: absolute;
        left: 50%;
        top: 50%;
        transform-origin: 0 0;
        font-size: 12px;
        font-weight: 800;
        color: #ffffff;
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.45);
        pointer-events: none;
        white-space: nowrap;
      }
      .wheel-label span {
        display: inline-block;
        transform: translate(-50%, -50%);
      }
      #resultBox {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="card">
        <div class="top-row">
          <div>
            <div class="title">🚜 My Farm Clicker</div>
            <div class="subtitle">Ферма в Telegram Mini App</div>
          </div>
          <div class="level-badge" id="levelBadge">LVL 1</div>
        </div>
        <div class="stats-grid">
          <div class="stat-box">
            <div class="stat-label">Coins</div>
            <div class="stat-value" id="coins">0</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Diamonds</div>
            <div class="stat-value" id="diamonds">0</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Points</div>
            <div class="stat-value" id="points">0</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">XP</div>
            <div class="stat-value" id="xp">0</div>
          </div>
        </div>
        <div class="status-line" id="boostStatus">⚡ OFF | 🤖 OFF | 👑 OFF</div>
      </div>
      <div class="card">
        <div class="section-title">💰 Тапай і заробляй</div>
        <div class="tap-wrap">
          <button class="tap-btn" id="tapBtn">TAP</button>
          <div class="tap-hint">1 тап = 1 монета</div>
        </div>
        <div class="status-line" id="status">ok</div>
      </div>
      <div class="card">
        <div class="section-title">🗂 Меню</div>
        <div class="menu-grid">
          <button class="menu-btn" id="animalsBtn">
            <span class="menu-emoji">🐔</span><span>Тварини</span></button
          ><button class="menu-btn" id="storageBtn">
            <span class="menu-emoji">📦</span><span>Склад</span></button
          ><button class="menu-btn" id="feedBtn">
            <span class="menu-emoji">🌾</span><span>Корм</span></button
          ><button class="menu-btn" id="labBtn">
            <span class="menu-emoji">🧪</span><span>Лабораторія</span></button
          ><button class="menu-btn" id="dailyBtn">
            <span class="menu-emoji">🎁</span><span>Daily</span></button
          ><button class="menu-btn" id="questsBtn">
            <span class="menu-emoji">📜</span><span>Квести</span></button
          ><button class="menu-btn" id="wheelBtn">
            <span class="menu-emoji">🎰</span><span>Wheel</span></button
          ><button class="menu-btn" id="shopBtn">
            <span class="menu-emoji">💎</span><span>Diamonds</span></button
          ><button class="menu-btn" id="boostBtn">
            <span class="menu-emoji">⚡</span><span>Boosters</span></button
          ><button class="menu-btn" id="refsBtn">
            <span class="menu-emoji">👥</span><span>Referrals</span></button
          ><button class="menu-btn" id="refreshBtn">
            <span class="menu-emoji">🔄</span><span>Оновити</span>
          </button>
        </div>
        <button class="main-btn" id="loadStateBtn">Оновити стан</button>
      </div>
      <div id="resultBox">ще нічого</div>
    </div>
    <div class="modal" id="modal">
      <div class="modal-sheet">
        <div class="modal-header">
          <div class="modal-title" id="modalTitle">Вікно</div>
          <button class="close-btn" id="closeModalBtn">✕</button>
        </div>
        <div id="modalTabs" style="display: none">
          <div class="tabs">
            <button class="tab-btn active" id="tabBuyBtn">Купити</button
            ><button class="tab-btn" id="tabOwnedBtn">Мої</button
            ><button class="tab-btn" id="tabUpgradeBtn">Upgrade</button>
          </div>
        </div>
        <div id="modalBody"></div>
      </div>
    </div>
    <script>
      const tg = window.Telegram?.WebApp;
      const API = "https://tg-farm-api.onrender.com/api";
      const BOT_USERNAME = "my_farm_clicker_bot";
      if (tg) {
        tg.ready();
        tg.expand();
      }
      const initData = tg?.initData ?? "";
      const shareBase = `https://t.me/${BOT_USERNAME}?start=ref_`;
      const modal = document.getElementById("modal"),
        modalTitle = document.getElementById("modalTitle"),
        modalBody = document.getElementById("modalBody"),
        modalTabs = document.getElementById("modalTabs"),
        tabBuyBtn = document.getElementById("tabBuyBtn"),
        tabOwnedBtn = document.getElementById("tabOwnedBtn"),
        tabUpgradeBtn = document.getElementById("tabUpgradeBtn"),
        resultBox = document.getElementById("resultBox"),
        statusEl = document.getElementById("status"),
        coinsEl = document.getElementById("coins"),
        diamondsEl = document.getElementById("diamonds"),
        pointsEl = document.getElementById("points"),
        xpEl = document.getElementById("xp"),
        levelBadgeEl = document.getElementById("levelBadge"),
        boostStatusEl = document.getElementById("boostStatus");
      let currentState = null;
      let wheelRotation = 0;
      function setStatus(t) {
        statusEl.textContent = t;
      }
      function setResult(d) {
        resultBox.textContent =
          typeof d === "string" ? d : JSON.stringify(d, null, 2);
      }
      async function apiGet(path) {
        const res = await fetch(`${API}${path}`, {
          method: "GET",
          headers: { "x-telegram-init-data": initData },
        });
        const text = await res.text();
        let json;
        try {
          json = JSON.parse(text);
        } catch {
          json = text;
        }
        return { ok: res.ok, data: json };
      }
      async function apiPost(path, body = {}) {
        const res = await fetch(`${API}${path}`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-telegram-init-data": initData,
          },
          body: JSON.stringify(body),
        });
        const text = await res.text();
        let json;
        try {
          json = JSON.parse(text);
        } catch {
          json = text;
        }
        return { ok: res.ok, data: json };
      }
      function spawnFloatingText(text) {
        const el = document.createElement("div");
        el.className = "floating";
        el.textContent = text;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 900);
      }
      function showToast(text) {
        spawnFloatingText(text);
      }
      function showLevelUpPopup(level, reward) {
        const old = document.getElementById("levelUpPopup");
        if (old) old.remove();

        const coins = reward?.coins ?? 0;
        const diamonds = reward?.diamonds ?? 0;

        let rewardText = "";
        if (coins) rewardText += `💰 +${coins} coins`;
        if (diamonds)
          rewardText += `${rewardText ? "<br>" : ""}💎 +${diamonds} diamonds`;
        if (!rewardText) rewardText = "Новий рівень!";

        const html = `
          <div class="levelup-backdrop" id="levelUpPopup">
            <div class="levelup-box">
              <div class="levelup-title">🎉 LEVEL UP</div>
              <div class="levelup-level">Тепер ти LVL ${level}</div>
              <div class="levelup-reward">${rewardText}</div>
              <button class="levelup-btn" id="levelUpOkBtn">Круто</button>
            </div>
          </div>
        `;

        document.body.insertAdjacentHTML("beforeend", html);
        document
          .getElementById("levelUpOkBtn")
          ?.addEventListener("click", () => {
            document.getElementById("levelUpPopup")?.remove();
          });
      }
      function applyState(data) {
        currentState = data;
        coinsEl.textContent = data?.coins ?? 0;
        diamondsEl.textContent = data?.diamonds ?? 0;
        pointsEl.textContent = data?.points ?? 0;
        xpEl.textContent = data?.xp ?? 0;
        levelBadgeEl.textContent = `LVL ${data?.level ?? 1}`;
        const boost = data?.boost?.active ? "ON" : "OFF";
        const auto = data?.autoCollect?.active ? "ON" : "OFF";
        const vip = data?.vip?.active ? "ON" : "OFF";
        boostStatusEl.innerText = `⚡ ${boost} | 🤖 ${auto} | 👑 ${vip}`;
      }
      async function loadState() {
        try {
          setStatus("loading...");
          const res = await apiGet("/state");
          setResult(res.data);
          if (res.ok) {
            applyState(res.data);
            setStatus("ok");
          } else {
            setStatus("error");
          }
        } catch (e) {
          setStatus("error");
          setResult(String(e));
        }
      }
      async function collect() {
        try {
          setStatus("collect...");
          const res = await apiPost("/collect");
          setResult(res.data);

          if (res.ok) {
            showToast(`+${res.data?.coinsAdded ?? 1}`);

            if (res.data?.levelUp) {
              showLevelUpPopup(
                res.data?.level ?? currentState?.level ?? 1,
                res.data?.reward ?? {},
              );
            }

            await loadState();
            setStatus("ok");
          } else {
            setStatus("error");
          }
        } catch (e) {
          setStatus("error");
          setResult(String(e));
        }
      }
      function showModal() {
        modal.classList.add("show");
      }
      function closeModal() {
        modal.classList.remove("show");
      }
      modal.addEventListener("click", (e) => {
        if (e.target === modal) closeModal();
      });
      async function buyAnimal(type) {
        const res = await apiPost("/buy-animal", { type });
        setResult(res.data);
        if (res.ok) {
          showToast("Куплено");
          await loadState();
          renderAnimalsOwned();
        } else {
          showToast(res.data?.error || "Помилка");
        }
      }
      function renderAnimalsBuy() {
        tabBuyBtn.classList.add("active");
        tabOwnedBtn.classList.remove("active");
        tabUpgradeBtn.classList.remove("active");

      async function openDailyModal() {
        modalTitle.textContent = "🎁 Daily";
        modalTabs.style.display = "none";

        const res = await apiGet("/daily/status");
        const data = res.data || {};

        const streak = data.streak ?? 0;
        const canClaim = !!data.canClaim;
        const nextDay = data.nextDay ?? 1;
        const rewards = Array.isArray(data.rewards) ? data.rewards : [];

        let daysHtml = "";
        if (rewards.length) {
          const items = rewards
            .map((r) => {
              const claimed =
                r.day < nextDay || (!canClaim && r.day === streak);
              const current = canClaim && r.day === nextDay;

              let rewardText = "";
              if (r.coins) rewardText += `💰${r.coins}`;
              if (r.diamonds)
                rewardText += `${rewardText ? "<br>" : ""}💎${r.diamonds}`;
              if (r.freeWheelSpin)
                rewardText += `${rewardText ? "<br>" : ""}🎰`;

              const bg = claimed
                ? "rgba(55,201,93,0.18)"
                : current
                  ? "rgba(93,156,255,0.22)"
                  : "rgba(255,255,255,0.05)";

              const mark = claimed ? "✓" : current ? "зараз" : "";

              return `<div style="padding:10px 6px;border-radius:14px;text-align:center;border:1px solid rgba(255,255,255,0.08);background:${bg};">
              <div style="font-size:12px;color:#aebedd;">${r.day}</div>
              <div style="margin-top:6px;font-size:12px;font-weight:800;">${rewardText || "-"}</div>
              <div style="margin-top:6px;font-size:11px;color:#cbd5e1;">${mark}</div>
            </div>`;
            })
            .join("");

          daysHtml = `<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:12px;">${items}</div>`;
        }

        const reward = data.reward || {};
        let todayRewardText = "";
        if (reward.coins) todayRewardText += `💰 ${reward.coins}`;
        if (reward.diamonds)
          todayRewardText += `${todayRewardText ? " " : ""}💎 ${reward.diamonds}`;
        if (reward.freeWheelSpin)
          todayRewardText += `${todayRewardText ? " " : ""}🎰 free spin`;

        modalBody.innerHTML = `
          <div class="tile">
            <div class="tile-title">Поточний streak</div>
            <div class="tile-value">${streak}</div>
            <div class="tile-row"><span>Наступний день</span><span>${nextDay}</span></div>
            <div class="tile-row"><span>Нагорода</span><span>${todayRewardText || "-"}</span></div>
            <button class="buy-btn ${canClaim ? "" : "green"}" id="claimDailyBtn">${canClaim ? "Забрати" : "Вже забрано"}</button>
          </div>
          ${daysHtml}
        `;

        showModal();

        document.getElementById("claimDailyBtn").onclick = async () => {
          if (!canClaim) {
            showToast("Вже забрано сьогодні");
            return;
          }

          const claimRes = await apiPost("/daily/claim");
          const finalRes = claimRes.ok ? claimRes : await apiPost("/daily");
          setResult(finalRes.data);

          if (finalRes.ok) {
            const rw = finalRes.data?.reward || finalRes.data?.rewardData || {};
            let txt = "";
            if (rw.coins) txt += `💰 ${rw.coins}`;
            if (rw.diamonds) txt += `${txt ? " " : ""}💎 ${rw.diamonds}`;
            if (rw.freeWheelSpin) txt += `${txt ? " " : ""}🎰`;

            showToast(txt || "Daily забрано");
            await loadState();
            await openDailyModal();
          } else {
            showToast(finalRes.data?.error || "Помилка");
          }
        };
      }
