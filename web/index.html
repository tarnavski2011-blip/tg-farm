<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>My Farm Clicker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        font-family: Arial, sans-serif;
        color: #e5e7eb;
        background: #06111f;
        touch-action: manipulation;
        overscroll-behavior: none;
      }
      .app {
        max-width: 480px;
        margin: 0 auto;
        min-height: 100vh;
        padding: 8px 6px 10px;
      }
      .game {
        position: relative;
        min-height: calc(100vh - 20px);
        overflow: hidden;
        border-radius: 28px;
        background: #06111f;
        border: 1px solid rgba(125, 211, 252, 0.26);
        box-shadow:
          0 22px 60px rgba(0, 0, 0, 0.5),
          inset 0 2px 0 rgba(255, 255, 255, 0.08);
      }
      .game:before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        background: linear-gradient(
          180deg,
          rgba(4, 12, 24, 0.58),
          transparent 20%,
          transparent 74%,
          rgba(4, 12, 24, 0.9)
        );
      }
      .farm-bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 1;
      }
      .hud {
        position: relative;
        z-index: 10;
        display: grid;
        grid-template-columns: 1.2fr 1fr 1fr;
        gap: 8px;
        padding: 10px;
        background: linear-gradient(
          180deg,
          rgba(6, 18, 34, 0.96),
          rgba(3, 10, 20, 0.96)
        );
        border-bottom: 1px solid rgba(125, 211, 252, 0.18);
      }
      .player {
        display: grid;
        grid-template-columns: 52px 1fr;
        gap: 8px;
        align-items: center;
        min-width: 0;
      }
      .avatar {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 30px;
        background: linear-gradient(135deg, #0ea5ff, #1764ff);
        border: 2px solid rgba(255, 255, 255, 0.24);
      }
      .name {
        font-size: 17px;
        font-weight: 1000;
        color: #fff;
      }
      .lvl {
        color: #b8cbe3;
        font-size: 11px;
        font-weight: 900;
        margin-top: 5px;
      }
      .xpbar {
        height: 10px;
        margin-top: 5px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.55);
        overflow: hidden;
      }
      .xpbar span {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #43e329, #a3e635);
      }
      .resource {
        display: grid;
        grid-template-columns: 42px 1fr;
        gap: 8px;
        align-items: center;
        padding: 9px;
        border-radius: 16px;
        background: linear-gradient(
          180deg,
          rgba(14, 35, 59, 0.94),
          rgba(4, 13, 25, 0.94)
        );
        border: 1px solid rgba(125, 211, 252, 0.18);
        min-width: 0;
      }
      .res-icon {
        font-size: 30px;
      }
      .res-val {
        font-size: 19px;
        font-weight: 1000;
        color: #fff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .res-sub {
        font-size: 11px;
        font-weight: 900;
        color: #b8cbe3;
      }
      .warehouse {
        position: relative;
        z-index: 10;
        margin: 8px 10px 0;
        display: grid;
        grid-template-columns: 78px 1fr 112px;
        gap: 10px;
        align-items: center;
        padding: 10px;
        border-radius: 20px;
        background: linear-gradient(
          180deg,
          rgba(13, 81, 159, 0.9),
          rgba(5, 27, 62, 0.95)
        );
        border: 1px solid rgba(125, 211, 252, 0.28);
        cursor: pointer;
      }
      .wh-icon {
        font-size: 48px;
      }
      .wh-title {
        font-size: 17px;
        font-weight: 1000;
        color: #fff;
      }
      .wh-bar {
        height: 18px;
        margin-top: 8px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.62);
        overflow: hidden;
      }
      .wh-bar span {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #ffdf3d, #ff9f0a);
      }
      .wh-cap {
        text-align: center;
        color: #dbeafe;
        font-size: 12px;
        font-weight: 900;
        margin-top: 5px;
      }
      .upgrade {
        border: none;
        border-radius: 16px;
        padding: 12px 8px;
        color: #fff;
        background: linear-gradient(180deg, #7cff32, #129909);
        font-weight: 1000;
      }
      .status {
        position: relative;
        z-index: 10;
        margin: 8px 10px 0;
        text-align: center;
        padding: 8px;
        border-radius: 999px;
        background: rgba(2, 8, 18, 0.58);
        border: 1px solid rgba(125, 211, 252, 0.16);
        font-weight: 1000;
        color: #e5e7eb;
      }
      .side {
        position: absolute;
        z-index: 11;
        width: 64px;
        min-height: 70px;
        border: none;
        border-radius: 14px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        color: #fff;
        font-weight: 1000;
        background: linear-gradient(
          180deg,
          rgba(20, 45, 72, 0.96),
          rgba(4, 13, 25, 0.96)
        );
        border: 1px solid rgba(125, 211, 252, 0.28);
        box-shadow: 0 10px 22px rgba(0, 0, 0, 0.34);
      }
      .side-emoji {
        font-size: 31px;
      }
      .side span:last-child {
        font-size: 12px;
      }
      .badge {
        position: absolute;
        top: -9px;
        right: -9px;
        min-width: 25px;
        height: 25px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #ef2323;
        color: #fff;
        font-size: 13px;
        border: 2px solid rgba(255, 255, 255, 0.28);
      }
      .daily {
        top: 220px;
        left: 10px;
      }
      .tasks {
        top: 300px;
        left: 10px;
      }
      .refs {
        top: 380px;
        left: 10px;
      }
      .vip {
        top: 220px;
        right: 10px;
      }
      .boosts {
        top: 300px;
        right: 10px;
      }
      .wallet {
        top: 380px;
        right: 10px;
      }
      .bottom {
        position: absolute;
        z-index: 40;
        left: 12px;
        right: 12px;
        bottom: 12px;
        height: 88px;
        display: grid;
        grid-template-columns: 1fr 1fr 92px 1fr 1fr;
        gap: 7px;
        align-items: end;
        padding: 7px;
        border-radius: 24px;
        background: rgba(4, 12, 24, 0.88);
        border: 1px solid rgba(125, 211, 252, 0.22);
        box-shadow: 0 -12px 32px rgba(0, 0, 0, 0.42);
        overflow: visible;
      }
      .nav,
      .nav-tap {
        border: none;
        color: #fff;
        font-weight: 1000;
        border-radius: 17px;
        background: linear-gradient(
          180deg,
          rgba(20, 45, 72, 0.96),
          rgba(4, 13, 25, 0.96)
        );
        border: 1px solid rgba(125, 211, 252, 0.18);
      }
      .nav {
        height: 68px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .nav.active {
        background: linear-gradient(135deg, #0ea5ff, #1764ff);
      }
      .nav span {
        font-size: 28px;
      }
      .nav b {
        font-size: 12px;
        margin-top: 4px;
      }
      .nav-tap {
        width: 92px;
        height: 92px;
        border-radius: 50%;
        margin-bottom: 4px;
        align-self: end;
        justify-self: center;
        font-size: 21px;
        background: radial-gradient(
          circle at 34% 18%,
          #fff9b7,
          #ffd84d 38%,
          #ffae13 70%,
          #d97706
        );
        text-shadow: 0 3px 0 rgba(120, 53, 15, 0.45);
      }
      .modal {
        position: fixed;
        inset: 0;
        background: rgba(2, 6, 23, 0.78);
        display: none;
        align-items: flex-end;
        justify-content: center;
        z-index: 9999;
        backdrop-filter: blur(8px);
      }
      .modal.show {
        display: flex;
      }
      .sheet {
        width: 100%;
        max-width: 480px;
        max-height: 86vh;
        overflow: auto;
        background:
          radial-gradient(
            circle at top,
            rgba(14, 165, 255, 0.12),
            transparent 26%
          ),
          linear-gradient(180deg, #112d4d, #071424);
        border: 1px solid rgba(125, 211, 252, 0.24);
        border-top-left-radius: 30px;
        border-top-right-radius: 30px;
        padding: 16px;
      }
      .modal-header {
        position: relative;
        padding-right: 76px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
      }
      .modal-title {
        font-size: 24px;
        font-weight: 1000;
        color: #fff;
      }
      .close {
        position: absolute;
        right: 0;
        top: 0;
        width: 54px;
        height: 54px;
        border: none;
        border-radius: 18px;
        background: #1e293b;
        color: #fff;
        font-size: 24px;
      }
      .tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 14px;
      }
      .tab {
        border: none;
        border-radius: 16px;
        padding: 12px;
        font-weight: 1000;
        color: #e2e8f0;
        background: #1e293b;
      }
      .tab.active {
        color: #fff;
        background: linear-gradient(135deg, #2563eb, #60a5fa);
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .tile {
        border-radius: 20px;
        background: linear-gradient(180deg, #142f4f, #08182b);
        border: 1px solid rgba(125, 211, 252, 0.2);
        box-shadow:
          0 12px 24px rgba(0, 0, 0, 0.25),
          inset 0 2px 0 rgba(255, 255, 255, 0.07);
        padding: 14px;
      }
      .full {
        grid-column: 1/-1;
      }
      .tile-title {
        color: #94a3b8;
        font-size: 13px;
        margin-bottom: 8px;
      }
      .tile-value {
        color: #fff;
        font-size: 20px;
        font-weight: 1000;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-top: 10px;
        color: #cbd5e1;
        font-size: 13px;
      }
      .btn {
        width: 100%;
        border: none;
        border-radius: 16px;
        padding: 12px;
        margin-top: 12px;
        color: #fff;
        font-weight: 1000;
        background: linear-gradient(135deg, #10b5ff, #1764ff);
      }
      .btn.green {
        background: linear-gradient(135deg, #22c55e, #73f052);
      }
      .btn.gold {
        background: linear-gradient(135deg, #ff8a00, #ffcf25);
      }
      .animal-card {
        display: grid;
        grid-template-columns: 96px 1fr;
        gap: 12px;
        align-items: center;
      }
      .animal-img {
        width: 94px;
        height: 94px;
        object-fit: contain;
        filter: drop-shadow(0 12px 12px rgba(0, 0, 0, 0.32));
      }
      .levelchip {
        display: inline-block;
        padding: 7px 10px;
        border-radius: 999px;
        color: #fff;
        font-size: 11px;
        font-weight: 1000;
        background: linear-gradient(135deg, #0ea5ff, #1764ff);
      }
      .head {
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }
      .animal-title {
        color: #fff;
        font-size: 18px;
        font-weight: 1000;
      }
      .muted {
        color: #b8cbe3;
        font-size: 12px;
        font-weight: 900;
      }
      .income {
        text-align: right;
      }
      .income span {
        display: block;
        color: #9db7d4;
        font-size: 10px;
        font-weight: 1000;
        text-transform: uppercase;
      }
      .income b {
        color: #fff;
        font-size: 20px;
      }
      .bar-row {
        display: flex;
        justify-content: space-between;
        color: #dbeafe;
        font-size: 13px;
        font-weight: 900;
        margin-top: 8px;
      }
      .bar {
        height: 12px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(2, 8, 18, 0.72);
        margin-top: 4px;
      }
      .bar span {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #22c55e, #84cc16);
      }
      .mini {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 7px;
        margin-top: 12px;
      }
      .mini div {
        padding: 8px 6px;
        border-radius: 12px;
        background: rgba(2, 8, 18, 0.36);
        border: 1px solid rgba(125, 211, 252, 0.12);
        text-align: center;
      }
      .mini span {
        display: block;
        color: #9db7d4;
        font-size: 10px;
        font-weight: 1000;
      }
      .mini b {
        display: block;
        color: #fff;
        margin-top: 4px;
        font-size: 12px;
      }
      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .actions .btn {
        font-size: 12px;
        padding: 11px 8px;
      }
      .buy-img {
        width: 110px;
        height: 110px;
        object-fit: contain;
        margin: 0 auto 10px;
        display: block;
      }
      @media (max-width: 390px) {
        .resource {
          grid-template-columns: 32px 1fr;
          padding: 7px;
        }
        .res-icon {
          font-size: 24px;
        }
        .res-val {
          font-size: 15px;
        }
        .res-sub {
          font-size: 9px;
        }
        .warehouse {
          grid-template-columns: 56px 1fr 92px;
        }
        .animal-card {
          grid-template-columns: 82px 1fr;
        }
        .animal-img {
          width: 80px;
          height: 80px;
        }
        .mini {
          grid-template-columns: repeat(2, 1fr);
        }
        .head {
          flex-direction: column;
        }
        .income {
          text-align: left;
        }
      }

      /* V2.5 PREMIUM POLISHING */
      .hud {
        background:
          radial-gradient(
            circle at top left,
            rgba(56, 189, 248, 0.18),
            transparent 35%
          ),
          linear-gradient(180deg, rgba(7, 24, 45, 0.98), rgba(2, 8, 18, 0.96)) !important;
        border-radius: 0 0 22px 22px !important;
        box-shadow:
          0 14px 32px rgba(0, 0, 0, 0.38),
          inset 0 2px 0 rgba(255, 255, 255, 0.08) !important;
      }
      .resource,
      .warehouse,
      .side,
      .nav,
      .tile {
        box-shadow:
          0 14px 28px rgba(0, 0, 0, 0.3),
          inset 0 2px 0 rgba(255, 255, 255, 0.08) !important;
      }
      .resource:active,
      .side:active,
      .nav:active,
      .upgrade:active,
      .btn:active {
        transform: scale(0.96);
      }
      .xpbar,
      .wh-bar,
      .bar {
        box-shadow:
          inset 0 3px 7px rgba(0, 0, 0, 0.48),
          0 0 12px rgba(34, 197, 94, 0.18) !important;
      }
      .xpbar span,
      .wh-bar span,
      .bar span {
        background: linear-gradient(
          90deg,
          #22c55e,
          #a3e635,
          #facc15
        ) !important;
        box-shadow: 0 0 16px rgba(163, 230, 53, 0.55) !important;
      }
      .upgrade,
      .btn.green {
        box-shadow:
          0 0 22px rgba(34, 197, 94, 0.42),
          inset 0 2px 0 rgba(255, 255, 255, 0.25) !important;
      }
      .btn,
      .nav.active {
        box-shadow:
          0 0 22px rgba(14, 165, 255, 0.38),
          inset 0 2px 0 rgba(255, 255, 255, 0.18) !important;
      }
      .btn.gold {
        box-shadow:
          0 0 24px rgba(250, 204, 21, 0.45),
          inset 0 2px 0 rgba(255, 255, 255, 0.22) !important;
      }
      .tap-animated {
        animation: tapPulse 1.15s infinite ease-in-out;
        position: relative;
        overflow: visible !important;
      }
      .tap-animated span {
        display: block;
        font-size: 23px;
        line-height: 0.9;
      }
      .tap-animated small {
        display: block;
        font-size: 18px;
        margin-top: 2px;
      }
      .tap-animated:before {
        content: "";
        position: absolute;
        inset: -10px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(250, 204, 21, 0.35),
          transparent 62%
        );
        z-index: -1;
        animation: tapGlow 1.15s infinite ease-in-out;
      }
      @keyframes tapPulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.08);
        }
      }
      @keyframes tapGlow {
        0%,
        100% {
          opacity: 0.35;
          transform: scale(0.95);
        }
        50% {
          opacity: 0.9;
          transform: scale(1.18);
        }
      }
      .floating-coin {
        position: fixed;
        z-index: 20000;
        pointer-events: none;
        color: #fff;
        font-weight: 1000;
        font-size: 28px;
        text-shadow: 0 4px 12px rgba(0, 0, 0, 0.45);
        animation: coinFloat 0.8s ease-out forwards;
      }
      @keyframes coinFloat {
        from {
          opacity: 1;
          transform: translate(-50%, 0) scale(0.9);
        }
        to {
          opacity: 0;
          transform: translate(-50%, -75px) scale(1.15);
        }
      }
      .daily-calendar {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }
      .daily-day {
        padding: 12px 8px;
        border-radius: 16px;
        background: linear-gradient(180deg, #143052, #07182b);
        border: 1px solid rgba(125, 211, 252, 0.2);
        text-align: center;
        font-weight: 1000;
      }
      .daily-day.active {
        background: linear-gradient(135deg, #0ea5ff, #1764ff);
        box-shadow: 0 0 18px rgba(14, 165, 255, 0.36);
      }
      .wheel {
        width: 230px;
        height: 230px;
        border-radius: 50%;
        margin: 10px auto;
        background: conic-gradient(
          #22c55e 0 45deg,
          #0ea5ff 45deg 90deg,
          #f59e0b 90deg 135deg,
          #a855f7 135deg 180deg,
          #ef4444 180deg 225deg,
          #14b8a6 225deg 270deg,
          #facc15 270deg 315deg,
          #1764ff 315deg 360deg
        );
        border: 8px solid rgba(255, 255, 255, 0.18);
        box-shadow:
          0 20px 40px rgba(0, 0, 0, 0.4),
          0 0 30px rgba(14, 165, 255, 0.25);
        display: grid;
        place-items: center;
        color: white;
        font-size: 34px;
        font-weight: 1000;
      }
      .topbtn {
        top: 460px;
        left: 10px;
      }
      .wheelbtn {
        top: 460px;
        right: 10px;
      }
      .wallet-usdt {
        font-size: 32px !important;
        color: #22c55e !important;
      }
      .stars-card {
        background:
          radial-gradient(
            circle at top,
            rgba(59, 130, 246, 0.28),
            transparent 36%
          ),
          linear-gradient(180deg, #172554, #070b20) !important;
      }
      @media (max-height: 760px) {
        .topbtn {
          top: 428px;
        }
        .wheelbtn {
          top: 428px;
        }
      }

      /* BUTTON ROUTES FIX + TOAST */
      .toast-fix {
        position: fixed;
        left: 50%;
        bottom: 130px;
        transform: translateX(-50%);
        z-index: 30000;
        max-width: 86%;
        padding: 12px 16px;
        border-radius: 16px;
        background: rgba(2, 8, 18, 0.92);
        border: 1px solid rgba(125, 211, 252, 0.25);
        color: #fff;
        font-weight: 900;
        font-size: 14px;
        text-align: center;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
        opacity: 0;
        pointer-events: none;
        transition: 0.2s ease;
      }
      .toast-fix.show {
        opacity: 1;
        transform: translateX(-50%) translateY(-8px);
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="game">
        <img
          class="farm-bg"
          src="/assets/farm_reference_bg_v5.jpg"
          alt="farm"
        />
        <div class="hud">
          <div class="player">
            <div class="avatar">👨‍🌾</div>
            <div>
              <div class="name">Farmer</div>
              <div class="lvl" id="levelBadge">LVL 1</div>
              <div class="xpbar"><span id="xpBar"></span></div>
            </div>
          </div>
          <div class="resource">
            <div class="res-icon">🪙</div>
            <div>
              <div class="res-val" id="coins">0</div>
              <div class="res-sub">+1 / tap</div>
            </div>
          </div>
          <div class="resource">
            <div class="res-icon">💎</div>
            <div>
              <div class="res-val" id="diamonds">0</div>
              <div class="res-sub">premium</div>
            </div>
          </div>
        </div>
        <div class="warehouse" id="warehouseBtn">
          <div class="wh-icon">🏚️</div>
          <div>
            <div class="wh-title">Warehouse</div>
