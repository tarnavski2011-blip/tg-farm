<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>My Farm Clicker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        color: #e5e7eb;
        background:
          radial-gradient(
            circle at top,
            rgba(59, 130, 246, 0.18),
            transparent 30%
          ),
          linear-gradient(180deg, #0b1220 0%, #111827 45%, #0f172a 100%);
      }
      .app {
        max-width: 480px;
        margin: 0 auto;
        min-height: 100vh;
        padding: 16px 14px 28px;
      }
      .card {
        background: rgba(17, 24, 39, 0.88);
        border: 1px solid rgba(59, 130, 246, 0.18);
        border-radius: 24px;
        padding: 16px;
        margin-bottom: 16px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.25);
        backdrop-filter: blur(8px);
      }
      .top-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
      }
      .title {
        font-size: 28px;
        font-weight: 800;
        color: #f8fafc;
        line-height: 1.1;
      }
      .subtitle {
        margin-top: 6px;
        color: #94a3b8;
        font-size: 13px;
      }
      .level-badge {
        min-width: 90px;
        text-align: center;
        padding: 14px 12px;
        border-radius: 18px;
        font-size: 16px;
        font-weight: 800;
        color: #fff;
        background: linear-gradient(135deg, #2563eb, #60a5fa);
        box-shadow: 0 10px 24px rgba(37, 99, 235, 0.28);
      }
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }
      .stat-box {
        background: rgba(30, 41, 59, 0.85);
        border: 1px solid rgba(148, 163, 184, 0.14);
        border-radius: 18px;
        padding: 12px 8px;
        text-align: center;
      }
      .stat-label {
        color: #94a3b8;
        font-size: 11px;
        margin-bottom: 8px;
      }
      .stat-value {
        color: #f8fafc;
        font-size: 18px;
        font-weight: 800;
      }
      .section-title {
        font-size: 18px;
        font-weight: 800;
        color: #f8fafc;
        margin-bottom: 12px;
      }
      .status-line {
        margin-top: 12px;
        text-align: center;
        color: #cbd5e1;
        font-size: 14px;
        font-weight: 700;
        line-height: 1.5;
      }
      .tap-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 10px 0 2px;
      }
      .tap-btn {
        width: 200px;
        height: 200px;
        border: none;
        border-radius: 50%;
        cursor: pointer;
        color: #fff;
        font-size: 34px;
        font-weight: 900;
        letter-spacing: 1px;
        background: radial-gradient(
          circle at 30% 20%,
          #93c5fd,
          #3b82f6 55%,
          #1d4ed8 100%
        );
        box-shadow:
          0 20px 50px rgba(37, 99, 235, 0.34),
          inset 0 8px 18px rgba(255, 255, 255, 0.22);
        transition: transform 0.08s ease;
      }
      .tap-btn:active {
        transform: scale(0.96);
      }
      .tap-hint {
        margin-top: 18px;
        text-align: center;
        color: #94a3b8;
        font-size: 14px;
      }
      .menu-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }
      .menu-btn {
        background: rgba(30, 41, 59, 0.85);
        border: 1px solid rgba(148, 163, 184, 0.14);
        border-radius: 22px;
        min-height: 98px;
        padding: 12px 8px;
        cursor: pointer;
        color: #f8fafc;
        font-size: 13px;
        font-weight: 800;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .menu-emoji {
        font-size: 30px;
        line-height: 1;
      }
      .main-btn {
        width: 100%;
        border: none;
        border-radius: 18px;
        padding: 16px;
        margin-top: 12px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 800;
        color: white;
        background: linear-gradient(135deg, #2563eb, #60a5fa);
        box-shadow: 0 12px 28px rgba(37, 99, 235, 0.25);
      }
      .floating {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: 240px;
        z-index: 999;
        pointer-events: none;
        font-size: 24px;
        font-weight: 900;
        color: #93c5fd;
        text-shadow: 0 2px 14px rgba(59, 130, 246, 0.5);
        animation: floatUp 0.9s ease forwards;
      }
      @keyframes floatUp {
        0% {
          opacity: 1;
          transform: translateX(-50%) translateY(0) scale(0.95);
        }
        100% {
          opacity: 0;
          transform: translateX(-50%) translateY(-70px) scale(1.12);
        }
      }
      .modal {
        position: fixed;
        inset: 0;
        background: rgba(2, 6, 23, 0.78);
        display: none;
        align-items: flex-end;
        justify-content: center;
        z-index: 1000;
      }
      .modal.show {
        display: flex;
      }
      .modal-sheet {
        width: 100%;
        max-width: 480px;
        background: #0f172a;
        border-top-left-radius: 24px;
        border-top-right-radius: 24px;
        border: 1px solid rgba(59, 130, 246, 0.16);
        padding: 16px;
        max-height: 86vh;
        overflow: auto;
      }
      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
      }
      .modal-title {
        font-size: 20px;
        font-weight: 800;
        color: #f8fafc;
      }
      .close-btn {
        width: 40px;
        height: 40px;
        border-radius: 14px;
        border: none;
        background: rgba(30, 41, 59, 0.9);
        color: #f8fafc;
        font-size: 18px;
        cursor: pointer;
      }
      .tabs {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 10px;
        margin-bottom: 14px;
      }
      .tab-btn {
        border: none;
        border-radius: 16px;
        padding: 12px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 800;
        color: #e2e8f0;
        background: rgba(30, 41, 59, 0.9);
      }
      .tab-btn.active {
        color: #fff;
        background: linear-gradient(135deg, #2563eb, #60a5fa);
      }
      .modal-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .tile {
        background: rgba(30, 41, 59, 0.92);
        border: 1px solid rgba(148, 163, 184, 0.14);
        border-radius: 18px;
        padding: 14px;
      }
      .tile-title {
        color: #94a3b8;
        font-size: 13px;
        margin-bottom: 8px;
      }
      .tile-value {
        color: #f8fafc;
        font-size: 18px;
        font-weight: 800;
      }
      .tile-row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-top: 10px;
        color: #cbd5e1;
        font-size: 13px;
      }
      .buy-btn {
        width: 100%;
        border: none;
        border-radius: 14px;
        padding: 12px;
        margin-top: 12px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 800;
        color: #fff;
        background: linear-gradient(135deg, #2563eb, #60a5fa);
      }
      .buy-btn.green {
        background: linear-gradient(135deg, #15803d, #22c55e);
      }
      .buy-btn.gold {
        background: linear-gradient(135deg, #b45309, #f59e0b);
      }
      .note {
        color: #94a3b8;
        font-size: 13px;
        line-height: 1.45;
      }
      .warn {
        color: #fca5a5;
        font-size: 13px;
        line-height: 1.45;
        margin-top: 8px;
        font-weight: 700;
      }
      .wheel-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .wheel-disc {
        width: 220px;
        height: 220px;
        border-radius: 50%;
        border: 8px solid #1d4ed8;
        background: conic-gradient(
          #60a5fa 0 60deg,
          #1e40af 60deg 120deg,
          #93c5fd 120deg 180deg,
          #2563eb 180deg 240deg,
          #60a5fa 240deg 300deg,
          #1e40af 300deg 360deg
        );
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
        position: relative;
        transition: transform 3s cubic-bezier(0.18, 0.89, 0.32, 1.08);
      }
      .wheel-center {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: #0f172a;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        border: 4px solid #60a5fa;
      }
      .wheel-pointer {
        width: 0;
        height: 0;
        border-left: 14px solid transparent;
        border-right: 14px solid transparent;
        border-top: 22px solid #f8fafc;
        margin-bottom: -8px;
      }
      .share-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        align-items: center;
      }
      .code-box,
      .input-box {
        width: 100%;
        padding: 12px;
        border-radius: 12px;
        border: none;
        background: #1e293b;
        color: #fff;
        font-size: 14px;
      }
      .full {
        grid-column: 1 / -1;
      }
      #resultBox {
        display: none;
      }
      .daily-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin-bottom: 15px;
      }

      .daily-item {
        background: #1e293b;
        border-radius: 12px;
        padding: 10px;
        text-align: center;
        font-size: 12px;
      }

      .daily-item.active {
        border: 2px solid #3b82f6;
      }

      .daily-item.done {
        opacity: 0.5;
      }

      .daily-item .day {
        font-weight: 700;
        margin-bottom: 5px;
      }

      .daily-item .reward {
        font-size: 11px;
      }
      .quest-tabs {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-bottom: 14px;
      }

      .quest-tab-btn {
        border: none;
        border-radius: 14px;
        padding: 12px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 800;
        color: #e2e8f0;
        background: rgba(30, 41, 59, 0.9);
      }

      .quest-tab-btn.active {
        color: #fff;
        background: linear-gradient(135deg, #2563eb, #60a5fa);
      }

      .chance-green {
        color: #22c55e;
        font-weight: 900;
      }

      .chance-gold {
        color: #facc15;
        font-weight: 900;
      }

      .chance-danger {
        color: #f87171;
        font-weight: 900;
      }

      .unlock-progress {
        color: #93c5fd;
        font-weight: 800;
      }

      .levelup-modal {
        position: fixed;
        inset: 0;
        background: rgba(2, 6, 23, 0.82);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 2000;
        padding: 20px;
      }

      .levelup-modal.show {
        display: flex;
      }

      .levelup-card {
        width: 100%;
        max-width: 360px;
        background: linear-gradient(180deg, #111827, #0f172a);
        border: 1px solid rgba(250, 204, 21, 0.35);
        border-radius: 28px;
        padding: 24px;
        text-align: center;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
        animation: levelPop 0.25s ease-out;
      }

      @keyframes levelPop {
        from {
          transform: scale(0.86);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }

      .levelup-title {
        font-size: 28px;
        font-weight: 900;
        color: #facc15;
        margin-bottom: 8px;
      }

      .levelup-level {
        font-size: 38px;
        font-weight: 900;
        color: #f8fafc;
        margin-bottom: 16px;
      }

      .levelup-reward {
        background: rgba(30, 41, 59, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.16);
        border-radius: 18px;
        padding: 14px;
        margin: 10px 0;
        font-size: 18px;
        font-weight: 800;
        color: #e5e7eb;
      }

      .levelup-note {
        color: #94a3b8;
        font-size: 13px;
        margin-top: 10px;
        line-height: 1.4;
      }

      /* SHOP + BOOSTERS + VIP V4 PRO */
      .v4-shop-hero,
      .v4-boost-hero,
      .v4-vip-hero {
        position: relative;
        overflow: hidden;
        border-radius: 22px;
        padding: 16px;
        background:
          radial-gradient(
            circle at top right,
            rgba(14, 165, 255, 0.22),
            transparent 34%
          ),
          linear-gradient(180deg, #173a5f, #08192d);
        border: 1px solid rgba(125, 211, 252, 0.22);
        box-shadow:
          inset 0 2px 0 rgba(255, 255, 255, 0.08),
          0 12px 26px rgba(0, 0, 0, 0.24);
      }

      .v4-vip-hero {
        background:
          radial-gradient(
            circle at top,
            rgba(250, 204, 21, 0.35),
            transparent 38%
          ),
          linear-gradient(180deg, #4a3104, #0b0803);
        border-color: rgba(250, 204, 21, 0.35);
      }

      .v4-hero-title {
        color: #fff;
        font-size: 24px;
        font-weight: 1000;
      }

      .v4-hero-sub {
        margin-top: 6px;
        color: #c7ddf4;
        font-size: 13px;
        font-weight: 900;
        line-height: 1.35;
      }

      .v4-shop-tabs {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        margin: 12px 0;
      }

      .v4-shop-tab {
        border: none;
        border-radius: 15px;
        padding: 11px 8px;
        color: #dbeafe;
        font-weight: 1000;
        background: linear-gradient(180deg, #173a5f, #07182c);
        border: 1px solid rgba(125, 211, 252, 0.16);
      }

      .v4-shop-tab.active {
        color: #fff;
        background: linear-gradient(135deg, #0ea5ff, #1764ff);
        box-shadow: 0 10px 22px rgba(14, 165, 255, 0.24);
      }

      .v4-product-card {
        position: relative;
        overflow: hidden;
        min-height: 210px;
      }

      .v4-product-top {
        display: flex;
        align-items: flex-start;
        gap: 12px;
      }

      .v4-product-icon {
        width: 72px;
        height: 72px;
        border-radius: 20px;
        display: grid;
        place-items: center;
        font-size: 42px;
        background: linear-gradient(
          180deg,
          rgba(20, 45, 72, 0.98),
          rgba(6, 17, 32, 0.98)
        );
        border: 1px solid rgba(125, 211, 252, 0.18);
        box-shadow:
          inset 0 2px 0 rgba(255, 255, 255, 0.08),
          0 10px 20px rgba(0, 0, 0, 0.22);
      }

      .v4-product-name {
        color: #fff;
        font-size: 18px;
        font-weight: 1000;
      }

      .v4-product-desc {
        margin-top: 5px;
        color: #b8cbe3;
        font-size: 12px;
        font-weight: 800;
        line-height: 1.35;
      }

      .v4-price-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-top: 12px;
        padding: 10px;
        border-radius: 15px;
        background: rgba(2, 8, 18, 0.38);
        border: 1px solid rgba(125, 211, 252, 0.12);
      }

      .v4-price-label {
        color: #9db7d4;
        font-size: 11px;
        font-weight: 1000;
        text-transform: uppercase;
      }

      .v4-price-value {
        color: #fff;
        font-size: 18px;
        font-weight: 1000;
      }

      .v4-product-badge {
        position: absolute;
        top: 12px;
        right: 12px;
        padding: 6px 9px;
        border-radius: 999px;
        color: #fff;
        font-size: 10px;
        font-weight: 1000;
        background: linear-gradient(135deg, #22c55e, #84cc16);
      }

      .v4-product-badge.gold {
        background: linear-gradient(135deg, #ff8a00, #ffcf25);
      }

      .v4-product-badge.blue {
        background: linear-gradient(135deg, #0ea5ff, #1764ff);
      }

      .v4-boost-card {
        display: grid;
        grid-template-columns: 72px 1fr auto;
        gap: 12px;
        align-items: center;
      }

      .v4-boost-icon {
        width: 72px;
        height: 72px;
        border-radius: 20px;
        display: grid;
        place-items: center;
        font-size: 40px;
        background: linear-gradient(180deg, #173a5f, #07182c);
        border: 1px solid rgba(125, 211, 252, 0.18);
        box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.08);
      }

      .v4-boost-title {
        color: #fff;
        font-size: 17px;
        font-weight: 1000;
      }

      .v4-boost-desc {
        margin-top: 4px;
        color: #b8cbe3;
        font-size: 12px;
        font-weight: 800;
      }

      .v4-boost-status {
        margin-top: 8px;
        display: inline-flex;
        padding: 5px 9px;
        border-radius: 999px;
        background: rgba(2, 8, 18, 0.5);
        color: #cbd5e1;
        font-size: 11px;
        font-weight: 1000;
      }

      .v4-boost-status.on {
        color: #fff;
        background: linear-gradient(135deg, #22c55e, #84cc16);
      }

      .v4-vip-list {
        display: grid;
        gap: 10px;
        margin-top: 12px;
      }

      .v4-vip-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 11px;
        border-radius: 15px;
        background: rgba(2, 8, 18, 0.35);
        border: 1px solid rgba(250, 204, 21, 0.14);
        color: #fff;
        font-weight: 900;
      }

      .v4-vip-item span {
        width: 25px;
        height: 25px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #22c55e, #84cc16);
        font-size: 13px;
      }

      .v4-vip-plans {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 12px;
      }

      .v4-vip-plan {
        position: relative;
        overflow: hidden;
        border-radius: 20px;
        padding: 14px;
        background:
          radial-gradient(
            circle at top,
            rgba(250, 204, 21, 0.18),
            transparent 34%
          ),
          linear-gradient(180deg, #173a5f, #08192d);
        border: 1px solid rgba(250, 204, 21, 0.22);
      }

      .v4-vip-plan.best {
        background:
          radial-gradient(
            circle at top,
            rgba(250, 204, 21, 0.32),
            transparent 38%
          ),
          linear-gradient(180deg, #4a3104, #0b0803);
      }

      .v4-plan-title {
        color: #fff;
        font-size: 16px;
        font-weight: 1000;
      }

      .v4-plan-price {
        margin-top: 8px;
        color: #fff;
        font-size: 24px;
        font-weight: 1000;
      }

      .v4-plan-note {
        margin-top: 6px;
        color: #cbd5e1;
        font-size: 12px;
        font-weight: 800;
      }

      .v4-diamond {
        color: #67e8f9;
      }

      .v4-compact-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      @media (max-width: 390px) {
        .v4-boost-card {
          grid-template-columns: 60px 1fr;
        }
        .v4-boost-card .buy-btn {
          grid-column: 1 / -1;
        }
        .v4-vip-plans {
          grid-template-columns: 1fr;
        }
      }

      /* SHOP FIX V5 - Shop only premium, Feed/Animals separate */
      .v5-info-card {
        border-radius: 20px;
        padding: 14px;
        background: rgba(2, 8, 18, 0.34);
        border: 1px solid rgba(125, 211, 252, 0.13);
        color: #dbeafe;
        font-size: 13px;
        font-weight: 800;
        line-height: 1.45;
      }

      .v5-premium-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .v5-premium-card {
        position: relative;
        overflow: hidden;
        min-height: 210px;
      }

      .v5-premium-card.stars {
        background:
          radial-gradient(
            circle at top,
            rgba(99, 102, 241, 0.28),
            transparent 36%
          ),
          linear-gradient(180deg, #172554, #070b20) !important;
        border-color: rgba(129, 140, 248, 0.28) !important;
      }

      .v5-premium-card.vip {
        background:
          radial-gradient(
            circle at top,
            rgba(250, 204, 21, 0.3),
            transparent 36%
          ),
          linear-gradient(180deg, #4a3104, #0b0803) !important;
        border-color: rgba(250, 204, 21, 0.34) !important;
      }

      .v5-premium-icon {
        width: 70px;
        height: 70px;
        border-radius: 20px;
        display: grid;
        place-items: center;
        font-size: 40px;
        background: rgba(2, 8, 18, 0.38);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.08);
      }

      .v5-card-title {
        margin-top: 12px;

      /* MAIN SCREEN REFERENCE V5 */
      :root {
        --ref-bg: #06111f;
        --ref-panel: rgba(5, 17, 31, 0.94);
        --ref-panel2: rgba(10, 31, 54, 0.96);
        --ref-blue: #0ea5ff;
        --ref-blue2: #1764ff;
        --ref-green: #4ade20;
        --ref-gold: #ffc21c;
        --ref-line: rgba(125, 211, 252, 0.28);
      }

      body {
        touch-action: manipulation;
        overscroll-behavior: none;
        background:
          radial-gradient(
            circle at 50% -8%,
            rgba(14, 165, 255, 0.32),
            transparent 34%
          ),
          linear-gradient(180deg, #06111f 0%, #0a1b2d 48%, #06111f 100%) !important;
      }

      .app {
        max-width: 480px !important;
        padding: 8px 6px 10px !important;
      }

      .ref-game {
        position: relative;
        min-height: calc(100vh - 20px);
        overflow: hidden;
        border-radius: 28px;
        background: #06111f;
        border: 1px solid rgba(125, 211, 252, 0.26);
        box-shadow:
          0 22px 60px rgba(0, 0, 0, 0.5),
          inset 0 2px 0 rgba(255, 255, 255, 0.08);
      }

      .ref-game::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(
            180deg,
            rgba(4, 12, 24, 0.65) 0%,
            transparent 18%,
            transparent 76%,
            rgba(4, 12, 24, 0.85) 100%
          ),
          radial-gradient(
            circle at top,
            rgba(14, 165, 255, 0.2),
            transparent 35%
          );
        z-index: 2;
      }

      .ref-hud {
        position: relative;
        z-index: 10;
        display: grid;
        grid-template-columns: 1.2fr 1fr 1fr;
        gap: 8px;
        padding: 10px;
        background: linear-gradient(
          180deg,
          rgba(6, 18, 34, 0.96),
          rgba(3, 10, 20, 0.96)
        );
        border-bottom: 1px solid rgba(125, 211, 252, 0.18);
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.34);
      }

      .ref-player {
        display: grid;
        grid-template-columns: 52px 1fr;
        gap: 8px;
        align-items: center;
        min-width: 0;
      }

      .ref-avatar {
        width: 52px;
        height: 52px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        font-size: 30px;
        background: linear-gradient(135deg, #0ea5ff, #1764ff);
        border: 2px solid rgba(255, 255, 255, 0.24);
        box-shadow: 0 8px 18px rgba(14, 165, 255, 0.3);
      }

      .ref-player-info {
        min-width: 0;
      }

      .ref-name {
        color: #fff;
        font-size: 17px;
        font-weight: 1000;
        line-height: 1;
      }

      .ref-level-line {
        color: #b8cbe3;
        font-size: 11px;
        font-weight: 900;
        margin-top: 5px;
      }

      .ref-xp-bar {
        height: 10px;
        margin-top: 5px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.5);
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .ref-xp-bar span {
        display: block;
        width: 48%;
        height: 100%;
        background: linear-gradient(90deg, #43e329, #a3e635);
        border-radius: inherit;
      }

      .ref-resource {
        min-width: 0;
        display: grid;
        grid-template-columns: 42px 1fr;
        gap: 8px;
        align-items: center;
        padding: 9px;
        border-radius: 16px;
        background: linear-gradient(
          180deg,
          rgba(14, 35, 59, 0.94),
          rgba(4, 13, 25, 0.94)
        );
        border: 1px solid rgba(125, 211, 252, 0.18);
        box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.05);
      }

      .ref-resource-icon {
        font-size: 30px;
        filter: drop-shadow(0 5px 8px rgba(0, 0, 0, 0.25));
      }

      .ref-resource-value {
        color: #fff;
        font-size: 19px;
        font-weight: 1000;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .ref-resource-sub {
        color: #b8cbe3;
        font-size: 11px;
        font-weight: 900;
        margin-top: 2px;
      }

      .ref-hidden-stats {
        position: absolute;
        opacity: 0;
        pointer-events: none;
        width: 1px;
        height: 1px;
        overflow: hidden;
      }

      .ref-warehouse {
        position: relative;
        z-index: 10;
        margin: 8px 10px 0;
        display: grid;
        grid-template-columns: 78px 1fr 112px;
        gap: 10px;
        align-items: center;

        background: linear-gradient(

          rgba(13, 81, 159, 0.9),
          rgba(5, 27, 62, 0.95)

        border: 1px solid rgba(125, 211, 252, 0.28);
        box-shadow:

          inset 0 2px 0 rgba(255, 255, 255, 0.08);

      .ref-warehouse-title {
        color: #fff;
        font-size: 17px;
        font-weight: 1000;
      }

      .ref-warehouse-bar {
        height: 18px;
        margin-top: 8px;

      .ref-warehouse-cap {

        font-weight: 900;
      }

      .ref-upgrade-btn {
        border: none;
        border-radius: 16px;
        padding: 12px 8px;
        color: #fff;
        background: linear-gradient(180deg, #7cff32, #129909);
        box-shadow:
          0 8px 18px rgba(34, 197, 94, 0.28),
          inset 0 2px 0 rgba(255, 255, 255, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.18);
      }

      .ref-upgrade-btn b {
        display: block;
        font-size: 15px;
        font-weight: 1000;
      }

      .ref-upgrade-btn span {
        display: block;
        font-size: 12px;
        font-weight: 1000;
        margin-top: 3px;
      }

      .ref-status {
        position: relative;
        z-index: 10;
        margin: 8px 10px 0 !important;
        background: rgba(2, 8, 18, 0.58) !important;
        border: 1px solid rgba(125, 211, 252, 0.16) !important;
        border-radius: 999px !important;
        font-weight: 1000 !important;
      }

      .ref-farm {
        position: absolute;
        inset: 0;
        z-index: 1;
        overflow: hidden;
      }

      .ref-bg {
        position: absolute;
        inset: 0;

        height: 100%;

        position: absolute;
        z-index: 11;

        border: 1px solid rgba(125, 211, 252, 0.28);

      .ref-side-emoji {

      .ref-side span:last-child {

      .ref-daily {

      }

      .ref-tasks {
        top: 300px;
        left: 10px;
      }

      .ref-vip {
        top: 220px;
        right: 10px;
      }

      .ref-boosts {
        top: 300px;
        right: 10px;
      }

      .ref-badge {

        top: -9px;

        font-size: 13px;
        border: 2px solid rgba(255, 255, 255, 0.28);
      }

      .ref-coin-popup {

        z-index: 12;

        border-radius: 999px;
        background: rgba(75, 45, 7, 0.65);
        color: #fff;
        font-size: 34px;
        font-weight: 1000;
        text-shadow: 0 3px 0 rgba(0, 0, 0, 0.35);
        box-shadow: 0 12px 26px rgba(0, 0, 0, 0.32);

      .ref-main-tap {

        z-index: 15 !important;
        left: 50% !important;
        bottom: 36px !important;
        transform: translateX(-50%) !important;
      }

      .tap-btn {
        width: 104px !important;
        height: 104px !important;
        border-radius: 50% !important;
        border: 5px solid rgba(255, 255, 255, 0.36) !important;
        background: radial-gradient(
          circle at 34% 18%,
          #fff9b7,
          #ffd84d 38%,
          #ffae13 70%,
          #d97706
        ) !important;
        color: #fff !important;
        font-size: 23px !important;
        font-weight: 1000 !important;
        line-height: 0.9 !important;
        text-shadow: 0 3px 0 rgba(120, 53, 15, 0.45);
        box-shadow:
          0 14px 30px rgba(255, 171, 0, 0.45),
          inset 0 7px 16px rgba(255, 255, 255, 0.34),
          inset 0 -10px 20px rgba(120, 53, 15, 0.3) !important;

        display: block;
        font-size: 20px;
        margin-top: 4px;

  <body>
    <div class="app">

    <div class="levelup-modal" id="levelUpModal">
      <div class="levelup-card">

        <div class="levelup-reward" id="levelUpDiamonds">+0 diamonds</div>

          Новий рівень відкриває більше можливостей у грі 🚜

    <div class="modal" id="modal">
      <div class="modal-sheet">

          <div class="modal-title" id="modalTitle">Вікно</div>

        </div>
        <div id="modalTabs" style="display: none">
          <div class="tabs">
            <button class="tab-btn active" id="tabBuyBtn">Купити</button
            ><button class="tab-btn" id="tabOwnedBtn">Мої</button
            ><button class="tab-btn" id="tabUpgradeBtn">Upgrade</button>

    </div>
    <script>
      const tg = window.Telegram?.WebApp;
      const API = "https://tg-farm-api.onrender.com/api";
      const BOT_USERNAME = "my_farm_clicker_bot";
      if (tg) {
        tg.ready();
        tg.expand();
      }
      const initData = tg?.initData ?? "";
      function getMyTelegramId() {
        return currentState?.telegramId || tg?.initDataUnsafe?.user?.id || "";
      }

      function makeReferralLink() {
        const myTelegramId = getMyTelegramId();

        if (!myTelegramId) {
          return `https://t.me/${BOT_USERNAME}`;
        }

        return `https://t.me/${BOT_USERNAME}?start=ref_${myTelegramId}`;
      }
      const modal = document.getElementById("modal"),
        modalTitle = document.getElementById("modalTitle"),
        modalBody = document.getElementById("modalBody"),
        modalTabs = document.getElementById("modalTabs"),
        tabBuyBtn = document.getElementById("tabBuyBtn"),
        tabOwnedBtn = document.getElementById("tabOwnedBtn"),
        tabUpgradeBtn = document.getElementById("tabUpgradeBtn"),
        resultBox = document.getElementById("resultBox"),
        statusEl = document.getElementById("status"),
        coinsEl = document.getElementById("coins"),
        diamondsEl = document.getElementById("diamonds"),
        pointsEl = document.getElementById("points"),
        xpEl = document.getElementById("xp"),
        levelBadgeEl = document.getElementById("levelBadge"),
        boostStatusEl = document.getElementById("boostStatus"),
        levelUpModal = document.getElementById("levelUpModal"),
        levelUpText = document.getElementById("levelUpText"),
        levelUpCoins = document.getElementById("levelUpCoins"),
        levelUpDiamonds = document.getElementById("levelUpDiamonds"),
        levelUpCloseBtn = document.getElementById("levelUpCloseBtn");
      let currentState = null;
      let lastKnownLevel = null;
      let wheelRotation = 0;
      function setStatus(t) {
        statusEl.textContent = t;
      }
      function setResult(d) {
        resultBox.textContent =
          typeof d === "string" ? d : JSON.stringify(d, null, 2);
      }
      async function apiGet(path) {
        const res = await fetch(`${API}${path}`, {
          method: "GET",
          headers: { "x-telegram-init-data": initData },
        });
        const text = await res.text();
        let json;
        try {
          json = JSON.parse(text);
        } catch {
          json = text;
        }
        return { ok: res.ok, data: json };
      }
      async function apiPost(path, body = {}) {
        const res = await fetch(`${API}${path}`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-telegram-init-data": initData,
          },
          body: JSON.stringify(body),
        });
        const text = await res.text();
        let json;
        try {
          json = JSON.parse(text);
        } catch {
          json = text;
        }
        return { ok: res.ok, data: json };
      }
      function spawnFloatingText(text) {
        const el = document.createElement("div");
        el.className = "floating";
        el.textContent = text;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 900);
      }
      function showToast(text) {
        spawnFloatingText(text);
      }

      function v4AnimalImgSrc(type) {
        if (type === "CHICKEN") return "/assets/chicken.svg";
        if (type === "SHEEP") return "/assets/sheep.svg";
        if (type === "COW") return "/assets/cow.svg";
        return "/assets/chicken.svg";
      }

      function v4Bar(value, cls = "") {
        const v = Math.max(0, Math.min(100, Number(value || 0)));
        return `<div class="v4-bar ${cls}"><span style="width:${v}%"></span></div>`;
      }

      async function healAnimals(type) {
        const res = await apiPost("/heal", { type });
        setResult(res.data);

        if (res.ok) {
          showToast(`❤️ Лікування: -${res.data?.cost ?? 0} coins`);
          await loadState();
          renderAnimalsOwned();
        } else {
          showToast(res.data?.error || "Помилка лікування");
        }
      }

      function showLevelUpPopup(xpData) {
        if (!xpData || !levelUpModal) return;

        levelUpText.textContent = `LVL ${xpData.level ?? currentState?.level ?? 1}`;
        levelUpCoins.textContent = `+${xpData.rewardCoins ?? 0} coins`;
        levelUpDiamonds.textContent = `+${xpData.rewardDiamonds ?? 0} diamonds`;

        levelUpModal.classList.add("show");
      }

      function handleXpResult(xpData) {
        if (xpData?.leveledUp) {
          showLevelUpPopup(xpData);

          if (xpData.level) {
            lastKnownLevel = xpData.level;
          }

          return true;
        }

        return false;
      }

      if (levelUpCloseBtn) {
        levelUpCloseBtn.addEventListener("click", () => {
          levelUpModal.classList.remove("show");
        });
      }

      function applyState(data) {
        const newLevel = data?.level ?? 1;

        if (
          lastKnownLevel !== null &&
          newLevel > lastKnownLevel &&
          levelUpModal &&
          data?.lastLevelRewardCoins > 0
        ) {
          showLevelUpPopup({
            level: newLevel,
            rewardCoins: data?.lastLevelRewardCoins ?? 0,
            rewardDiamonds: data?.lastLevelRewardDiamonds ?? 0,
          });
        }

        lastKnownLevel = newLevel;
        currentState = data;

        coinsEl.textContent = data?.coins ?? 0;
        diamondsEl.textContent = data?.diamonds ?? 0;
        pointsEl.textContent = data?.points ?? 0;
        xpEl.textContent = `${data?.xp ?? 0}/${data?.xpNeeded ?? 0}`;
        levelBadgeEl.textContent = `LVL ${newLevel}`;
        const boost = data?.boost?.active ? "ON" : "OFF";
        const auto = data?.autoCollect?.active ? "ON" : "OFF";
        const vip = data?.vip?.active ? "ON" : "OFF";
        boostStatusEl.innerText = `⚡ ${boost} | 🤖 ${auto} | 👑 ${vip}`;
      }
      async function loadState() {
        try {
          setStatus("loading...");
          const res = await apiGet("/state");
          setResult(res.data);
          if (res.ok) {
            applyState(res.data);
            setStatus("ok");
          } else {
            setStatus("error");
          }
        } catch (e) {
          setStatus("error");
          setResult(String(e));
        }
      }
      async function collect() {
        try {
          setStatus("collect...");
          const res = await apiPost("/collect");
          setResult(res.data);
          if (res.ok) {
            if (!handleXpResult(res.data?.levelUpData)) {
              showToast(`+${res.data?.added ?? 1}`);
            }

            await loadState();
            setStatus("ok");
          } else {
            setStatus("error");
          }
        } catch (e) {
          setStatus("error");
          setResult(String(e));
        }
      }
      function showModal() {
        modal.classList.add("show");
      }
      function closeModal() {
        modal.classList.remove("show");
      }
      modal.addEventListener("click", (e) => {
        if (e.target === modal) closeModal();
      });
      async function buyAnimal(type) {
        const res = await apiPost("/buy-animal", { type });
        setResult(res.data);
        if (res.ok) {
          if (!handleXpResult(res.data?.levelUpData)) {
            showToast("Куплено");
          }

          await loadState();
          renderAnimalsOwned();
        } else {
          showToast(res.data?.error || "Помилка");
        }
      }
      function renderAnimalsBuy() {
        tabBuyBtn.classList.add("active");
        tabOwnedBtn.classList.remove("active");
        tabUpgradeBtn.classList.remove("active");

        const level = currentState?.level ?? 1;

        function animalBuyCard(params) {
          const { emoji, title, price, resource, type, unlockLevel } = params;
          const unlocked = level >= unlockLevel;

          return `
                  <div class="tile">
                    <div class="tile-title">${emoji} ${title}</div>
                    <div class="tile-value">${unlocked ? `${price} coins` : `🔒 LVL ${unlockLevel}`}</div>
                    <div class="tile-row"><span>Ресурс</span><span>${resource}</span></div>
                    <div class="tile-row">
                      <span>Прогрес</span>
                      <span class="unlock-progress">${Math.min(level, unlockLevel)} / ${unlockLevel}</span>
                    </div>
                    <div class="tile-row"><span>Відкривається</span><span>LVL ${unlockLevel}</span></div>
                    ${
                      unlocked
                        ? `<button class="buy-btn" data-animal="${type}">Купити</button>`
                        : `<button class="buy-btn gold" disabled>Потрібен LVL ${unlockLevel}</button>`
                    }
                  </div>
                `;
        }

        modalBody.innerHTML = `
                <div class="modal-grid">
                  ${animalBuyCard({
                    emoji: "🐔",
                    title: "Курка",
                    price: 100,
                    resource: "Яйця",
                    type: "CHICKEN",
                    unlockLevel: 1,
                  })}
                  ${animalBuyCard({
                    emoji: "🐑",
                    title: "Вівця",
                    price: 500,
                    resource: "Шерсть",
                    type: "SHEEP",
                    unlockLevel: 5,
                  })}
                  ${animalBuyCard({
                    emoji: "🐄",
                    title: "Корова",
                    price: 1000,
                    resource: "Молоко",
                    type: "COW",
                    unlockLevel: 10,
                  })}
                </div>
              `;

        modalBody.querySelectorAll("[data-animal]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            await buyAnimal(btn.getAttribute("data-animal"));
          });
        });
      }
      function animalFeedWarning(v) {
        return v > 0
          ? `<div class="tile-row"><span>Корм</span><span>${v}</span></div>`
          : `<div class="warn">Немає корму ❌</div>`;
      }
      function renderAnimalsOwned() {
        tabBuyBtn.classList.remove("active");
        tabOwnedBtn.classList.add("active");
        tabUpgradeBtn.classList.remove("active");

        const animals = currentState?.animals || {};
        const ready = currentState?.ready || {};
        const feed = currentState?.feedStock || {};

        function productionPerCycle(type, level) {
          if (!level) return 0;

          if (type === "CHICKEN") return 1 + (level - 1);
          if (type === "SHEEP") return 3 + (level - 1);
          if (type === "COW") return 7 + (level - 1) * 2;

          return 0;
        }

        function pointsPerCycle(type, level) {
          if (!level || level < 4) return 0;

          if (type === "CHICKEN") return level === 4 ? 1 : 3;
          if (type === "SHEEP") return level === 4 ? 3 : 8;
          if (type === "COW") return level === 4 ? 8 : 20;

          return 0;
        }

        function pointsText(type, level) {
          const points = pointsPerCycle(type, level);
          return points > 0 ? `+${points} / цикл` : "з LVL 4";
        }

        function cycleSeconds(type) {
          if (type === "CHICKEN") return 20;
          if (type === "SHEEP") return 45;
          if (type === "COW") return 90;
          return 1;
        }

        function productionText(type, level) {
          const perCycle = productionPerCycle(type, level);
          return perCycle > 0 ? `${perCycle} / цикл` : "-";
        }

        function productionPerHour(type, level, count) {
          if (!level || !count) return 0;

          const perCycle = productionPerCycle(type, level);
          const perHourOne = (3600 / cycleSeconds(type)) * perCycle;
          return Math.floor(perHourOne * count);
        }

        function v4AnimalCard(
          type,
          emoji,
          title,
          count,
          level,
          life,
          efficiency,
          readyValue,
          feedValue,
          priceHeal,
        ) {
          const hasAnimals = count > 0;
          const lifeValue = hasAnimals ? (life ?? 100) : 0;

      async function openQuestsModal(activeGroup = "daily") {
        modalTitle.textContent = "📜 Квести";
        modalTabs.style.display = "none";

        const res = await apiGet("/quests");
        const quests = res.data?.quests || [];

        function detectGroup(q) {
          const raw = (q.group || q.type || q.category || q.section || "")
            .toString()
            .toLowerCase();

          if (raw.includes("daily")) return "daily";
          if (raw.includes("progress")) return "progress";
          if (raw.includes("achievement")) return "achievement";

          return "progress";
        }

        const grouped = { daily: [], progress: [], achievement: [] };

        quests.forEach((q) => {
          grouped[detectGroup(q)].push(q);
        });

        function renderQuestCard(q) {
          const progress =
            typeof q.progress === "number" && typeof q.target === "number"
              ? `<div class="tile-row"><span>Прогрес</span><span>${q.progress} / ${q.target}</span></div>`
              : "";

          return `
            <div class="tile">
              <div class="tile-title">${q.title}</div>
              <div class="tile-value">${q.done ? "Готово" : "Не готово"}</div>
              ${progress}
              <div class="tile-row"><span>Нагорода</span><span>${q.reward}</span></div>
              <button class="buy-btn ${q.claimed ? "green" : ""}" data-quest="${q.code}" ${q.claimed ? "disabled" : ""}>
                ${q.claimed ? "Забрано" : "Забрати"}
              </button>
            </div>
          `;
        }

        function renderGroup(groupKey) {
          const items = grouped[groupKey] || [];
          if (!items.length) {
            return `<div class="tile full"><div class="note">Тут поки немає квестів</div></div>`;
          }
          return items.map(renderQuestCard).join("");
        }

        modalBody.innerHTML = `
          <div class="quest-tabs">
            <button class="quest-tab-btn ${activeGroup === "daily" ? "active" : ""}" data-qtab="daily">Щоденні</button>
            <button class="quest-tab-btn ${activeGroup === "progress" ? "active" : ""}" data-qtab="progress">Прогрес</button>
            <button class="quest-tab-btn ${activeGroup === "achievement" ? "active" : ""}" data-qtab="achievement">Досягнення</button>
          </div>
          <div class="modal-grid">
            ${renderGroup(activeGroup)}
          </div>
        `;

        showModal();

        modalBody.querySelectorAll("[data-qtab]").forEach((btn) => {
          btn.onclick = () => openQuestsModal(btn.dataset.qtab);
        });

        modalBody.querySelectorAll("[data-quest]").forEach((btn) => {
          btn.onclick = async () => {
            const code = btn.getAttribute("data-quest");
            const resp = await apiPost("/quests/claim", { code });
            setResult(resp.data);

            if (resp.ok) {
              if (!handleXpResult(resp.data?.xp)) {
                showToast(`+${resp.data?.reward ?? 0}`);
              }

              await loadState();
              await openQuestsModal(activeGroup);
            } else {
              showToast(resp.data?.error || "Помилка");
            }
          };
        });
      }

              </div>

            <div class="tile full v4-withdraw-card">
              <div class="tile-title">💸 Withdraw</div>

          showToast("Withdraw буде пізніше");

      function openProfileModal() {
        modalTitle.textContent = "👤 Profile";
        modalTabs.style.display = "none";

        const telegramId = getMyTelegramId() || "test";
        const level = currentState?.level ?? 1;
        const xp = currentState?.xp ?? 0;
        const xpNeeded = currentState?.xpNeeded ?? 0;
        const coins = currentState?.coins ?? 0;
        const diamonds = currentState?.diamonds ?? 0;
        const points = currentState?.points ?? 0;
        const vip = currentState?.vip?.active ? "ACTIVE" : "OFF";
        const link = makeReferralLink();

        modalBody.innerHTML = `
          <div class="modal-grid">
            <div class="tile full v4-profile-hero">
              <div class="v4-profile-top">
                <div class="v4-profile-avatar">👨‍🌾</div>
                <div>
                  <div class="v4-profile-name">Farmer</div>
                  <div class="v4-profile-sub">My Farm Clicker player</div>
                </div>
                <div class="v4-id-pill">ID: ${telegramId}</div>
              </div>
            </div>

            <div class="tile full">
              <div class="v4-stat-grid">
                <div class="v4-big-stat">
                  <span>Level</span>
                  <b>${level}</b>
                </div>
                <div class="v4-big-stat">
                  <span>XP</span>
                  <b>${xp}/${xpNeeded}</b>
                </div>
                <div class="v4-big-stat">
                  <span>Coins</span>
                  <b>${coins}</b>
                </div>
                <div class="v4-big-stat">
                  <span>Diamonds</span>
                  <b>${diamonds} 💎</b>
                </div>
                <div class="v4-big-stat">
                  <span>Points</span>
                  <b>${points} ⭐</b>
                </div>
                <div class="v4-big-stat">
                  <span>VIP</span>
                  <b>${vip}</b>
                </div>
              </div>
            </div>

            <div class="tile full">
              <div class="tile-title">🔗 Referral link</div>
              <div class="v4-ref-link-box">
                <div class="v4-ref-link">${link}</div>
                <button class="v4-copy-btn" id="copyProfileRefBtn">Copy</button>
              </div>
            </div>

            <div class="tile full">
              <div class="v4-info-list">
                <div class="v4-info-item"><span>👛</span> Wallet для diamonds / points / withdraw</div>
                <div class="v4-info-item"><span>👥</span> Referrals для запрошень</div>
                <div class="v4-info-item"><span>🏆</span> Leaderboard для топ-гравців</div>
                <div class="v4-info-item"><span>👑</span> VIP для premium automation</div>
              </div>
            </div>
          </div>
        `;

        showModal();

        document.getElementById("copyProfileRefBtn").onclick = async () => {
          try {
            await navigator.clipboard.writeText(link);
            showToast("Copied");
          } catch {
            showToast("Скопіюй вручну");
          }
        };
      }

      document.getElementById("tapBtn").addEventListener("click", collect);
      document
        .getElementById("loadStateBtn")
        .addEventListener("click", loadState);
      document
        .getElementById("refreshBtn")
        .addEventListener("click", loadState);
      document
        .getElementById("animalsBtn")
        .addEventListener("click", openAnimalsModal);
      document
        .getElementById("storageBtn")
        .addEventListener("click", openStorageModal);
      document
        .getElementById("feedBtn")
        .addEventListener("click", openFeedModal);
      document.getElementById("labBtn").addEventListener("click", openLabModal);
      document
        .getElementById("boostBtn")
        .addEventListener("click", openBoostersModal);
      document
        .getElementById("dailyBtn")
        .addEventListener("click", openDailyModal);
      document
        .getElementById("questsBtn")
        .addEventListener("click", openQuestsModal);
      document
        .getElementById("wheelBtn")
        .addEventListener("click", openWheelModal);
      document
        .getElementById("shopBtn")
        .addEventListener("click", openShopModal);
      document
        .getElementById("refsBtn")
        .addEventListener("click", openRefsModal);
      document
        .getElementById("leaderboardBtn")
        .addEventListener("click", () => openLeaderboardModal("referrals"));
      document
        .getElementById("closeModalBtn")
        .addEventListener("click", closeModal);
      tabBuyBtn.addEventListener("click", renderAnimalsBuy);
      tabOwnedBtn.addEventListener("click", renderAnimalsOwned);
      tabUpgradeBtn.addEventListener("click", renderAnimalsUpgrade);
      document
        .getElementById("walletBtn")
        ?.addEventListener("click", openWalletModal);

      document
        .getElementById("heroTasksBtn")
        ?.addEventListener("click", openQuestsModal);
      document
        .getElementById("heroDailyBtn")
        ?.addEventListener("click", openDailyModal);
      document
        .getElementById("heroVipBtn")
        ?.addEventListener("click", openBoostersModal);
      document
        .getElementById("heroBoostBtn")
        ?.addEventListener("click", openBoostersModal);
      document
        .getElementById("quickStorageBtn")
        ?.addEventListener("click", openLabModal);
      document.getElementById("navTapBtn")?.addEventListener("click", collect);
      document
        .getElementById("navAnimalsBtn")
        ?.addEventListener("click", openAnimalsModal);
      document
        .getElementById("navShopBtn")
        ?.addEventListener("click", openShopModal);

      document
        .getElementById("navWalletBtn")
        ?.addEventListener("click", openProfileModal);
      loadState();

      function bindMainScreenButtonsFix() {
        const safeBind = (id, fn) => {
          const el = document.getElementById(id);
          if (!el || !fn) return;
          el.onclick = (e) => {
            e.preventDefault();
            e.stopPropagation();
            fn();
          };
        };

        safeBind("quickStorageBtn", () => openLabModal());
        safeBind("heroDailyBtn", () => openDailyModal());
        safeBind("heroTasksBtn", () => openQuestsModal());
        safeBind("heroVipBtn", () => openBoostersModal());
        safeBind("heroBoostBtn", () => openBoostersModal());
        safeBind("tapBtn", () => collect());
        safeBind("navFarmBtn", () => loadState());
        safeBind("navAnimalsBtn", () => openAnimalsModal());
        safeBind("navTapBtn", () => collect());
        safeBind("navShopBtn", () => openShopModal());

        if (typeof openProfileModal === "function") {
          safeBind("navWalletBtn", () => openProfileModal());
        } else {
          safeBind("navWalletBtn", () => openWalletModal());
        }

        safeBind("animalsBtn", () => openAnimalsModal());
        safeBind("storageBtn", () => openStorageModal());
        safeBind("feedBtn", () => openFeedModal());
        safeBind("labBtn", () => openLabModal());
        safeBind("dailyBtn", () => openDailyModal());
        safeBind("questsBtn", () => openQuestsModal());
        safeBind("wheelBtn", () => openWheelModal());
        safeBind("shopBtn", () => openShopModal());
        safeBind("boostBtn", () => openBoostersModal());
        safeBind("refsBtn", () => openRefsModal());
        safeBind("walletBtn", () => openWalletModal());
        safeBind("refreshBtn", () => loadState());
        safeBind("loadStateBtn", () => loadState());
      }

      window.addEventListener("load", bindMainScreenButtonsFix);
      setTimeout(bindMainScreenButtonsFix, 300);
      setTimeout(bindMainScreenButtonsFix, 1200);

      function bindModalCloseFix() {
        const closeBtn = document.getElementById("closeModalBtn");
        if (closeBtn) {
          closeBtn.onclick = (e) => {
            e.preventDefault();
            e.stopPropagation();
            closeModal();
          };
        }

        const modalOverlay = document.getElementById("modal");
        if (modalOverlay) {
          modalOverlay.addEventListener("click", (e) => {
            if (e.target === modalOverlay) closeModal();
          });
        }

        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") closeModal();
        });
      }

      window.addEventListener("load", bindModalCloseFix);
      setTimeout(bindModalCloseFix, 300);
    </script>
  </body>
