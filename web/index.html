<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>My Farm Clicker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        color: #e5e7eb;
        background:
          radial-gradient(
            circle at top,
            rgba(59, 130, 246, 0.18),
            transparent 30%
          ),
          linear-gradient(180deg, #0b1220 0%, #111827 45%, #0f172a 100%);
      }
      .app {
        max-width: 480px;
        margin: 0 auto;
        min-height: 100vh;
        padding: 16px 14px 28px;
      }
      .card {
        background: rgba(17, 24, 39, 0.88);
        border: 1px solid rgba(59, 130, 246, 0.18);
        border-radius: 24px;
        padding: 16px;
        margin-bottom: 16px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.25);
        backdrop-filter: blur(8px);
      }
      .top-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
      }
      .title {
        font-size: 28px;
        font-weight: 800;
        color: #f8fafc;
        line-height: 1.1;
      }
      .subtitle {
        margin-top: 6px;
        color: #94a3b8;
        font-size: 13px;
      }
      .level-badge {
        min-width: 90px;
        text-align: center;
        padding: 14px 12px;
        border-radius: 18px;
        font-size: 16px;
        font-weight: 800;
        color: #fff;
        background: linear-gradient(135deg, #2563eb, #60a5fa);
        box-shadow: 0 10px 24px rgba(37, 99, 235, 0.28);
      }
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }
      .stat-box {
        background: rgba(30, 41, 59, 0.85);
        border: 1px solid rgba(148, 163, 184, 0.14);
        border-radius: 18px;
        padding: 12px 8px;
        text-align: center;
      }
      .stat-label {
        color: #94a3b8;
        font-size: 11px;
        margin-bottom: 8px;
      }
      .stat-value {
        color: #f8fafc;
        font-size: 18px;
        font-weight: 800;
      }
      .section-title {
        font-size: 18px;
        font-weight: 800;
        color: #f8fafc;
        margin-bottom: 12px;
      }
      .status-line {
        margin-top: 12px;
        text-align: center;
        color: #cbd5e1;
        font-size: 14px;
        font-weight: 700;
        line-height: 1.5;
      }
      .tap-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 10px 0 2px;
      }
      .tap-btn {
        width: 200px;
        height: 200px;
        border: none;
        border-radius: 50%;
        cursor: pointer;
        color: #fff;
        font-size: 34px;
        font-weight: 900;
        letter-spacing: 1px;
        background: radial-gradient(
          circle at 30% 20%,
          #93c5fd,
          #3b82f6 55%,
          #1d4ed8 100%
        );
        box-shadow:
          0 20px 50px rgba(37, 99, 235, 0.34),
          inset 0 8px 18px rgba(255, 255, 255, 0.22);
        transition: transform 0.08s ease;
      }
      .tap-btn:active {
        transform: scale(0.96);
      }
      .tap-hint {
        margin-top: 18px;
        text-align: center;
        color: #94a3b8;
        font-size: 14px;
      }
      .menu-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }
      .menu-btn {
        background: rgba(30, 41, 59, 0.85);
        border: 1px solid rgba(148, 163, 184, 0.14);
        border-radius: 22px;
        min-height: 98px;
        padding: 12px 8px;
        cursor: pointer;
        color: #f8fafc;
        font-size: 13px;
        font-weight: 800;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .menu-emoji {
        font-size: 30px;
        line-height: 1;
      }
      .main-btn {
        width: 100%;
        border: none;
        border-radius: 18px;
        padding: 16px;
        margin-top: 12px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 800;
        color: white;
        background: linear-gradient(135deg, #2563eb, #60a5fa);
        box-shadow: 0 12px 28px rgba(37, 99, 235, 0.25);
      }
      .floating {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: 240px;
        z-index: 999;
        pointer-events: none;
        font-size: 24px;
        font-weight: 900;
        color: #93c5fd;
        text-shadow: 0 2px 14px rgba(59, 130, 246, 0.5);
        animation: floatUp 0.9s ease forwards;
      }
      @keyframes floatUp {
        0% {
          opacity: 1;
          transform: translateX(-50%) translateY(0) scale(0.95);
        }
        100% {
          opacity: 0;
          transform: translateX(-50%) translateY(-70px) scale(1.12);
        }
      }
      .modal {
        position: fixed;
        inset: 0;
        background: rgba(2, 6, 23, 0.78);
        display: none;
        align-items: flex-end;
        justify-content: center;
        z-index: 1000;
      }
      .modal.show {
        display: flex;
      }
      .modal-sheet {
        width: 100%;
        max-width: 480px;
        background: #0f172a;
        border-top-left-radius: 24px;
        border-top-right-radius: 24px;
        border: 1px solid rgba(59, 130, 246, 0.16);
        padding: 16px;
        max-height: 86vh;
        overflow: auto;
      }
      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
      }
      .modal-title {
        font-size: 20px;
        font-weight: 800;
        color: #f8fafc;
      }
      .close-btn {
        width: 40px;
        height: 40px;
        border-radius: 14px;
        border: none;
        background: rgba(30, 41, 59, 0.9);
        color: #f8fafc;
        font-size: 18px;
        cursor: pointer;
      }
      .tabs {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 10px;
        margin-bottom: 14px;
      }
      .tab-btn {
        border: none;
        border-radius: 16px;
        padding: 12px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 800;
        color: #e2e8f0;
        background: rgba(30, 41, 59, 0.9);
      }
      .tab-btn.active {
        color: #fff;
        background: linear-gradient(135deg, #2563eb, #60a5fa);
      }
      .modal-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .tile {
        background: rgba(30, 41, 59, 0.92);
        border: 1px solid rgba(148, 163, 184, 0.14);
        border-radius: 18px;
        padding: 14px;
      }
      .tile-title {
        color: #94a3b8;
        font-size: 13px;
        margin-bottom: 8px;
      }
      .tile-value {
        color: #f8fafc;
        font-size: 18px;
        font-weight: 800;
      }
      .tile-row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-top: 10px;
        color: #cbd5e1;
        font-size: 13px;
      }
      .buy-btn {
        width: 100%;
        border: none;
        border-radius: 14px;
        padding: 12px;
        margin-top: 12px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 800;
        color: #fff;
        background: linear-gradient(135deg, #2563eb, #60a5fa);
      }
      .buy-btn.green {
        background: linear-gradient(135deg, #15803d, #22c55e);
      }
      .buy-btn.gold {
        background: linear-gradient(135deg, #b45309, #f59e0b);
      }
      .note {
        color: #94a3b8;
        font-size: 13px;
        line-height: 1.45;
      }
      .warn {
        color: #fca5a5;
        font-size: 13px;
        line-height: 1.45;
        margin-top: 8px;
        font-weight: 700;
      }
      .wheel-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .wheel-disc {
        width: 220px;
        height: 220px;
        border-radius: 50%;
        border: 8px solid #1d4ed8;
        background: conic-gradient(
          #60a5fa 0 60deg,
          #1e40af 60deg 120deg,
          #93c5fd 120deg 180deg,
          #2563eb 180deg 240deg,
          #60a5fa 240deg 300deg,
          #1e40af 300deg 360deg
        );
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
        position: relative;
        transition: transform 3s cubic-bezier(0.18, 0.89, 0.32, 1.08);
      }
      .wheel-center {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: #0f172a;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        border: 4px solid #60a5fa;
      }
      .wheel-pointer {
        width: 0;
        height: 0;
        border-left: 14px solid transparent;
        border-right: 14px solid transparent;
        border-top: 22px solid #f8fafc;
        margin-bottom: -8px;
      }
      .share-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        align-items: center;
      }
      .code-box,
      .input-box {
        width: 100%;
        padding: 12px;
        border-radius: 12px;
        border: none;
        background: #1e293b;
        color: #fff;
        font-size: 14px;
      }
      .full {
        grid-column: 1 / -1;
      }
      #resultBox {
        display: none;
      }
      .daily-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin-bottom: 15px;
      }

      .daily-item {
        background: #1e293b;
        border-radius: 12px;
        padding: 10px;
        text-align: center;
        font-size: 12px;
      }

      .daily-item.active {
        border: 2px solid #3b82f6;
      }

      .daily-item.done {
        opacity: 0.5;
      }

      .daily-item .day {
        font-weight: 700;
        margin-bottom: 5px;
      }

      .daily-item .reward {
        font-size: 11px;
      }
      .quest-tabs {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-bottom: 14px;
      }

      .quest-tab-btn {
        border: none;
        border-radius: 14px;
        padding: 12px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 800;
        color: #e2e8f0;
        background: rgba(30, 41, 59, 0.9);
      }

      .quest-tab-btn.active {
        color: #fff;
        background: linear-gradient(135deg, #2563eb, #60a5fa);
      }

      .chance-green {
        color: #22c55e;
        font-weight: 900;
      }

      .chance-gold {
        color: #facc15;
        font-weight: 900;
      }

      .chance-danger {
        color: #f87171;
        font-weight: 900;
      }

      .unlock-progress {
        color: #93c5fd;
        font-weight: 800;
      }

      .levelup-modal {
        position: fixed;
        inset: 0;
        background: rgba(2, 6, 23, 0.82);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 2000;
        padding: 20px;
      }

      .levelup-modal.show {
        display: flex;
      }

      .levelup-card {
        width: 100%;
        max-width: 360px;
        background: linear-gradient(180deg, #111827, #0f172a);
        border: 1px solid rgba(250, 204, 21, 0.35);
        border-radius: 28px;
        padding: 24px;
        text-align: center;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
        animation: levelPop 0.25s ease-out;
      }

      @keyframes levelPop {
        from {
          transform: scale(0.86);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }

      .levelup-title {
        font-size: 28px;
        font-weight: 900;
        color: #facc15;
        margin-bottom: 8px;
      }

      .levelup-level {
        font-size: 38px;
        font-weight: 900;
        color: #f8fafc;
        margin-bottom: 16px;
      }

      .levelup-reward {
        background: rgba(30, 41, 59, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.16);
        border-radius: 18px;
        padding: 14px;
        margin: 10px 0;
        font-size: 18px;
        font-weight: 800;
        color: #e5e7eb;
      }

      .levelup-note {
        color: #94a3b8;
        font-size: 13px;
        margin-top: 10px;
        line-height: 1.4;
      }

      .v3-vip-panel {

          ),
          linear-gradient(180deg, #3b2703, #090806) !important;
        border-color: rgba(250, 204, 21, 0.34) !important;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="v3-shell">

    <div class="levelup-modal" id="levelUpModal">
      <div class="levelup-card">
        <div class="levelup-title">🎉 LEVEL UP!</div>

        <div class="levelup-reward" id="levelUpCoins">+0 coins</div>
        <div class="levelup-reward" id="levelUpDiamonds">+0 diamonds</div>

          Новий рівень відкриває більше можливостей у грі 🚜

    <div class="modal" id="modal">
      <div class="modal-sheet">
        <div class="modal-header">
          <div class="modal-title" id="modalTitle">Вікно</div>
          <button class="close-btn" id="closeModalBtn">✕</button>
        </div>
        <div id="modalTabs" style="display: none">
          <div class="tabs">
            <button class="tab-btn active" id="tabBuyBtn">Купити</button
            ><button class="tab-btn" id="tabOwnedBtn">Мої</button
            ><button class="tab-btn" id="tabUpgradeBtn">Upgrade</button>
          </div>
        </div>
        <div id="modalBody"></div>
      </div>
    </div>
    <script>
      const tg = window.Telegram?.WebApp;
      const API = "https://tg-farm-api.onrender.com/api";
      const BOT_USERNAME = "my_farm_clicker_bot";
      if (tg) {
        tg.ready();
        tg.expand();
      }
      const initData = tg?.initData ?? "";
      function getMyTelegramId() {
        return currentState?.telegramId || tg?.initDataUnsafe?.user?.id || "";
      }

      function makeReferralLink() {
        const myTelegramId = getMyTelegramId();

        if (!myTelegramId) {
          return `https://t.me/${BOT_USERNAME}`;
        }

        return `https://t.me/${BOT_USERNAME}?start=ref_${myTelegramId}`;
      }
      const modal = document.getElementById("modal"),
        modalTitle = document.getElementById("modalTitle"),
        modalBody = document.getElementById("modalBody"),
        modalTabs = document.getElementById("modalTabs"),
        tabBuyBtn = document.getElementById("tabBuyBtn"),
        tabOwnedBtn = document.getElementById("tabOwnedBtn"),
        tabUpgradeBtn = document.getElementById("tabUpgradeBtn"),
        resultBox = document.getElementById("resultBox"),
        statusEl = document.getElementById("status"),
        coinsEl = document.getElementById("coins"),
        diamondsEl = document.getElementById("diamonds"),
        pointsEl = document.getElementById("points"),
        xpEl = document.getElementById("xp"),
        levelBadgeEl = document.getElementById("levelBadge"),
        boostStatusEl = document.getElementById("boostStatus"),
        levelUpModal = document.getElementById("levelUpModal"),
        levelUpText = document.getElementById("levelUpText"),
        levelUpCoins = document.getElementById("levelUpCoins"),
        levelUpDiamonds = document.getElementById("levelUpDiamonds"),
        levelUpCloseBtn = document.getElementById("levelUpCloseBtn");
      let currentState = null;
      let lastKnownLevel = null;
      let wheelRotation = 0;
      function setStatus(t) {
        statusEl.textContent = t;
      }
      function setResult(d) {
        resultBox.textContent =
          typeof d === "string" ? d : JSON.stringify(d, null, 2);
      }
      async function apiGet(path) {
        const res = await fetch(`${API}${path}`, {
          method: "GET",
          headers: { "x-telegram-init-data": initData },
        });
        const text = await res.text();
        let json;
        try {
          json = JSON.parse(text);
        } catch {
          json = text;
        }
        return { ok: res.ok, data: json };
      }
      async function apiPost(path, body = {}) {
        const res = await fetch(`${API}${path}`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-telegram-init-data": initData,
          },
          body: JSON.stringify(body),
        });
        const text = await res.text();
        let json;
        try {
          json = JSON.parse(text);
        } catch {
          json = text;
        }
        return { ok: res.ok, data: json };
      }
      function spawnFloatingText(text) {
        const el = document.createElement("div");
        el.className = "floating";
        el.textContent = text;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 900);
      }
      function showToast(text) {
        spawnFloatingText(text);
      }

      function v3AnimalImgSrc(type) {
        if (type === "CHICKEN") return "/assets/chicken.svg";
        if (type === "SHEEP") return "/assets/sheep.svg";
        if (type === "COW") return "/assets/cow.svg";
        return "/assets/chicken.svg";
      }

      function v3PercentBar(value) {
        const v = Math.max(0, Math.min(100, Number(value || 0)));
        return `<div class="v3-bar"><span style="width:${v}%"></span></div>`;
      }

      function animalImgSrc(type) {
        if (type === "CHICKEN") return "/assets/chicken.svg";
        if (type === "SHEEP") return "/assets/sheep.svg";
        if (type === "COW") return "/assets/cow.svg";
        return "/assets/chicken.svg";
      }

      function showLevelUpPopup(xpData) {
        if (!xpData || !levelUpModal) return;

        levelUpText.textContent = `LVL ${xpData.level ?? currentState?.level ?? 1}`;
        levelUpCoins.textContent = `+${xpData.rewardCoins ?? 0} coins`;
        levelUpDiamonds.textContent = `+${xpData.rewardDiamonds ?? 0} diamonds`;

        levelUpModal.classList.add("show");
      }

      function handleXpResult(xpData) {
        if (xpData?.leveledUp) {
          showLevelUpPopup(xpData);

          if (xpData.level) {
            lastKnownLevel = xpData.level;
          }

          return true;
        }

        return false;
      }

      if (levelUpCloseBtn) {
        levelUpCloseBtn.addEventListener("click", () => {
          levelUpModal.classList.remove("show");
        });
      }

      function applyState(data) {
        const newLevel = data?.level ?? 1;

        if (
          lastKnownLevel !== null &&
          newLevel > lastKnownLevel &&
          levelUpModal &&
          data?.lastLevelRewardCoins > 0
        ) {
          showLevelUpPopup({
            level: newLevel,
            rewardCoins: data?.lastLevelRewardCoins ?? 0,
            rewardDiamonds: data?.lastLevelRewardDiamonds ?? 0,
          });
        }

        lastKnownLevel = newLevel;
        currentState = data;

        coinsEl.textContent = data?.coins ?? 0;
        diamondsEl.textContent = data?.diamonds ?? 0;
        pointsEl.textContent = data?.points ?? 0;
        xpEl.textContent = `${data?.xp ?? 0}/${data?.xpNeeded ?? 0}`;
        levelBadgeEl.textContent = `LVL ${newLevel}`;
        const boost = data?.boost?.active ? "ON" : "OFF";
        const auto = data?.autoCollect?.active ? "ON" : "OFF";
        const vip = data?.vip?.active ? "ON" : "OFF";
        boostStatusEl.innerText = `⚡ ${boost} | 🤖 ${auto} | 👑 ${vip}`;
      }
      async function loadState() {
        try {
          setStatus("loading...");
          const res = await apiGet("/state");
          setResult(res.data);
          if (res.ok) {
            applyState(res.data);
            setStatus("ok");
          } else {
            setStatus("error");
          }
        } catch (e) {
          setStatus("error");
          setResult(String(e));
        }
      }
      async function collect() {
        try {
          setStatus("collect...");
          const res = await apiPost("/collect");
          setResult(res.data);
          if (res.ok) {
            if (!handleXpResult(res.data?.levelUpData)) {
              showToast(`+${res.data?.added ?? 1}`);
            }

            await loadState();
            setStatus("ok");
          } else {
            setStatus("error");
          }
        } catch (e) {
          setStatus("error");
          setResult(String(e));
        }
      }
      function showModal() {
        modal.classList.add("show");
      }
      function closeModal() {
        modal.classList.remove("show");
      }
      modal.addEventListener("click", (e) => {
        if (e.target === modal) closeModal();
      });
      async function buyAnimal(type) {
        const res = await apiPost("/buy-animal", { type });
        setResult(res.data);
        if (res.ok) {
          if (!handleXpResult(res.data?.levelUpData)) {
            showToast("Куплено");
          }

          await loadState();
          renderAnimalsOwned();
        } else {
          showToast(res.data?.error || "Помилка");
        }
      }
      function renderAnimalsBuy() {
        tabBuyBtn.classList.add("active");
        tabOwnedBtn.classList.remove("active");
        tabUpgradeBtn.classList.remove("active");

        const level = currentState?.level ?? 1;

        function animalBuyCard(params) {
          const { emoji, title, price, resource, type, unlockLevel } = params;
          const unlocked = level >= unlockLevel;

          return `
                  <div class="tile">
                    <img class="animal-card-img" src="${v3AnimalImgSrc(type)}" alt="${title}" />
                    <div class="tile-title">${emoji} ${title}</div>
                    <div class="tile-value">${unlocked ? `${price} coins` : `🔒 LVL ${unlockLevel}`}</div>
                    <div class="tile-row"><span>Ресурс</span><span>${resource}</span></div>
                    <div class="tile-row">
                      <span>Прогрес</span>
                      <span class="unlock-progress">${Math.min(level, unlockLevel)} / ${unlockLevel}</span>
                    </div>
                    <div class="tile-row"><span>Відкривається</span><span>LVL ${unlockLevel}</span></div>
                    ${
                      unlocked
                        ? `<button class="buy-btn" data-animal="${type}">Купити</button>`
                        : `<button class="buy-btn gold" disabled>Потрібен LVL ${unlockLevel}</button>`
                    }
                  </div>
                `;
        }

        modalBody.innerHTML = `
                <div class="modal-grid">
                  ${animalBuyCard({
                    emoji: "🐔",
                    title: "Курка",
                    price: 100,
                    resource: "Яйця",
                    type: "CHICKEN",
                    unlockLevel: 1,
                  })}
                  ${animalBuyCard({
                    emoji: "🐑",
                    title: "Вівця",
                    price: 500,
                    resource: "Шерсть",
                    type: "SHEEP",
                    unlockLevel: 5,
                  })}
                  ${animalBuyCard({
                    emoji: "🐄",
                    title: "Корова",
                    price: 1000,
                    resource: "Молоко",
                    type: "COW",
                    unlockLevel: 10,
                  })}
                </div>
              `;

        modalBody.querySelectorAll("[data-animal]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            await buyAnimal(btn.getAttribute("data-animal"));
          });
        });
      }
      function animalFeedWarning(v) {
        return v > 0
          ? `<div class="tile-row"><span>Корм</span><span>${v}</span></div>`
          : `<div class="warn">Немає корму ❌</div>`;
      }
      function renderAnimalsOwned() {
        tabBuyBtn.classList.remove("active");
        tabOwnedBtn.classList.add("active");
        tabUpgradeBtn.classList.remove("active");

        const animals = currentState?.animals || {};
        const ready = currentState?.ready || {};
        const feed = currentState?.feedStock || {};

        function productionPerCycle(type, level) {
          if (!level) return 0;

          if (type === "CHICKEN") return 1 + (level - 1);
          if (type === "SHEEP") return 3 + (level - 1);
          if (type === "COW") return 7 + (level - 1) * 2;

          return 0;
        }

        function pointsPerCycle(type, level) {
          if (!level || level < 4) return 0;

          if (type === "CHICKEN") return level === 4 ? 1 : 3;
          if (type === "SHEEP") return level === 4 ? 3 : 8;
          if (type === "COW") return level === 4 ? 8 : 20;

          return 0;
        }

        function pointsText(type, level) {
          const points = pointsPerCycle(type, level);
          return points > 0 ? `+${points} / цикл` : "з LVL 4";
        }

        function cycleSeconds(type) {
          if (type === "CHICKEN") return 20;
          if (type === "SHEEP") return 45;
          if (type === "COW") return 90;
          return 1;
        }

        function productionText(type, level) {
          const perCycle = productionPerCycle(type, level);
          return perCycle > 0 ? `${perCycle} / цикл` : "-";
        }

        function productionPerHour(type, level, count) {
          if (!level || !count) return 0;

          const perCycle = productionPerCycle(type, level);
          const perHourOne = (3600 / cycleSeconds(type)) * perCycle;
          return Math.floor(perHourOne * count);
        }

        function v3OwnedAnimalCard(
          type,
          emoji,
          title,
          count,
          level,
          life,
          efficiency,
          readyValue,
          feedValue,
        ) {
          const hasAnimals = count > 0;
          const lifeText = hasAnimals ? `${life ?? 100}%` : "-";
          const effText = hasAnimals ? `${efficiency ?? 100}%` : "-";
          const perHour = productionPerHour(type, level, count);

          return `
            <div class="tile full v3-animal-card">
              <img class="animal-card-img" src="${v3AnimalImgSrc(type)}" alt="${title}" />
              <div>
                <div class="tile-title">${emoji} ${title}</div>
                <div class="tile-value">${count}</div>
                <div class="tile-row"><span>Level</span><span>${level}</span></div>
                <div class="tile-row"><span>Coins / hour</span><span>${perHour}</span></div>
                <div class="v3-bars">
                  <div><div class="tile-row"><span>❤️ Life</span><span>${lifeText}</span></div>${hasAnimals ? v3PercentBar(life) : ""}</div>
                  <div><div class="tile-row"><span>⚡ Power</span><span>${effText}</span></div>${hasAnimals ? v3PercentBar(efficiency) : ""}</div>
                </div>
              </div>
              <div>
                <div class="tile-row"><span>Ready</span><span>${readyValue}</span></div>
                <div class="tile-row"><span>Feed</span><span>${feedValue}</span></div>
              </div>
            </div>
          `;
        }

        modalBody.innerHTML = `
          <div class="modal-grid">
            <div class="tile full">
              <div class="tile-title">🐾 My Animals</div>
              <div class="tile-value">Total: ${(animals.chicken ?? 0) + (animals.sheep ?? 0) + (animals.cow ?? 0)}</div>
              <div class="tile-row"><span>VIP</span><span>${currentState?.vip?.active ? "ACTIVE" : "OFF"}</span></div>
            </div>

            ${v3OwnedAnimalCard("CHICKEN", "🐔", "Chicken", animals.chicken ?? 0, animals.chickenLevel ?? 0, animals.chickenLife ?? 0, animals.chickenEfficiency ?? 0, ready.eggsReady ?? 0, feed.chicken ?? 0)}
            ${v3OwnedAnimalCard("SHEEP", "🐑", "Sheep", animals.sheep ?? 0, animals.sheepLevel ?? 0, animals.sheepLife ?? 0, animals.sheepEfficiency ?? 0, ready.woolReady ?? 0, feed.sheep ?? 0)}
            ${v3OwnedAnimalCard("COW", "🐄", "Cow", animals.cow ?? 0, animals.cowLevel ?? 0, animals.cowLife ?? 0, animals.cowEfficiency ?? 0, ready.milkReady ?? 0, feed.cow ?? 0)}

            <div class="tile full v3-vip-panel">
              <div class="tile-title">👑 Premium Status</div>
              <div class="tile-value">${currentState?.vip?.active ? "VIP ACTIVE" : "VIP OFF"}</div>
              <div class="tile-row"><span>Boost</span><span>${currentState?.boost?.active ? "ON" : "OFF"}</span></div>
              <div class="tile-row"><span>Auto Sell</span><span>${currentState?.autoCollect?.active ? "ON" : "OFF"}</span></div>
            </div>
          </div>
        `;
      }
      function renderAnimalsUpgrade() {
        openLabModal();
      }

      function openAnimalsModal() {
        modalTitle.textContent = "🐾 Тварини";
        modalTabs.style.display = "block";
        tabBuyBtn.style.display = "";
        tabOwnedBtn.style.display = "";
        tabUpgradeBtn.style.display = "none";
        tabBuyBtn.textContent = "Купити";
        tabOwnedBtn.textContent = "Мої";
        renderAnimalsBuy();
        showModal();
      }

      async function openStorageModal() {
        modalTitle.textContent = "📦 Склад";
        modalTabs.style.display = "none";

        const s = currentState?.storage || {};

        const eggs = s.eggs ?? 0;
        const wool = s.wool ?? 0;
        const milk = s.milk ?? 0;
        const capacity = s.capacity ?? 1000;
        const total = s.total ?? eggs + wool + milk;

        const coinsFromEggs = eggs * 6;
        const coinsFromWool = wool * 15;
        const coinsFromMilk = milk * 30;
        const fallbackCoins = coinsFromEggs + coinsFromWool + coinsFromMilk;
        const totalCoins =
          s.sellValue ?? s.sellCoins ?? s.coins ?? fallbackCoins;

        const percent = Math.min(100, Math.floor((total / capacity) * 100));

        let warning = "";
        if (percent >= 95) {
          warning = `<div class="warn">🚨 Склад заповнений! Виробництво майже стоїть</div>`;
        } else if (percent >= 80) {
          warning = `<div class="warn">⚠️ Склад майже повний</div>`;
        }

        modalBody.innerHTML = `
                            <div class="modal-grid">
                              <div class="tile full">
                                <div class="tile-title">📊 Заповнення</div>
                                <div class="tile-value">${total} / ${capacity}</div>
                                <div class="tile-row"><span>Використано</span><span>${percent}%</span></div>
                                ${warning}
                              </div>

                              <div class="tile">
                                <div class="tile-title">🥚 Яйця</div>
                                <div class="tile-value">${eggs}</div>
                                <div class="tile-row"><span>Ціна</span><span>${coinsFromEggs} coins</span></div>
                              </div>

                              <div class="tile">
                                <div class="tile-title">🧶 Шерсть</div>
                                <div class="tile-value">${wool}</div>

      async function openQuestsModal(activeGroup = "daily") {
        modalTitle.textContent = "📜 Квести";
        modalTabs.style.display = "none";

        const res = await apiGet("/quests");
        const quests = res.data?.quests || [];

        function detectGroup(q) {
          const raw = (q.group || q.type || q.category || q.section || "")
            .toString()
            .toLowerCase();

          if (raw.includes("daily")) return "daily";
          if (raw.includes("progress")) return "progress";
          if (raw.includes("achievement")) return "achievement";

          return "progress";
        }

        const grouped = { daily: [], progress: [], achievement: [] };

        quests.forEach((q) => {
          grouped[detectGroup(q)].push(q);
        });

        function renderQuestCard(q) {
          const progress =
            typeof q.progress === "number" && typeof q.target === "number"
              ? `<div class="tile-row"><span>Прогрес</span><span>${q.progress} / ${q.target}</span></div>`
              : "";

          return `
            <div class="tile">
              <div class="tile-title">${q.title}</div>
              <div class="tile-value">${q.done ? "Готово" : "Не готово"}</div>
              ${progress}
              <div class="tile-row"><span>Нагорода</span><span>${q.reward}</span></div>
              <button class="buy-btn ${q.claimed ? "green" : ""}" data-quest="${q.code}" ${q.claimed ? "disabled" : ""}>
                ${q.claimed ? "Забрано" : "Забрати"}
              </button>
            </div>
          `;
        }

        function renderGroup(groupKey) {
          const items = grouped[groupKey] || [];
          if (!items.length) {
            return `<div class="tile full"><div class="note">Тут поки немає квестів</div></div>`;
          }
          return items.map(renderQuestCard).join("");
        }

        modalBody.innerHTML = `

            <button class="quest-tab-btn ${activeGroup === "daily" ? "active" : ""}" data-qtab="daily">Щоденні</button>

            ${renderGroup(activeGroup)}

        showModal();

        modalBody.querySelectorAll("[data-qtab]").forEach((btn) => {
          btn.onclick = () => openQuestsModal(btn.dataset.qtab);

            showToast("Сьогодні вже крутив");
            return;
          }

          // 👉 блокуємо кнопку одразу
          btn.disabled = true;
          btn.textContent = "Крутимо...";

          let deg = 1800 + Math.random() * 720;
          rotor.style.transform = "rotate(" + deg + "deg)";

          // 👉 запит на сервер
          const res = await apiPost("/wheel/spin");

          setTimeout(async () => {
            if (res.ok) {
              const reward = res.data?.reward;

              if (reward?.type === "coins") {
                showToast("💰 +" + reward.amount + " coins");
              } else if (reward?.type === "diamonds") {
                showToast("💎 +" + reward.amount);
              } else if (reward?.type === "freeSpin") {
                showToast("🎰 Free spin");
              } else {
                showToast("😅 Нічого");
              }

              await loadState();

              // 👉 перезавантажуємо модалку (щоб кнопка стала disabled)
              openWheelModal();
            } else {
              showToast(res.data?.error || "Помилка");
              btn.disabled = false;
              btn.textContent = "Крутити";
            }
          }, 3000);
        };
      }

      async function openLeaderboardModal(type = "referrals") {
        const tabs = [
          { key: "referrals", label: "👥 Referrals" },
          { key: "coins", label: "🪙 Coins" },
          { key: "points", label: "⭐ Points" },
        ];

        const activeTab = tabs.find((t) => t.key === type) ? type : "referrals";
        const activeInfo = tabs.find((t) => t.key === activeTab);

        modalTitle.textContent = "🏆 Топ";
        modalTabs.style.display = "none";

        modalBody.innerHTML = `
                <div class="quest-tabs">
                  ${tabs
                    .map(
                      (t) => `
                        <button class="quest-tab-btn ${activeTab === t.key ? "active" : ""}" data-leaderboard-tab="${t.key}">
                          ${t.label}
                        </button>
                      `,
                    )
                    .join("")}
                </div>
                <div class="tile full">
                  <div class="note">Завантаження рейтингу...</div>
                </div>
              `;

        showModal();

        modalBody.querySelectorAll("[data-leaderboard-tab]").forEach((btn) => {
          btn.onclick = () => openLeaderboardModal(btn.dataset.leaderboardTab);
        });

        try {
          const res = await fetch(`${API}/leaderboard?type=${activeTab}`);
          const data = await res.json();

          if (!data.ok) {
            modalBody.innerHTML = `
                    <div class="quest-tabs">
                      ${tabs
                        .map(
                          (t) => `
                            <button class="quest-tab-btn ${activeTab === t.key ? "active" : ""}" data-leaderboard-tab="${t.key}">
                              ${t.label}
                            </button>
                          `,
                        )
                        .join("")}
                    </div>
                    <div class="warn">Помилка завантаження топу</div>
                  `;

            modalBody
              .querySelectorAll("[data-leaderboard-tab]")
              .forEach((btn) => {
                btn.onclick = () =>
                  openLeaderboardModal(btn.dataset.leaderboardTab);
              });

            return;
          }

          function valueLine(user) {
            if (activeTab === "coins") {
              return `<div class="tile-value">🪙 ${user.coins ?? user.value ?? 0} coins</div>`;
            }

            if (activeTab === "points") {
              return `<div class="tile-value">⭐ ${user.points ?? user.value ?? 0} points</div>`;
            }

            return `<div class="tile-value">👥 ${user.referrals ?? user.value ?? 0} рефералів</div>`;
          }

          const rows = (data.leaderboard || [])
            .map(
              (user) => `
                      <div class="tile full">
                        <div class="tile-title">#${user.rank} — ${activeInfo.label}</div>
                        ${valueLine(user)}
                        <div class="tile-row"><span>ID</span><span>${user.telegramId}</span></div>
                        <div class="tile-row"><span>Реферали</span><span>${user.referrals ?? 0}</span></div>
                        <div class="tile-row"><span>Coins</span><span>${user.coins ?? 0}</span></div>
                        <div class="tile-row"><span>Points</span><span>${user.points ?? 0}</span></div>
                      </div>
                    `,
            )
            .join("");

          modalBody.innerHTML = `
                  <div class="quest-tabs">
                    ${tabs
                      .map(
                        (t) => `
                          <button class="quest-tab-btn ${activeTab === t.key ? "active" : ""}" data-leaderboard-tab="${t.key}">
                            ${t.label}
                          </button>
                        `,
                      )
                      .join("")}
                  </div>

                  <div class="modal-grid">
                    ${rows || `<div class="tile full"><div class="note">Поки немає даних</div></div>`}
                  </div>
                `;

          modalBody
            .querySelectorAll("[data-leaderboard-tab]")
            .forEach((btn) => {
              btn.onclick = () =>
                openLeaderboardModal(btn.dataset.leaderboardTab);
            });
        } catch (e) {
          modalBody.innerHTML = `
                  <div class="quest-tabs">
                    ${tabs
                      .map(
                        (t) => `
                          <button class="quest-tab-btn ${activeTab === t.key ? "active" : ""}" data-leaderboard-tab="${t.key}">
                            ${t.label}
                          </button>
                        `,
                      )
                      .join("")}
                  </div>
                  <div class="warn">Помилка завантаження топу</div>
                `;

          modalBody
            .querySelectorAll("[data-leaderboard-tab]")
            .forEach((btn) => {
              btn.onclick = () =>
                openLeaderboardModal(btn.dataset.leaderboardTab);
            });
        }
      }
