<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>My Farm Clicker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        font-family: Arial, sans-serif;
        color: #e5e7eb;
        background: #06111f;
        touch-action: manipulation;
        overscroll-behavior: none;
      }
      .app {
        max-width: 480px;
        margin: 0 auto;
        min-height: 100vh;
        padding: 8px 6px 10px;
      }
      .game {
        position: relative;
        min-height: calc(100vh - 20px);
        overflow: hidden;
        border-radius: 28px;
        background: #06111f;
        border: 1px solid rgba(125, 211, 252, 0.26);
        box-shadow:
          0 22px 60px rgba(0, 0, 0, 0.5),
          inset 0 2px 0 rgba(255, 255, 255, 0.08);
      }
      .game:before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        background: linear-gradient(
          180deg,
          rgba(4, 12, 24, 0.58),
          transparent 20%,
          transparent 74%,
          rgba(4, 12, 24, 0.9)
        );
      }
      .farm-bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 1;
      }
      .hud {
        position: relative;
        z-index: 10;
        display: grid;
        grid-template-columns: 1.2fr 1fr 1fr;
        gap: 8px;
        padding: 10px;
        background: linear-gradient(
          180deg,
          rgba(6, 18, 34, 0.96),
          rgba(3, 10, 20, 0.96)
        );
        border-bottom: 1px solid rgba(125, 211, 252, 0.18);
      }
      .player {
        display: grid;
        grid-template-columns: 52px 1fr;
        gap: 8px;
        align-items: center;
        min-width: 0;
      }
      .avatar {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 30px;
        background: linear-gradient(135deg, #0ea5ff, #1764ff);
        border: 2px solid rgba(255, 255, 255, 0.24);
      }
      .name {
        font-size: 17px;
        font-weight: 1000;
        color: #fff;
      }
      .lvl {
        color: #b8cbe3;
        font-size: 11px;
        font-weight: 900;
        margin-top: 5px;
      }
      .xpbar {
        height: 10px;
        margin-top: 5px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.55);
        overflow: hidden;
      }
      .xpbar span {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #43e329, #a3e635);
      }
      .resource {
        display: grid;
        grid-template-columns: 42px 1fr;
        gap: 8px;
        align-items: center;
        padding: 9px;
        border-radius: 16px;
        background: linear-gradient(
          180deg,
          rgba(14, 35, 59, 0.94),
          rgba(4, 13, 25, 0.94)
        );
        border: 1px solid rgba(125, 211, 252, 0.18);
        min-width: 0;
      }
      .res-icon {
        font-size: 30px;
      }
      .res-val {
        font-size: 19px;
        font-weight: 1000;
        color: #fff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .res-sub {
        font-size: 11px;
        font-weight: 900;
        color: #b8cbe3;
      }
      .warehouse {
        position: relative;
        z-index: 10;
        margin: 8px 10px 0;
        display: grid;
        grid-template-columns: 78px 1fr 112px;
        gap: 10px;
        align-items: center;
        padding: 10px;
        border-radius: 20px;
        background: linear-gradient(
          180deg,
          rgba(13, 81, 159, 0.9),
          rgba(5, 27, 62, 0.95)
        );
        border: 1px solid rgba(125, 211, 252, 0.28);
        cursor: pointer;
      }
      .wh-icon {
        font-size: 48px;
      }
      .wh-title {
        font-size: 17px;
        font-weight: 1000;
        color: #fff;
      }
      .wh-bar {
        height: 18px;
        margin-top: 8px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.62);
        overflow: hidden;
      }
      .wh-bar span {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #ffdf3d, #ff9f0a);
      }
      .wh-cap {
        text-align: center;
        color: #dbeafe;
        font-size: 12px;
        font-weight: 900;
        margin-top: 5px;
      }
      .upgrade {
        border: none;
        border-radius: 16px;
        padding: 12px 8px;
        color: #fff;
        background: linear-gradient(180deg, #7cff32, #129909);
        font-weight: 1000;
      }
      .status {
        position: relative;
        z-index: 10;
        margin: 8px 10px 0;
        text-align: center;
        padding: 8px;
        border-radius: 999px;
        background: rgba(2, 8, 18, 0.58);
        border: 1px solid rgba(125, 211, 252, 0.16);
        font-weight: 1000;
        color: #e5e7eb;
      }
      .side {
        position: absolute;
        z-index: 11;
        width: 64px;
        min-height: 70px;
        border: none;
        border-radius: 14px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        color: #fff;
        font-weight: 1000;
        background: linear-gradient(
          180deg,
          rgba(20, 45, 72, 0.96),
          rgba(4, 13, 25, 0.96)
        );
        border: 1px solid rgba(125, 211, 252, 0.28);
        box-shadow: 0 10px 22px rgba(0, 0, 0, 0.34);
      }
      .side-emoji {
        font-size: 31px;
      }
      .side span:last-child {
        font-size: 12px;
      }
      .badge {
        position: absolute;
        top: -9px;
        right: -9px;
        min-width: 25px;
        height: 25px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #ef2323;
        color: #fff;
        font-size: 13px;
        border: 2px solid rgba(255, 255, 255, 0.28);
      }
      .daily {
        top: 220px;
        left: 10px;
      }
      .tasks {
        top: 300px;
        left: 10px;
      }
      .refs {
        top: 380px;
        left: 10px;
      }
      .vip {
        top: 220px;
        right: 10px;
      }
      .boosts {
        top: 300px;
        right: 10px;
      }
      .wallet {
        top: 380px;
        right: 10px;
      }
      .bottom {
        position: absolute;
        z-index: 40;
        left: 12px;
        right: 12px;
        bottom: 12px;
        height: 88px;
        display: grid;
        grid-template-columns: 1fr 1fr 92px 1fr 1fr;
        gap: 7px;
        align-items: end;
        padding: 7px;
        border-radius: 24px;
        background: rgba(4, 12, 24, 0.88);
        border: 1px solid rgba(125, 211, 252, 0.22);
        box-shadow: 0 -12px 32px rgba(0, 0, 0, 0.42);
        overflow: visible;
      }
      .nav,
      .nav-tap {
        border: none;
        color: #fff;
        font-weight: 1000;
        border-radius: 17px;
        background: linear-gradient(
          180deg,
          rgba(20, 45, 72, 0.96),
          rgba(4, 13, 25, 0.96)
        );
        border: 1px solid rgba(125, 211, 252, 0.18);
      }
      .nav {
        height: 68px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .nav.active {
        background: linear-gradient(135deg, #0ea5ff, #1764ff);
      }
      .nav span {
        font-size: 28px;
      }
      .nav b {
        font-size: 12px;
        margin-top: 4px;
      }
      .nav-tap {
        width: 92px;
        height: 92px;
        border-radius: 50%;
        margin-bottom: 4px;
        align-self: end;
        justify-self: center;
        font-size: 21px;
        background: radial-gradient(
          circle at 34% 18%,
          #fff9b7,
          #ffd84d 38%,
          #ffae13 70%,
          #d97706
        );
        text-shadow: 0 3px 0 rgba(120, 53, 15, 0.45);
      }
      .modal {
        position: fixed;
        inset: 0;
        background: rgba(2, 6, 23, 0.78);
        display: none;
        align-items: flex-end;
        justify-content: center;
        z-index: 9999;
        backdrop-filter: blur(8px);
      }
      .modal.show {
        display: flex;
      }
      .sheet {
        width: 100%;
        max-width: 480px;
        max-height: 86vh;
        overflow: auto;
        background:
          radial-gradient(
            circle at top,
            rgba(14, 165, 255, 0.12),
            transparent 26%
          ),
          linear-gradient(180deg, #112d4d, #071424);
        border: 1px solid rgba(125, 211, 252, 0.24);
        border-top-left-radius: 30px;
        border-top-right-radius: 30px;
        padding: 16px;
      }
      .modal-header {
        position: relative;
        padding-right: 76px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
      }
      .modal-title {
        font-size: 24px;
        font-weight: 1000;
        color: #fff;
      }
      .close {
        position: absolute;
        right: 0;
        top: 0;
        width: 54px;
        height: 54px;
        border: none;
        border-radius: 18px;
        background: #1e293b;
        color: #fff;
        font-size: 24px;
      }
      .tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 14px;
      }
      .tab {
        border: none;
        border-radius: 16px;
        padding: 12px;
        font-weight: 1000;
        color: #e2e8f0;
        background: #1e293b;
      }
      .tab.active {
        color: #fff;
        background: linear-gradient(135deg, #2563eb, #60a5fa);
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .tile {
        border-radius: 20px;
        background: linear-gradient(180deg, #142f4f, #08182b);
        border: 1px solid rgba(125, 211, 252, 0.2);
        box-shadow:
          0 12px 24px rgba(0, 0, 0, 0.25),
          inset 0 2px 0 rgba(255, 255, 255, 0.07);
        padding: 14px;
      }
      .full {
        grid-column: 1/-1;
      }
      .tile-title {
        color: #94a3b8;
        font-size: 13px;
        margin-bottom: 8px;
      }
      .tile-value {
        color: #fff;
        font-size: 20px;
        font-weight: 1000;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-top: 10px;
        color: #cbd5e1;
        font-size: 13px;
      }
      .btn {
        width: 100%;
        border: none;
        border-radius: 16px;
        padding: 12px;
        margin-top: 12px;
        color: #fff;
        font-weight: 1000;
        background: linear-gradient(135deg, #10b5ff, #1764ff);
      }
      .btn.green {
        background: linear-gradient(135deg, #22c55e, #73f052);
      }
      .btn.gold {
        background: linear-gradient(135deg, #ff8a00, #ffcf25);
      }
      .animal-card {
        display: grid;
        grid-template-columns: 96px 1fr;
        gap: 12px;
        align-items: center;
      }
      .animal-img {
        width: 94px;
        height: 94px;
        object-fit: contain;
        filter: drop-shadow(0 12px 12px rgba(0, 0, 0, 0.32));
      }
      .levelchip {
        display: inline-block;
        padding: 7px 10px;
        border-radius: 999px;
        color: #fff;
        font-size: 11px;
        font-weight: 1000;
        background: linear-gradient(135deg, #0ea5ff, #1764ff);
      }
      .head {
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }
      .animal-title {
        color: #fff;
        font-size: 18px;
        font-weight: 1000;
      }
      .muted {
        color: #b8cbe3;
        font-size: 12px;
        font-weight: 900;
      }
      .income {
        text-align: right;
      }
      .income span {
        display: block;
        color: #9db7d4;
        font-size: 10px;
        font-weight: 1000;
        text-transform: uppercase;
      }
      .income b {
        color: #fff;
        font-size: 20px;
      }
      .bar-row {
        display: flex;
        justify-content: space-between;
        color: #dbeafe;
        font-size: 13px;
        font-weight: 900;
        margin-top: 8px;
      }
      .bar {
        height: 12px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(2, 8, 18, 0.72);
        margin-top: 4px;
      }
      .bar span {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #22c55e, #84cc16);
      }
      .mini {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 7px;
        margin-top: 12px;
      }
      .mini div {
        padding: 8px 6px;
        border-radius: 12px;
        background: rgba(2, 8, 18, 0.36);
        border: 1px solid rgba(125, 211, 252, 0.12);
        text-align: center;
      }
      .mini span {
        display: block;
        color: #9db7d4;
        font-size: 10px;
        font-weight: 1000;
      }
      .mini b {
        display: block;
        color: #fff;
        margin-top: 4px;
        font-size: 12px;
      }
      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .actions .btn {
        font-size: 12px;
        padding: 11px 8px;
      }
      .buy-img {
        width: 110px;
        height: 110px;
        object-fit: contain;
        margin: 0 auto 10px;
        display: block;
      }
      @media (max-width: 390px) {
        .resource {
          grid-template-columns: 32px 1fr;
          padding: 7px;
        }
        .res-icon {
          font-size: 24px;
        }
        .res-val {
          font-size: 15px;
        }
        .res-sub {
          font-size: 9px;
        }
        .warehouse {
          grid-template-columns: 56px 1fr 92px;
        }
        .animal-card {
          grid-template-columns: 82px 1fr;
        }
        .animal-img {
          width: 80px;
          height: 80px;
        }
        .mini {
          grid-template-columns: repeat(2, 1fr);
        }
        .head {
          flex-direction: column;
        }
        .income {
          text-align: left;
        }
      }

      /* PREMIUM DESIGN KEEP + EFFECTS */
      .tap-animated {
        animation: tapPulse 1.15s infinite ease-in-out;
        position: relative;
        overflow: visible !important;
      }
      .tap-animated span {
        display: block;
        font-size: 23px;
        line-height: 0.9;
      }
      .tap-animated small {
        display: block;
        font-size: 18px;
        margin-top: 2px;
      }
      .tap-animated:before {
        content: "";
        position: absolute;
        inset: -10px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(250, 204, 21, 0.35),
          transparent 62%
        );
        z-index: -1;
        animation: tapGlow 1.15s infinite ease-in-out;
      }
      @keyframes tapPulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.08);
        }
      }
      @keyframes tapGlow {
        0%,
        100% {
          opacity: 0.35;
          transform: scale(0.95);
        }
        50% {
          opacity: 0.9;
          transform: scale(1.18);
        }
      }
      .floating-coin {
        position: fixed;
        z-index: 20000;
        pointer-events: none;
        color: #fff;
        font-weight: 1000;
        font-size: 28px;
        text-shadow: 0 4px 12px rgba(0, 0, 0, 0.45);
        animation: coinFloat 0.8s ease-out forwards;
      }
      @keyframes coinFloat {
        from {
          opacity: 1;
          transform: translate(-50%, 0) scale(0.9);
        }
        to {
          opacity: 0;
          transform: translate(-50%, -75px) scale(1.15);
        }
      }
      .toast-fix {
        position: fixed;
        left: 50%;
        bottom: 130px;
        transform: translateX(-50%);
        z-index: 30000;
        max-width: 86%;
        padding: 12px 16px;
        border-radius: 16px;
        background: rgba(2, 8, 18, 0.92);
        border: 1px solid rgba(125, 211, 252, 0.25);
        color: #fff;
        font-weight: 900;
        font-size: 14px;
        text-align: center;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
        opacity: 0;
        pointer-events: none;
        transition: 0.2s ease;
      }
      .toast-fix.show {
        opacity: 1;
        transform: translateX(-50%) translateY(-8px);
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="game">
        <img
          class="farm-bg"
          src="/assets/farm_reference_bg_v5.jpg"
          alt="farm"
        />
        <div class="hud">
          <div class="player">
            <div class="avatar">👨‍🌾</div>
            <div>
              <div class="name">Farmer</div>
              <div class="lvl" id="levelBadge">LVL 1</div>
              <div class="xpbar"><span id="xpBar"></span></div>
            </div>
          </div>
          <div class="resource">
            <div class="res-icon">🪙</div>
            <div>
              <div class="res-val" id="coins">0</div>
              <div class="res-sub">+1 / tap</div>
            </div>
          </div>
          <div class="resource">
            <div class="res-icon">💎</div>
            <div>
              <div class="res-val" id="diamonds">0</div>
              <div class="res-sub">premium</div>
            </div>
          </div>
        </div>
        <div class="warehouse" id="warehouseBtn">
          <div class="wh-icon">🏚️</div>
          <div>
            <div class="wh-title">Warehouse</div>
            <div class="wh-bar"><span id="warehouseProgressBar"></span></div>
            <div class="wh-cap" id="warehouseCap">0 / 0</div>
          </div>
          <button class="upgrade" id="upgradeBtn" type="button">
            <b>UPGRADE</b><br /><span>🪙 2,500</span>
          </button>
        </div>
        <div class="status" id="boostStatus">⚡ OFF | 🤖 OFF | 👑 OFF</div>
        <button class="side daily" id="dailyBtn">
          <b class="badge">3</b><span class="side-emoji">📅</span
          ><span>Daily</span></button
        ><button class="side tasks" id="questsBtn">
          <span class="side-emoji">📋</span><span>Tasks</span></button
        ><button class="side refs" id="refsBtn">
          <span class="side-emoji">👥</span><span>Refs</span></button
        ><button class="side vip" id="vipBtn">
          <span class="side-emoji">👑</span><span>VIP</span></button
        ><button class="side boosts" id="boostBtn">
          <b class="badge">2</b><span class="side-emoji">🚀</span
          ><span>Boosts</span></button
        ><button class="side wallet" id="walletBtn">
          <span class="side-emoji">👛</span><span>Wallet</span>
        </button>
        <div class="bottom">
          <button class="nav active" id="farmBtn">
            <span>🏠</span><b>Farm</b></button
          ><button class="nav" id="animalsBtn">
            <span>🐾</span><b>Animals</b></button
          ><button class="nav-tap tap-animated" id="tapBtn">
            <span>TAP!</span><small>👆</small></button
          ><button class="nav" id="shopBtn"><span>🛒</span><b>Shop</b></button
          ><button class="nav" id="profileBtn">
            <span>👤</span><b>Profile</b>
          </button>
        </div>
      </div>
    </div>
    <div class="modal" id="modal">
      <div class="sheet">
        <div class="modal-header">
          <div class="modal-title" id="modalTitle">Menu</div>
          <button class="close" id="closeModalBtn" type="button">×</button>
        </div>
        <div class="tabs" id="modalTabs"></div>
        <div id="modalBody"></div>
      </div>
    </div>
    <script>
      const tg = window.Telegram?.WebApp;
      tg?.ready?.();
      tg?.expand?.();
      const API_BASE = "",
        TEST_ID = "123";
      let currentState = null;
      const $ = (id) => document.getElementById(id),
        modal = $("modal"),
        modalTitle = $("modalTitle"),
        modalTabs = $("modalTabs"),
        modalBody = $("modalBody");
      function getMyTelegramId() {
        return tg?.initDataUnsafe?.user?.id || TEST_ID;
      }
      function apiHeaders() {
        return {
          "Content-Type": "application/json",
          "x-telegram-id": String(getMyTelegramId()),
          "x-telegram-init-data": tg?.initData || "",
        };
      }
      async function apiGet(path) {
        const res = await fetch(API_BASE + path, { headers: apiHeaders() });
        const data = await res.json().catch(() => ({}));
        return { ok: res.ok, data };
      }
      async function apiPost(path, body = {}) {
        const res = await fetch(API_BASE + path, {
          method: "POST",
          headers: apiHeaders(),
          body: JSON.stringify(body),
        });
        const data = await res.json().catch(() => ({}));
        return { ok: res.ok, data };
      }
      function showModal() {
        modal.classList.add("show");
      }
      function closeModal() {
        modal.classList.remove("show");
      }
      function showToast(t) {
        if (t) console.log(t);
      }
      function setState(s) {
        currentState = s || {};
        $("coins").textContent = currentState.coins ?? 0;
        $("diamonds").textContent = currentState.diamonds ?? 0;
        $("levelBadge").textContent = `LVL ${currentState.level ?? 1}`;
        const xp = Number(currentState.xp ?? 0),
          need = Number(currentState.xpNeeded ?? 1);
        $("xpBar").style.width =
          `${Math.max(0, Math.min(100, Math.floor((xp / Math.max(1, need)) * 100)))}%`;
        $("boostStatus").textContent =
          `⚡ ${currentState.boost?.active ? "ON" : "OFF"} | 🤖 ${currentState.autoCollect?.active ? "ON" : "OFF"} | 👑 ${currentState.vip?.active ? "ON" : "OFF"}`;
        const st = currentState.storage || {},
          total = (st.eggs ?? 0) + (st.wool ?? 0) + (st.milk ?? 0),

          `${Math.max(0, Math.min(100, Math.floor((total / Math.max(1, cap)) * 100)))}%`;
      }
      async function loadState() {

      function img(type) {
        return type === "CHICKEN"
          ? "/assets/chicken.svg"

      }
      function bar(v) {
        v = Math.max(0, Math.min(100, Number(v || 0)));
        return `<div class="bar"><span style="width:${v}%"></span></div>`;
      }
      function prod(type, level) {
        const base = type === "CHICKEN" ? 5 : type === "SHEEP" ? 7 : 10;
        return `${base + Number(level || 0)} / цикл`;
      }
      function ph(type, level, count) {
        const base = type === "CHICKEN" ? 900 : type === "SHEEP" ? 560 : 440;
        return Math.floor(
          base * Number(count || 0) * Math.max(1, Number(level || 0)),
        );
      }
      function openAnimalsModal() {
        modalTitle.textContent = "🐾 Тварини";

      function animalCard(
        type,
        emoji,
        title,
        count,
        level,
        life,
        power,
        ready,
        feed,

          l = has ? (life ?? 100) : 0,

      function renderAnimalsOwned() {
        const s = currentState || {},
          a = s.animals || {},
          f = s.feed || {},

        modalBody.innerHTML = `<div class="grid"><div class="tile full"><div class="tile-title">🐾 My Animals</div><div class="tile-value">Total: ${(a.chicken ?? 0) + (a.sheep ?? 0) + (a.cow ?? 0)}</div></div>${animalCard("CHICKEN", "🐔", "Chicken", a.chicken ?? 0, a.chickenLevel ?? 0, a.chickenLife ?? 0, a.chickenEfficiency ?? 0, r.eggsReady ?? 0, f.chicken ?? 0, 50)}${animalCard("SHEEP", "🐑", "Sheep", a.sheep ?? 0, a.sheepLevel ?? 0, a.sheepLife ?? 0, a.sheepEfficiency ?? 0, r.woolReady ?? 0, f.sheep ?? 0, 150)}${animalCard("COW", "🐄", "Cow", a.cow ?? 0, a.cowLevel ?? 0, a.cowLife ?? 0, a.cowEfficiency ?? 0, r.milkReady ?? 0, f.cow ?? 0, 300)}</div>`;

      function renderAnimalsBuy() {

      async function heal(type) {

      function openStorageModal() {
        const s = currentState || {},

      function openFeedModal() {

      async function buyShop(code) {

          showToast("Куплено");

      }
      function openBoostersModal() {
        modalTitle.textContent = "⚡ Boosters";
        modalTabs.style.display = "none";
        const b = currentState?.boost?.active,
          a = currentState?.autoCollect?.active,

        modalBody.innerHTML = `<div class="grid"><div class="tile full"><div class="tile-title">⚡ Boost Center</div><div class="tile-value">Premium automation</div></div><div class="tile full"><div class="tile-title">⚡ Boost x2</div><div class="tile-value">${b ? "ON" : "10 💎"}</div><button class="btn" onclick="buyShop('boost_x2')">${b ? "ON" : "Купити"}</button></div><div class="tile full"><div class="tile-title">💰 Auto Sell</div><div class="tile-value">${a ? "ON" : "10 💎"}</div><button class="btn" onclick="buyShop('auto_collect')">${a ? "ON" : "Купити"}</button></div><div class="tile full"><div class="tile-title">👑 VIP</div><div class="tile-value">${v ? "ON" : "150 💎"}</div><button class="btn gold" onclick="buyShop('vip_1d')">${v ? "ON" : "VIP 24h"}</button><button class="btn gold" onclick="buyShop('vip_7d')">VIP 7d — 800 💎</button></div></div>`;
        showModal();
      }
      function openShopModal() {
        modalTitle.textContent = "🛒 Premium Shop";
        modalTabs.style.display = "none";
        modalBody.innerHTML = `<div class="grid"><div class="tile full"><div class="tile-title">Premium</div><div class="tile-value">Boosts / VIP / Stars</div></div><div class="tile"><div class="tile-title">⚡ Boost x2</div><div class="tile-value">10 💎</div><button class="btn" onclick="buyShop('boost_x2')">Купити</button></div><div class="tile"><div class="tile-title">💰 Auto Sell</div><div class="tile-value">10 💎</div><button class="btn" onclick="buyShop('auto_collect')">Купити</button></div><div class="tile"><div class="tile-title">👑 VIP 24h</div><div class="tile-value">150 💎</div><button class="btn gold" onclick="buyShop('vip_1d')">Купити</button></div><div class="tile"><div class="tile-title">⭐ Stars</div><div class="tile-value">Soon</div><button class="btn gold" onclick="showToast('Скоро')">Soon</button></div></div>`;
        showModal();
      }
      function openRefsModal() {
        modalTitle.textContent = "👥 Referrals";
        modalTabs.style.display = "none";
        const id = getMyTelegramId(),
          link = `https://t.me/my_farm_clicker_bot?startapp=ref_${id}`;
        modalBody.innerHTML = `<div class="grid"><div class="tile full"><div class="tile-title">Referral link</div><div class="tile-value" style="font-size:14px;word-break:break-all">${link}</div><button class="btn green" onclick="navigator.clipboard?.writeText('${link}')">Copy</button></div><div class="tile"><div class="tile-title">Invited</div><div class="tile-value">${currentState?.referrals?.count ?? 0}</div></div><div class="tile"><div class="tile-title">Bonus</div><div class="tile-value">+50 coins</div></div></div>`;
        showModal();
      }
      function openWalletModal() {
        modalTitle.textContent = "👛 Wallet";
        modalTabs.style.display = "none";
        modalBody.innerHTML = `<div class="grid"><div class="tile"><div class="tile-title">Diamonds</div><div class="tile-value">${currentState?.diamonds ?? 0} 💎</div></div><div class="tile"><div class="tile-title">Points</div><div class="tile-value">${currentState?.points ?? 0} ⭐</div></div><div class="tile full"><div class="tile-title">Withdraw</div><div class="tile-value">Coming soon</div><button class="btn gold">Withdraw Soon</button></div></div>`;
        showModal();
      }
      function openProfileModal() {
        modalTitle.textContent = "👤 Profile";
        modalTabs.style.display = "none";
        modalBody.innerHTML = `<div class="grid"><div class="tile full"><div class="tile-title">Farmer</div><div class="tile-value">LVL ${currentState?.level ?? 1}</div><div class="row"><span>Coins</span><span>${currentState?.coins ?? 0}</span></div><div class="row"><span>Diamonds</span><span>${currentState?.diamonds ?? 0}</span></div><div class="row"><span>Points</span><span>${currentState?.points ?? 0}</span></div></div></div>`;
        showModal();
      }
      function openLabModal() {
        modalTitle.textContent = "🧪 Лабораторія";
        modalTabs.style.display = "none";
        modalBody.innerHTML = `<div class="grid"><div class="tile full"><div class="tile-title">Upgrade</div><div class="tile-value">Лабораторія / склад</div><button class="btn green" onclick="buyShop('warehouse_upgrade')">Upgrade Warehouse</button><button class="btn green" onclick="buyShop('lab_upgrade')">Upgrade Lab</button></div></div>`;
        showModal();
      }
      function openDailyModal() {
        modalTitle.textContent = "🎁 Daily";
        modalTabs.style.display = "none";
        modalBody.innerHTML = `<div class="grid"><div class="tile full"><div class="tile-title">Daily Rewards</div><div class="tile-value">Coming soon</div></div></div>`;
        showModal();
      }
      function openQuestsModal() {
        modalTitle.textContent = "📋 Квести";
        modalTabs.style.display = "none";
        modalBody.innerHTML = `<div class="grid"><div class="tile full"><div class="tile-title">Quests</div><div class="tile-value">Coming soon</div></div></div>`;
        showModal();
      }
      $("tapBtn").onclick = collect;
      $("animalsBtn").onclick = openAnimalsModal;
      $("shopBtn").onclick = openShopModal;
      $("profileBtn").onclick = openProfileModal;
      $("warehouseBtn").onclick = openStorageModal;
      $("upgradeBtn").onclick = (e) => {
        e.stopPropagation();
        openLabModal();
      };
      $("dailyBtn").onclick = openDailyModal;
      $("questsBtn").onclick = openQuestsModal;
      $("refsBtn").onclick = openRefsModal;
      $("vipBtn").onclick = openBoostersModal;
      $("boostBtn").onclick = openBoostersModal;
      $("walletBtn").onclick = openWalletModal;
      $("farmBtn").onclick = loadState;
      $("closeModalBtn").onclick = closeModal;
      modal.onclick = (e) => {
        if (e.target === modal) closeModal();
      };
      loadState();

      /* PREMIUM DESIGN + STATE/TAP FINAL */
      (function () {
        function toastBox() {
          let box = document.getElementById("toastFix");
          if (!box) {
            box = document.createElement("div");
            box.id = "toastFix";
            box.className = "toast-fix";
            document.body.appendChild(box);
          }
          return box;
        }

        window.showToast = function (text) {
          const box = toastBox();
          box.textContent = text || "ok";
          box.classList.add("show");
          clearTimeout(window.__toastFixTimer);
          window.__toastFixTimer = setTimeout(
            () => box.classList.remove("show"),
            2400,
          );
        };

        window.showTapEffect = function () {
          const btn = document.getElementById("tapBtn");
          if (!btn) return;
          const r = btn.getBoundingClientRect();
          const el = document.createElement("div");
          el.className = "floating-coin";
          el.textContent = "+1 🪙";
          el.style.left = r.left + r.width / 2 + "px";
          el.style.top = r.top - 8 + "px";
          document.body.appendChild(el);
          setTimeout(() => el.remove(), 850);
        };

        function normalizeState(data) {
          if (!data) return null;
          if (data.user) return data.user;
          if (data.state) return data.state;
          if (data.data?.user) return data.data.user;
          if (data.data?.state) return data.data.state;
          if (data.data) return data.data;
          return data;
        }

        async function rawGet(path) {
          const res = await fetch(path, { headers: apiHeaders() });
          const text = await res.text();
          let data = {};
          try {
            data = text ? JSON.parse(text) : {};
          } catch {
            data = { error: text || res.statusText };
          }
          return { ok: res.ok, status: res.status, data };
        }

        async function rawPost(path, body = {}) {
          const res = await fetch(path, {
            method: "POST",
            headers: apiHeaders(),
            body: JSON.stringify(body),
          });
          const text = await res.text();
          let data = {};
          try {
            data = text ? JSON.parse(text) : {};
          } catch {
            data = { error: text || res.statusText };
          }
          return { ok: res.ok, status: res.status, data };
        }

        async function tryGet(paths) {
          let last = null;
          for (const p of paths) {
            try {
              const r = await rawGet(p);
              last = r;
              if (r.ok) return r;
            } catch (e) {
              last = {
                ok: false,
                status: 0,
                data: { error: String(e?.message || e) },
              };
            }
          }
          return last;
        }

        async function tryPost(paths, body = {}) {
          let last = null;
          for (const p of paths) {
            try {
              const r = await rawPost(p, body);
              last = r;
              if (r.ok) return r;
            } catch (e) {
              last = {
                ok: false,
                status: 0,
                data: { error: String(e?.message || e) },
              };
            }
          }
          return last;
        }

        function applyState(r) {
          if (!r?.ok) return false;
          const s = normalizeState(r.data);
          if (s && typeof s === "object") {
            setState(s);
            return true;
          }
          return false;
        }

        window.loadState = async function () {
          const r = await tryGet(["/api/state", "/state"]);
          if (!applyState(r)) {
            showToast(
              `State route не працює: ${r?.status || ""} ${r?.data?.error || ""}`,
            );
          }
        };

        window.collect = async function () {
          try {
            showTapEffect();

            const coinsEl = document.getElementById("coins");
            const before =
              Number(
                String(coinsEl?.textContent || "0").replace(/[^\d.-]/g, ""),
              ) || 0;
            if (coinsEl) coinsEl.textContent = String(before + 1);

            const telegramId =
              window.Telegram?.WebApp?.initDataUnsafe?.user?.id ||
              (typeof getMyTelegramId === "function"
                ? getMyTelegramId()
                : "123");

            const r = await tryPost(["/api/tap", "/tap"], {
              telegramId: String(telegramId),
              amount: 1,
            });

            if (!applyState(r)) {
              if (coinsEl) coinsEl.textContent = String(before);
              showToast(
                `Tap error: ${r?.status || ""} ${r?.data?.error || ""}`,
              );
            }
          } catch (e) {
            showToast("Tap server error");
          }
        };

        function bindFinal() {
          const bind = (id, fn) => {
            const el = document.getElementById(id);
            if (!el) return;
            el.onclick = (e) => {
              e.preventDefault();
              e.stopPropagation();
              fn();
            };
          };
          bind("tapBtn", window.collect);
          bind("navTapBtn", window.collect);
          bind("farmBtn", window.loadState);
        }

        window.addEventListener("load", bindFinal);
        setTimeout(bindFinal, 300);
        setTimeout(() => window.loadState?.(), 600);
      })();
    </script>
  </body>
</html>
