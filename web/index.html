<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>My Farm Clicker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        color: #e5e7eb;
        touch-action: manipulation;
        overscroll-behavior: none;
        background:
          radial-gradient(
            circle at top,
            rgba(59, 130, 246, 0.18),
            transparent 30%
          ),
          linear-gradient(180deg, #0b1220 0%, #111827 45%, #0f172a 100%);
      }
      .app {
        max-width: 480px;
        margin: 0 auto;
        min-height: 100vh;
        padding: 16px 14px 28px;
      }
      .card {
        background: rgba(17, 24, 39, 0.88);
        border: 1px solid rgba(59, 130, 246, 0.18);
        border-radius: 24px;
        padding: 16px;
        margin-bottom: 16px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.25);
        backdrop-filter: blur(8px);
      }
      .top-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
      }
      .title {
        font-size: 28px;
        font-weight: 800;
        color: #f8fafc;
        line-height: 1.1;
      }
      .subtitle {
        margin-top: 6px;
        color: #94a3b8;
        font-size: 13px;
      }
      .level-badge {
        min-width: 90px;
        text-align: center;
        padding: 14px 12px;
        border-radius: 18px;
        font-size: 16px;
        font-weight: 800;
        color: #fff;
        background: linear-gradient(135deg, #2563eb, #60a5fa);
        box-shadow: 0 10px 24px rgba(37, 99, 235, 0.28);
      }
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }
      .stat-box {
        background: rgba(30, 41, 59, 0.85);
        border: 1px solid rgba(148, 163, 184, 0.14);
        border-radius: 18px;
        padding: 12px 8px;
        text-align: center;
      }
      .stat-label {
        color: #94a3b8;
        font-size: 11px;
        margin-bottom: 8px;
      }
      .stat-value {
        color: #f8fafc;
        font-size: 18px;
        font-weight: 800;
      }
      .section-title {
        font-size: 18px;
        font-weight: 800;
        color: #f8fafc;
        margin-bottom: 12px;
      }
      .status-line {
        margin-top: 12px;
        text-align: center;
        color: #cbd5e1;
        font-size: 14px;
        font-weight: 700;
        line-height: 1.5;
      }
      .tap-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 10px 0 2px;
      }
      .tap-btn {
        width: 200px;
        height: 200px;
        border: none;
        border-radius: 50%;
        cursor: pointer;
        color: #fff;
        font-size: 34px;
        font-weight: 900;
        letter-spacing: 1px;
        background: radial-gradient(
          circle at 30% 20%,
          #93c5fd,
          #3b82f6 55%,
          #1d4ed8 100%
        );
        box-shadow:
          0 20px 50px rgba(37, 99, 235, 0.34),
          inset 0 8px 18px rgba(255, 255, 255, 0.22);
        transition: transform 0.08s ease;
      }
      .tap-btn:active {
        transform: scale(0.96);
      }
      .tap-hint {
        margin-top: 18px;
        text-align: center;
        color: #94a3b8;
        font-size: 14px;
      }
      .menu-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }
      .menu-btn {
        background: rgba(30, 41, 59, 0.85);
        border: 1px solid rgba(148, 163, 184, 0.14);
        border-radius: 22px;
        min-height: 98px;
        padding: 12px 8px;
        cursor: pointer;
        color: #f8fafc;
        font-size: 13px;
        font-weight: 800;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .menu-emoji {
        font-size: 30px;
        line-height: 1;
      }
      .main-btn {
        width: 100%;
        border: none;
        border-radius: 18px;
        padding: 16px;
        margin-top: 12px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 800;
        color: white;
        background: linear-gradient(135deg, #2563eb, #60a5fa);
        box-shadow: 0 12px 28px rgba(37, 99, 235, 0.25);
      }
      .floating {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: 240px;
        z-index: 999;
        pointer-events: none;
        font-size: 24px;
        font-weight: 900;
        color: #93c5fd;
        text-shadow: 0 2px 14px rgba(59, 130, 246, 0.5);
        animation: floatUp 0.9s ease forwards;
      }
      @keyframes floatUp {
        0% {
          opacity: 1;
          transform: translateX(-50%) translateY(0) scale(0.95);
        }
        100% {
          opacity: 0;
          transform: translateX(-50%) translateY(-70px) scale(1.12);
        }
      }
      .modal {
        position: fixed;
        inset: 0;
        background: rgba(2, 6, 23, 0.78);
        display: none;
        align-items: flex-end;
        justify-content: center;
        z-index: 1000;
      }
      .modal.show {
        display: flex;
      }
      .modal-sheet {
        width: 100%;
        max-width: 480px;
        background: #0f172a;
        border-top-left-radius: 24px;
        border-top-right-radius: 24px;
        border: 1px solid rgba(59, 130, 246, 0.16);
        padding: 16px;
        max-height: 86vh;
        overflow: auto;
      }
      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
      }
      .modal-title {
        font-size: 20px;
        font-weight: 800;
        color: #f8fafc;
      }
      .close-btn {
        width: 40px;
        height: 40px;
        border-radius: 14px;
        border: none;
        background: rgba(30, 41, 59, 0.9);
        color: #f8fafc;
        font-size: 18px;
        cursor: pointer;
      }
      .tabs {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 10px;
        margin-bottom: 14px;
      }
      .tab-btn {
        border: none;
        border-radius: 16px;
        padding: 12px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 800;
        color: #e2e8f0;
        background: rgba(30, 41, 59, 0.9);
      }
      .tab-btn.active {
        color: #fff;
        background: linear-gradient(135deg, #2563eb, #60a5fa);
      }
      .modal-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .tile {
        background: rgba(30, 41, 59, 0.92);
        border: 1px solid rgba(148, 163, 184, 0.14);
        border-radius: 18px;
        padding: 14px;
      }
      .tile-title {
        color: #94a3b8;
        font-size: 13px;
        margin-bottom: 8px;
      }
      .tile-value {
        color: #f8fafc;
        font-size: 18px;
        font-weight: 800;
      }
      .tile-row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-top: 10px;
        color: #cbd5e1;
        font-size: 13px;
      }
      .buy-btn {
        width: 100%;
        border: none;
        border-radius: 14px;
        padding: 12px;
        margin-top: 12px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 800;
        color: #fff;
        background: linear-gradient(135deg, #2563eb, #60a5fa);
      }
      .buy-btn.green {
        background: linear-gradient(135deg, #15803d, #22c55e);
      }
      .buy-btn.gold {
        background: linear-gradient(135deg, #b45309, #f59e0b);
      }
      .note {
        color: #94a3b8;
        font-size: 13px;
        line-height: 1.45;
      }
      .warn {
        color: #fca5a5;
        font-size: 13px;
        line-height: 1.45;
        margin-top: 8px;
        font-weight: 700;
      }
      .wheel-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .wheel-disc {
        width: 220px;
        height: 220px;
        border-radius: 50%;
        border: 8px solid #1d4ed8;
        background: conic-gradient(
          #60a5fa 0 60deg,
          #1e40af 60deg 120deg,
          #93c5fd 120deg 180deg,
          #2563eb 180deg 240deg,
          #60a5fa 240deg 300deg,
          #1e40af 300deg 360deg
        );
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
        position: relative;
        transition: transform 3s cubic-bezier(0.18, 0.89, 0.32, 1.08);
      }
      .wheel-center {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: #0f172a;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        border: 4px solid #60a5fa;
      }
      .wheel-pointer {
        width: 0;
        height: 0;
        border-left: 14px solid transparent;
        border-right: 14px solid transparent;
        border-top: 22px solid #f8fafc;
        margin-bottom: -8px;
      }
      .share-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        align-items: center;
      }
      .code-box,
      .input-box {
        width: 100%;
        padding: 12px;
        border-radius: 12px;
        border: none;
        background: #1e293b;
        color: #fff;
        font-size: 14px;
      }
      .full {
        grid-column: 1 / -1;
      }
      #resultBox {
        display: none;
      }
      .daily-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin-bottom: 15px;
      }

      .daily-item {
        background: #1e293b;
        border-radius: 12px;
        padding: 10px;
        text-align: center;
        font-size: 12px;
      }

      .daily-item.active {
        border: 2px solid #3b82f6;
      }

      .daily-item.done {
        opacity: 0.5;
      }

      .daily-item .day {
        font-weight: 700;
        margin-bottom: 5px;
      }

      .daily-item .reward {
        font-size: 11px;
      }
      .quest-tabs {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-bottom: 14px;
      }

      .quest-tab-btn {
        border: none;
        border-radius: 14px;
        padding: 12px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 800;
        color: #e2e8f0;
        background: rgba(30, 41, 59, 0.9);
      }

      .quest-tab-btn.active {
        color: #fff;
        background: linear-gradient(135deg, #2563eb, #60a5fa);
      }

      .chance-green {
        color: #22c55e;
        font-weight: 900;
      }

      .chance-gold {
        color: #facc15;
        font-weight: 900;
      }

      .chance-danger {
        color: #f87171;
        font-weight: 900;
      }

      .unlock-progress {
        color: #93c5fd;
        font-weight: 800;
      }

      .levelup-modal {
        position: fixed;
        inset: 0;
        background: rgba(2, 6, 23, 0.82);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 2000;
        padding: 20px;
      }

      .levelup-modal.show {
        display: flex;
      }

      .levelup-card {
        width: 100%;
        max-width: 360px;
        background: linear-gradient(180deg, #111827, #0f172a);
        border: 1px solid rgba(250, 204, 21, 0.35);
        border-radius: 28px;
        padding: 24px;
        text-align: center;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
        animation: levelPop 0.25s ease-out;
      }

      @keyframes levelPop {
        from {
          transform: scale(0.86);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }

      .levelup-title {
        font-size: 28px;
        font-weight: 900;
        color: #facc15;
        margin-bottom: 8px;
      }

      .levelup-level {
        font-size: 38px;
        font-weight: 900;
        color: #f8fafc;
        margin-bottom: 16px;
      }

      .levelup-reward {
        background: rgba(30, 41, 59, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.16);
        border-radius: 18px;
        padding: 14px;
        margin: 10px 0;
        font-size: 18px;
        font-weight: 800;
        color: #e5e7eb;
      }

      .levelup-note {
        color: #94a3b8;
        font-size: 13px;
        margin-top: 10px;
        line-height: 1.4;
      }

      /* PREMIUM FARM DESIGN OVER OLD WORKING LOGIC */
      body {
        background: #06111f !important;
      }
      .app {
        max-width: 480px !important;
        margin: 0 auto !important;
        min-height: 100vh !important;
        padding: 8px 6px 18px !important;
      }
      .premium-game {
        position: relative;
        min-height: calc(100vh - 20px);
        overflow: hidden;
        border-radius: 28px;
        background: #06111f;
        border: 1px solid rgba(125, 211, 252, 0.28);
        box-shadow:
          0 22px 60px rgba(0, 0, 0, 0.5),
          inset 0 2px 0 rgba(255, 255, 255, 0.08);
      }
      .premium-game::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 2;
        background: linear-gradient(
          180deg,
          rgba(4, 12, 24, 0.58),
          transparent 20%,
          transparent 74%,
          rgba(4, 12, 24, 0.88)
        );
      }
      .premium-bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 1;
      }
      .premium-top {
        position: relative;
        z-index: 10;
        display: grid;
        grid-template-columns: 1.2fr 1fr 1fr 1fr;
        gap: 8px;
        padding: 10px;
        background: linear-gradient(
          180deg,
          rgba(6, 18, 34, 0.96),
          rgba(3, 10, 20, 0.96)
        );
        border-bottom: 1px solid rgba(125, 211, 252, 0.18);
        box-shadow:
          0 14px 32px rgba(0, 0, 0, 0.38),
          inset 0 2px 0 rgba(255, 255, 255, 0.08);
      }
      .player-box {
        display: grid;
        grid-template-columns: 52px 1fr;
        gap: 8px;
        align-items: center;
        min-width: 0;
      }
      .avatar {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 30px;
        background: linear-gradient(135deg, #0ea5ff, #1764ff);
        border: 2px solid rgba(255, 255, 255, 0.24);
        box-shadow: 0 8px 18px rgba(14, 165, 255, 0.3);
      }
      .player-name {
        font-size: 17px;
        font-weight: 1000;
        color: #fff;
        line-height: 1;
      }
      .player-lvl {
        color: #b8cbe3;
        font-size: 11px;
        font-weight: 900;
        margin-top: 5px;
      }
      .xp-line {
        height: 10px;
        margin-top: 5px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.55);
        overflow: hidden;
      }
      .xp-line span {
        display: block;
        height: 100%;
        width: 30%;
        border-radius: inherit;
        background: linear-gradient(90deg, #43e329, #a3e635, #facc15);
        box-shadow: 0 0 16px rgba(163, 230, 53, 0.55);
      }
      .resource-box {
        min-width: 0;
        display: grid;
        grid-template-columns: 42px 1fr;
        gap: 8px;
        align-items: center;
        padding: 9px;
        border-radius: 16px;
        background: linear-gradient(
          180deg,
          rgba(14, 35, 59, 0.94),
          rgba(4, 13, 25, 0.94)
        );
        border: 1px solid rgba(125, 211, 252, 0.18);
      }
      .resource-icon {
        font-size: 30px;
      }
      .resource-value {
        color: #fff;
        font-size: 19px;
        font-weight: 1000;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .resource-sub {
        color: #b8cbe3;
        font-size: 11px;
        font-weight: 900;
      }
      .hidden-old-stats {
        position: absolute;
        left: -9999px;
        width: 1px;
        height: 1px;
        overflow: hidden;
      }
      .warehouse-panel {
        position: relative;
        z-index: 10;
        width: calc(100% - 20px);
        margin: 8px 10px 0;
        display: grid;
        grid-template-columns: 78px 1fr 112px;
        gap: 10px;
        align-items: center;
        padding: 10px;
        border-radius: 20px;
        border: 1px solid rgba(125, 211, 252, 0.28);
        background: linear-gradient(
          180deg,
          rgba(13, 81, 159, 0.9),
          rgba(5, 27, 62, 0.95)
        );
        color: white;
        text-align: left;
        cursor: pointer;
        box-shadow:
          0 12px 26px rgba(0, 0, 0, 0.28),
          inset 0 2px 0 rgba(255, 255, 255, 0.08);
      }
      .warehouse-icon {
        font-size: 48px;
      }
      .warehouse-title {
        font-size: 17px;
        font-weight: 1000;
      }
      .warehouse-bar {
        height: 18px;
        margin-top: 8px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.62);
        overflow: hidden;
      }
      .warehouse-bar span {
        display: block;
        height: 100%;
        width: 0%;
        border-radius: inherit;
        background: linear-gradient(90deg, #22c55e, #facc15, #ff9f0a);
        box-shadow: 0 0 16px rgba(250, 204, 21, 0.42);
      }
      .warehouse-cap {
        color: #dbeafe;
        text-align: center;
        margin-top: 5px;
        font-size: 12px;
        font-weight: 900;
      }
      .warehouse-upgrade {
        text-align: center;
        border-radius: 16px;
        padding: 12px 8px;
        color: #fff;
        background: linear-gradient(180deg, #7cff32, #129909);
        font-weight: 1000;
        box-shadow:
          0 0 22px rgba(34, 197, 94, 0.42),
          inset 0 2px 0 rgba(255, 255, 255, 0.25);
      }
      .premium-status {
        position: relative;
        z-index: 10;
        margin: 8px 10px 0;
        text-align: center;
        padding: 8px;
        border-radius: 999px;
        background: rgba(2, 8, 18, 0.58);
        border: 1px solid rgba(125, 211, 252, 0.16);
        font-weight: 1000;
        color: #e5e7eb;
      }
      .side-btn {
        position: absolute;
        z-index: 11;
        width: 64px;
        min-height: 70px;
        border: none;
        border-radius: 14px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        color: #fff;
        font-weight: 1000;
        background: linear-gradient(
          180deg,
          rgba(20, 45, 72, 0.96),
          rgba(4, 13, 25, 0.96)
        );
        border: 1px solid rgba(125, 211, 252, 0.28);
        box-shadow:
          0 10px 22px rgba(0, 0, 0, 0.34),
          inset 0 2px 0 rgba(255, 255, 255, 0.1);
      }
      .side-btn span {
        font-size: 31px;
        line-height: 1;
      }
      .side-btn strong {
        font-size: 12px;
      }
      .notify {
        position: absolute;
        top: -9px;
        right: -9px;
        min-width: 25px;
        height: 25px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #ef2323;
        color: #fff;
        font-size: 13px;
        border: 2px solid rgba(255, 255, 255, 0.28);
      }
      .daily {
        top: 220px;
        left: 10px;
      }
      .tasks {
        top: 300px;
        left: 10px;
      }
      .refs {
        top: 380px;
        left: 10px;
      }
      .vip {
        top: 220px;
        right: 10px;
      }
      .boosts {
        top: 300px;
        right: 10px;
      }
      .wallet {
        top: 380px;
        right: 10px;
      }
      .tap-float-label {
        position: absolute;
        z-index: 12;
        left: 50%;
        bottom: 132px;
        transform: translateX(-50%);
        padding: 7px 16px;
        border-radius: 999px;
        background: rgba(2, 8, 18, 0.55);
        color: #fff;
        font-weight: 900;
        font-size: 13px;
      }
      .bottom-nav {
        position: absolute;
        z-index: 40;
        left: 12px;
        right: 12px;
        bottom: 12px;
        height: 88px;
        display: grid;
        grid-template-columns: 1fr 1fr 92px 1fr 1fr;
        gap: 7px;
        align-items: end;
        padding: 7px;
        border-radius: 24px;
        background: rgba(4, 12, 24, 0.88);
        border: 1px solid rgba(125, 211, 252, 0.22);
        box-shadow: 0 -12px 32px rgba(0, 0, 0, 0.42);
        overflow: visible;
      }
      .nav-btn,
      .premium-tap {
        border: none;
        color: #fff;
        font-weight: 1000;
        border-radius: 17px;
        background: linear-gradient(
          180deg,
          rgba(20, 45, 72, 0.96),
          rgba(4, 13, 25, 0.96)
        );
        border: 1px solid rgba(125, 211, 252, 0.18);
      }
      .nav-btn {
        height: 68px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .nav-btn.active {
        background: linear-gradient(135deg, #0ea5ff, #1764ff);
        box-shadow:
          0 0 22px rgba(14, 165, 255, 0.38),

      .premium-tap {
        width: 92px !important;

        border-radius: 50% !important;
        margin-bottom: 4px;
        align-self: end;
        justify-self: center;
        font-size: 21px !important;
        background: radial-gradient(

        ) !important;
        text-shadow: 0 3px 0 rgba(120, 53, 15, 0.45);
        box-shadow:
          0 12px 25px rgba(255, 171, 0, 0.42),
          inset 0 4px 0 rgba(255, 255, 255, 0.32);
        animation: tapPulse 1.15s infinite ease-in-out;
      }
      @keyframes tapPulse {
        0%,
        100% {
          transform: scale(1);

      .modal-sheet {

        border: 1px solid rgba(125, 211, 252, 0.24) !important;

      .tile {

        box-shadow:
          0 12px 24px rgba(0, 0, 0, 0.25),
          inset 0 2px 0 rgba(255, 255, 255, 0.07) !important;
      }
      .buy-btn,
      .main-btn {
        border-radius: 16px !important;
        font-weight: 1000 !important;
        background: linear-gradient(135deg, #10b5ff, #1764ff) !important;
      }
      .buy-btn.green {

      @media (max-width: 390px) {

      }
    </style>
  </head>
  <body>

    <div class="levelup-modal" id="levelUpModal">
      <div class="levelup-card">
        <div class="levelup-title">🎉 LEVEL UP!</div>
        <div class="levelup-level" id="levelUpText">LVL 2</div>
        <div class="levelup-reward" id="levelUpCoins">+0 coins</div>
        <div class="levelup-reward" id="levelUpDiamonds">+0 diamonds</div>

          Новий рівень відкриває більше можливостей у грі 🚜

    <div class="modal" id="modal">
      <div class="modal-sheet">
        <div class="modal-header">
          <div class="modal-title" id="modalTitle">Вікно</div>
          <button class="close-btn" id="closeModalBtn">✕</button>
        </div>
        <div id="modalTabs" style="display: none">
          <div class="tabs">
            <button class="tab-btn active" id="tabBuyBtn">Купити</button
            ><button class="tab-btn" id="tabOwnedBtn">Мої</button
            ><button class="tab-btn" id="tabUpgradeBtn">Upgrade</button>
          </div>
        </div>
        <div id="modalBody"></div>
      </div>
    </div>
    <script>
      const tg = window.Telegram?.WebApp;
      const API = "https://tg-farm-api.onrender.com/api";
      const BOT_USERNAME = "my_farm_clicker_bot";
      if (tg) {
        tg.ready();
        tg.expand();
      }
      const initData = tg?.initData ?? "";
      function getMyTelegramId() {
        return currentState?.telegramId || tg?.initDataUnsafe?.user?.id || "";
      }

      function makeReferralLink() {
        const myTelegramId = getMyTelegramId();

        if (!myTelegramId) {
          return `https://t.me/${BOT_USERNAME}`;
        }

        return `https://t.me/${BOT_USERNAME}?start=ref_${myTelegramId}`;
      }
      const modal = document.getElementById("modal"),
        modalTitle = document.getElementById("modalTitle"),
        modalBody = document.getElementById("modalBody"),
        modalTabs = document.getElementById("modalTabs"),
        tabBuyBtn = document.getElementById("tabBuyBtn"),
        tabOwnedBtn = document.getElementById("tabOwnedBtn"),
        tabUpgradeBtn = document.getElementById("tabUpgradeBtn"),
        resultBox = document.getElementById("resultBox"),
        statusEl = document.getElementById("status"),
        coinsEl = document.getElementById("coins"),
        diamondsEl = document.getElementById("diamonds"),
        pointsEl = document.getElementById("points"),
        xpEl = document.getElementById("xp"),
        levelBadgeEl = document.getElementById("levelBadge"),
        boostStatusEl = document.getElementById("boostStatus"),
        levelUpModal = document.getElementById("levelUpModal"),
        levelUpText = document.getElementById("levelUpText"),
        levelUpCoins = document.getElementById("levelUpCoins"),
        levelUpDiamonds = document.getElementById("levelUpDiamonds"),
        levelUpCloseBtn = document.getElementById("levelUpCloseBtn");
      let currentState = null;
      let lastKnownLevel = null;
      let wheelRotation = 0;
      function setStatus(t) {
        statusEl.textContent = t;
      }
      function setResult(d) {
        resultBox.textContent =
          typeof d === "string" ? d : JSON.stringify(d, null, 2);
      }
      async function apiGet(path) {
        const res = await fetch(`${API}${path}`, {
          method: "GET",
          headers: { "x-telegram-init-data": initData },
        });
        const text = await res.text();
        let json;
        try {
          json = JSON.parse(text);
        } catch {
          json = text;
        }
        return { ok: res.ok, data: json };
      }
      async function apiPost(path, body = {}) {
        const res = await fetch(`${API}${path}`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-telegram-init-data": initData,
          },
          body: JSON.stringify(body),
        });
        const text = await res.text();
        let json;
        try {
          json = JSON.parse(text);
        } catch {
          json = text;
        }
        return { ok: res.ok, data: json };
      }
      function spawnFloatingText(text) {
        const el = document.createElement("div");
        el.className = "floating";
        el.textContent = text;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 900);
      }
      function showToast(text) {
        spawnFloatingText(text);
      }

      function showLevelUpPopup(xpData) {
        if (!xpData || !levelUpModal) return;

        levelUpText.textContent = `LVL ${xpData.level ?? currentState?.level ?? 1}`;
        levelUpCoins.textContent = `+${xpData.rewardCoins ?? 0} coins`;
        levelUpDiamonds.textContent = `+${xpData.rewardDiamonds ?? 0} diamonds`;

        levelUpModal.classList.add("show");
      }

      function handleXpResult(xpData) {
        if (xpData?.leveledUp) {
          showLevelUpPopup(xpData);

          if (xpData.level) {
            lastKnownLevel = xpData.level;
          }

          return true;
        }

        return false;
      }

      if (levelUpCloseBtn) {
        levelUpCloseBtn.addEventListener("click", () => {
          levelUpModal.classList.remove("show");
        });
      }

      function applyState(data) {
        const newLevel = data?.level ?? 1;

        if (
          lastKnownLevel !== null &&
          newLevel > lastKnownLevel &&
          levelUpModal &&
          data?.lastLevelRewardCoins > 0
        ) {
          showLevelUpPopup({
            level: newLevel,
            rewardCoins: data?.lastLevelRewardCoins ?? 0,
            rewardDiamonds: data?.lastLevelRewardDiamonds ?? 0,
          });
        }

        lastKnownLevel = newLevel;
        currentState = data;

        coinsEl.textContent = data?.coins ?? 0;
        diamondsEl.textContent = data?.diamonds ?? 0;
        pointsEl.textContent = data?.points ?? 0;
        xpEl.textContent = `${data?.xp ?? 0}/${data?.xpNeeded ?? 0}`;
        levelBadgeEl.textContent = `LVL ${newLevel}`;
        const boost = data?.boost?.active ? "ON" : "OFF";
        const auto = data?.autoCollect?.active ? "ON" : "OFF";
        const vip = data?.vip?.active ? "ON" : "OFF";
        boostStatusEl.innerText = `⚡ ${boost} | 🤖 ${auto} | 👑 ${vip}`;
      }
      async function loadState() {
        try {
          setStatus("loading...");
          const res = await apiGet("/state");
          setResult(res.data);
          if (res.ok) {
            applyState(res.data);
            setStatus("ok");
          } else {
            setStatus("error");
          }
        } catch (e) {
          setStatus("error");
          setResult(String(e));
        }
      }
      async function collect() {
        try {
          setStatus("collect...");
          const res = await apiPost("/collect");
          setResult(res.data);
          if (res.ok) {
            if (!handleXpResult(res.data?.levelUpData)) {
              showToast(`+${res.data?.added ?? 1}`);
            }

            await loadState();
            setStatus("ok");
          } else {
            setStatus("error");
          }
        } catch (e) {
          setStatus("error");
          setResult(String(e));
        }
      }
      function showModal() {
        modal.classList.add("show");
      }
      function closeModal() {
        modal.classList.remove("show");
      }
      modal.addEventListener("click", (e) => {
        if (e.target === modal) closeModal();
      });
      async function buyAnimal(type) {
        const res = await apiPost("/buy-animal", { type });
        setResult(res.data);
        if (res.ok) {
          if (!handleXpResult(res.data?.levelUpData)) {
            showToast("Куплено");
          }

          await loadState();
          renderAnimalsOwned();
        } else {
          showToast(res.data?.error || "Помилка");
        }
      }
      async function healAnimals(type) {
        const res = await apiPost("/heal", { type });
        setResult(res.data);

        if (res.ok) {
          showToast(`❤️ Лікування: -${res.data?.cost ?? 0} coins`);
          await loadState();
          renderAnimalsOwned();
        } else {
          showToast(res.data?.error || "Помилка лікування");
        }
      }

      function renderAnimalsBuy() {
        tabBuyBtn.classList.add("active");
        tabOwnedBtn.classList.remove("active");
        tabUpgradeBtn.classList.remove("active");

        const level = currentState?.level ?? 1;

        function animalBuyCard(params) {
          const { emoji, title, price, resource, type, unlockLevel } = params;
          const unlocked = level >= unlockLevel;

          return `
                  <div class="tile">
                    <div class="tile-title">${emoji} ${title}</div>
                    <div class="tile-value">${unlocked ? `${price} coins` : `🔒 LVL ${unlockLevel}`}</div>
                    <div class="tile-row"><span>Ресурс</span><span>${resource}</span></div>
                    <div class="tile-row">
                      <span>Прогрес</span>
                      <span class="unlock-progress">${Math.min(level, unlockLevel)} / ${unlockLevel}</span>
                    </div>
                    <div class="tile-row"><span>Відкривається</span><span>LVL ${unlockLevel}</span></div>
                    ${
                      unlocked
                        ? `<button class="buy-btn" data-animal="${type}">Купити</button>`
                        : `<button class="buy-btn gold" disabled>Потрібен LVL ${unlockLevel}</button>`
                    }
                  </div>
                `;
        }

        modalBody.innerHTML = `
                <div class="modal-grid">
                  ${animalBuyCard({
                    emoji: "🐔",
                    title: "Курка",
                    price: 100,
                    resource: "Яйця",
                    type: "CHICKEN",
                    unlockLevel: 1,
                  })}
                  ${animalBuyCard({
                    emoji: "🐑",
                    title: "Вівця",
                    price: 500,
                    resource: "Шерсть",
                    type: "SHEEP",
                    unlockLevel: 5,
                  })}
                  ${animalBuyCard({
                    emoji: "🐄",
                    title: "Корова",
                    price: 1000,
                    resource: "Молоко",
                    type: "COW",
                    unlockLevel: 10,
                  })}
                </div>
              `;

        modalBody.querySelectorAll("[data-animal]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            await buyAnimal(btn.getAttribute("data-animal"));
          });
        });
      }
      function animalFeedWarning(v) {
        return v > 0
          ? `<div class="tile-row"><span>Корм</span><span>${v}</span></div>`
          : `<div class="warn">Немає корму ❌</div>`;
      }
      function renderAnimalsOwned() {
        tabBuyBtn.classList.remove("active");
        tabOwnedBtn.classList.add("active");
        tabUpgradeBtn.classList.remove("active");

        const animals = currentState?.animals || {};
        const ready = currentState?.ready || {};
        const feed = currentState?.feedStock || {};

        function productionPerCycle(type, level) {
          if (!level) return 0;

          if (type === "CHICKEN") return 1 + (level - 1);
          if (type === "SHEEP") return 3 + (level - 1);
          if (type === "COW") return 7 + (level - 1) * 2;

          return 0;
        }

        function pointsPerCycle(type, level) {
          if (!level || level < 4) return 0;

          if (type === "CHICKEN") return level === 4 ? 1 : 3;
          if (type === "SHEEP") return level === 4 ? 3 : 8;
          if (type === "COW") return level === 4 ? 8 : 20;

          return 0;
        }

        function pointsText(type, level) {
          const points = pointsPerCycle(type, level);
          return points > 0 ? `+${points} / цикл` : "з LVL 4";
        }

        function cycleSeconds(type) {
          if (type === "CHICKEN") return 20;
          if (type === "SHEEP") return 45;
          if (type === "COW") return 90;
          return 1;
        }

        function productionText(type, level) {
          const perCycle = productionPerCycle(type, level);
          return perCycle > 0 ? `${perCycle} / цикл` : "-";
        }

        function productionPerHour(type, level, count) {
          if (!level || !count) return 0;

          const perCycle = productionPerCycle(type, level);
          const perHourOne = (3600 / cycleSeconds(type)) * perCycle;
          return Math.floor(perHourOne * count);
        }

        function healButton(type, count, price) {
          if (!count || count <= 0) {
            return `<button class="buy-btn gold" disabled>Немає тварин</button>`;
          }

          return `<button class="buy-btn gold" data-heal="${type}">❤️ Лікувати (${count * price} coins)</button>`;
        }

        modalBody.innerHTML = `
                            <div class="modal-grid">
                              <div class="tile">
                                <div class="tile-title">🐔 Курки</div>
                                <div class="tile-value">${animals.chicken ?? 0}</div>
                                <div class="tile-row"><span>LVL</span><span>${animals.chickenLevel ?? 0}</span></div>
                                <div class="tile-row"><span>❤️ Життя</span><span>${animals.chickenLife ?? 100}%</span></div>
                                <div class="tile-row"><span>⚡ Ефективність</span><span>${animals.chickenEfficiency ?? 100}%</span></div>
                                <div class="tile-row"><span>Продуктивність</span><span>${productionText("CHICKEN", animals.chickenLevel ?? 0)}</span></div>
                                <div class="tile-row"><span>⭐ Points</span><span>${pointsText("CHICKEN", animals.chickenLevel ?? 0)}</span></div>
                                <div class="tile-row"><span>За годину</span><span>${productionPerHour("CHICKEN", animals.chickenLevel ?? 0, animals.chicken ?? 0)}</span></div>
                                <div class="tile-row"><span>Готово</span><span>${ready.eggsReady ?? 0}</span></div>
                                ${animalFeedWarning(feed.chicken ?? 0)}
                                ${healButton("CHICKEN", animals.chicken ?? 0, 50)}
                              </div>

                              <div class="tile">
                                <div class="tile-title">🐑 Вівці</div>
                                <div class="tile-value">${animals.sheep ?? 0}</div>
                                <div class="tile-row"><span>LVL</span><span>${animals.sheepLevel ?? 0}</span></div>
                                <div class="tile-row"><span>❤️ Життя</span><span>${animals.sheepLife ?? 100}%</span></div>
                                <div class="tile-row"><span>⚡ Ефективність</span><span>${animals.sheepEfficiency ?? 100}%</span></div>
                                <div class="tile-row"><span>Продуктивність</span><span>${productionText("SHEEP", animals.sheepLevel ?? 0)}</span></div>
                                <div class="tile-row"><span>⭐ Points</span><span>${pointsText("SHEEP", animals.sheepLevel ?? 0)}</span></div>
                                <div class="tile-row"><span>За годину</span><span>${productionPerHour("SHEEP", animals.sheepLevel ?? 0, animals.sheep ?? 0)}</span></div>
                                <div class="tile-row"><span>Готово</span><span>${ready.woolReady ?? 0}</span></div>
                                ${animalFeedWarning(feed.sheep ?? 0)}
                                ${healButton("SHEEP", animals.sheep ?? 0, 150)}
                              </div>

                              <div class="tile">
                                <div class="tile-title">🐄 Корови</div>

      async function openQuestsModal(activeGroup = "daily") {
        modalTitle.textContent = "📜 Квести";
        modalTabs.style.display = "none";

        const res = await apiGet("/quests");
        const quests = res.data?.quests || [];

        function detectGroup(q) {
          const raw = (q.group || q.type || q.category || q.section || "")
            .toString()
            .toLowerCase();

          if (raw.includes("daily")) return "daily";
          if (raw.includes("progress")) return "progress";
          if (raw.includes("achievement")) return "achievement";

          return "progress";
        }

        const grouped = { daily: [], progress: [], achievement: [] };

        quests.forEach((q) => {
          grouped[detectGroup(q)].push(q);
        });

        function renderQuestCard(q) {
          const progress =
            typeof q.progress === "number" && typeof q.target === "number"
              ? `<div class="tile-row"><span>Прогрес</span><span>${q.progress} / ${q.target}</span></div>`
              : "";

          return `
            <div class="tile">
              <div class="tile-title">${q.title}</div>
              <div class="tile-value">${q.done ? "Готово" : "Не готово"}</div>
              ${progress}
              <div class="tile-row"><span>Нагорода</span><span>${q.reward}</span></div>
              <button class="buy-btn ${q.claimed ? "green" : ""}" data-quest="${q.code}" ${q.claimed ? "disabled" : ""}>
                ${q.claimed ? "Забрано" : "Забрати"}
              </button>
            </div>
          `;
        }

        function renderGroup(groupKey) {
          const items = grouped[groupKey] || [];
          if (!items.length) {
            return `<div class="tile full"><div class="note">Тут поки немає квестів</div></div>`;
          }
          return items.map(renderQuestCard).join("");
        }

        modalBody.innerHTML = `
          <div class="quest-tabs">
            <button class="quest-tab-btn ${activeGroup === "daily" ? "active" : ""}" data-qtab="daily">Щоденні</button>

              <div class="tile full">
                <div class="tile-title">👥 Referrals</div>
                <div class="tile-value">Invited: ${invited}</div>
                <div class="tile-row"><span>New player</span><span>+1000 coins / +10 💎</span></div>
                <div class="tile-row"><span>You get</span><span>+500 coins</span></div>
                <div class="tile-row"><span>You get</span><span>+5000 points</span></div>
                <div class="tile-row"><span>You get</span><span>+5 💎</span></div>
              </div>

              <div class="tile full">
                <div class="tile-title">Referral link</div>
                <div class="code-box" style="word-break:break-all">${refLink}</div>
                <button class="buy-btn green" id="profileCopyRefBtn">Copy link</button>
              </div>

              <div class="tile full">
                <div class="tile-title">🎁 Milestones</div>
                <div class="tile-row"><span>1 referral</span><span>+5 💎</span></div>
                <div class="tile-row"><span>5 referrals</span><span>+25 💎</span></div>
                <div class="tile-row"><span>10 referrals</span><span>VIP 24h</span></div>
                <div class="tile-row"><span>25 referrals</span><span>+100 💎</span></div>
                <div class="tile-row"><span>50 referrals</span><span>VIP 7d</span></div>
              </div>

              <div class="tile full">
                <button class="buy-btn" id="profileOpenRefsBtn">Open referrals</button>
                <button class="buy-btn gold" id="profileOpenTopBtn">Leaderboard</button>
              </div>
            </div>
          `;

          showModal();

          const copyBtn = document.getElementById("profileCopyRefBtn");
          if (copyBtn) {
            copyBtn.onclick = async function () {
              try {
                await navigator.clipboard.writeText(refLink);
                showToast("Referral link copied");
              } catch {
                showToast(refLink);
              }
            };
          }

          const refsBtn = document.getElementById("profileOpenRefsBtn");
          if (refsBtn && typeof openRefsModal === "function") {
            refsBtn.onclick = openRefsModal;
          }

          const topBtn = document.getElementById("profileOpenTopBtn");
          if (topBtn && typeof openLeaderboardModal === "function") {
            topBtn.onclick = function () {
              openLeaderboardModal("referrals");
            };
          }
        }

        function openFeedModalFix() {
          if (typeof openFeedModal === "function") {
            openFeedModal();
            return;
          }

          modalTitle.textContent = "🌾 Корм";
          modalTabs.style.display = "none";
          modalBody.innerHTML = `
            <div class="modal-grid">
              <div class="tile full">
                <div class="tile-title">🌾 Feed</div>
                <div class="tile-value">Feed modal not found</div>
              </div>
            </div>
          `;
          showModal();
        }

        window.openProfileModal = openProfileModalFix;

        function bindButtonFixes() {
          const feed = document.getElementById("feedSideBtn");
          if (feed) feed.onclick = openFeedModalFix;

          const feedOld = document.getElementById("feedBtnOld");
          if (feedOld) feedOld.onclick = openFeedModalFix;

          const feedHidden = document.getElementById("feedBtn");
          if (feedHidden) feedHidden.onclick = openFeedModalFix;

          const profile = document.getElementById("profileBtn");
          if (profile) profile.onclick = openProfileModalFix;

          const closeBtn = document.getElementById("closeModalBtn");
          if (closeBtn) closeBtn.onclick = closeGameModalFix;

          const modalEl = document.getElementById("modal");
          if (modalEl && !modalEl.dataset.finalCloseFix) {
            modalEl.dataset.finalCloseFix = "1";
            modalEl.addEventListener("click", function (e) {
              if (e.target === modalEl) closeGameModalFix();
            });
          }
        }

        document.addEventListener(
          "click",
          function (e) {
            const target = e.target.closest?.("button");
            if (!target) return;

            if (
              target.id === "feedSideBtn" ||
              target.id === "feedBtnOld" ||
              target.id === "feedBtn"
            ) {
              e.preventDefault();
              e.stopImmediatePropagation();
              openFeedModalFix();
              return;
            }

            if (target.id === "profileBtn") {
              e.preventDefault();
              e.stopImmediatePropagation();
              openProfileModalFix();
              return;
            }

            if (target.id === "closeModalBtn") {
              e.preventDefault();
              e.stopImmediatePropagation();
              closeGameModalFix();
              return;
            }
          },
          true,
        );

        window.addEventListener("load", bindButtonFixes);
        setTimeout(bindButtonFixes, 100);
        setTimeout(bindButtonFixes, 700);
        setTimeout(bindButtonFixes, 1600);
      })();
    </script>
  </body>
</html>
