<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>My Farm Clicker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        color: #e5e7eb;
        touch-action: manipulation;
        overscroll-behavior: none;
        background:
          radial-gradient(
            circle at top,
            rgba(59, 130, 246, 0.18),
            transparent 30%
          ),
          linear-gradient(180deg, #0b1220 0%, #111827 45%, #0f172a 100%);
      }
      .app {
        max-width: 480px;
        margin: 0 auto;
        min-height: 100vh;
        padding: 16px 14px 28px;
      }
      .card {
        background: rgba(17, 24, 39, 0.88);
        border: 1px solid rgba(59, 130, 246, 0.18);
        border-radius: 24px;
        padding: 16px;
        margin-bottom: 16px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.25);
        backdrop-filter: blur(8px);
      }
      .top-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
      }
      .title {
        font-size: 28px;
        font-weight: 800;
        color: #f8fafc;
        line-height: 1.1;
      }
      .subtitle {
        margin-top: 6px;
        color: #94a3b8;
        font-size: 13px;
      }
      .level-badge {
        min-width: 90px;
        text-align: center;
        padding: 14px 12px;
        border-radius: 18px;
        font-size: 16px;
        font-weight: 800;
        color: #fff;
        background: linear-gradient(135deg, #2563eb, #60a5fa);
        box-shadow: 0 10px 24px rgba(37, 99, 235, 0.28);
      }
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }
      .stat-box {
        background: rgba(30, 41, 59, 0.85);
        border: 1px solid rgba(148, 163, 184, 0.14);
        border-radius: 18px;
        padding: 12px 8px;
        text-align: center;
      }
      .stat-label {
        color: #94a3b8;
        font-size: 11px;
        margin-bottom: 8px;
      }
      .stat-value {
        color: #f8fafc;
        font-size: 18px;
        font-weight: 800;
      }
      .section-title {
        font-size: 18px;
        font-weight: 800;
        color: #f8fafc;
        margin-bottom: 12px;
      }
      .status-line {
        margin-top: 12px;
        text-align: center;
        color: #cbd5e1;
        font-size: 14px;
        font-weight: 700;
        line-height: 1.5;
      }
      .tap-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 10px 0 2px;
      }
      .tap-btn {
        width: 200px;
        height: 200px;
        border: none;
        border-radius: 50%;
        cursor: pointer;
        color: #fff;
        font-size: 34px;
        font-weight: 900;
        letter-spacing: 1px;
        background: radial-gradient(
          circle at 30% 20%,
          #93c5fd,
          #3b82f6 55%,
          #1d4ed8 100%
        );
        box-shadow:
          0 20px 50px rgba(37, 99, 235, 0.34),
          inset 0 8px 18px rgba(255, 255, 255, 0.22);
        transition: transform 0.08s ease;
      }
      .tap-btn:active {
        transform: scale(0.96);
      }
      .tap-hint {
        margin-top: 18px;
        text-align: center;
        color: #94a3b8;
        font-size: 14px;
      }
      .menu-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }
      .menu-btn {
        background: rgba(30, 41, 59, 0.85);
        border: 1px solid rgba(148, 163, 184, 0.14);
        border-radius: 22px;
        min-height: 98px;
        padding: 12px 8px;
        cursor: pointer;
        color: #f8fafc;
        font-size: 13px;
        font-weight: 800;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .menu-emoji {
        font-size: 30px;
        line-height: 1;
      }
      .main-btn {
        width: 100%;
        border: none;
        border-radius: 18px;
        padding: 16px;
        margin-top: 12px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 800;
        color: white;
        background: linear-gradient(135deg, #2563eb, #60a5fa);
        box-shadow: 0 12px 28px rgba(37, 99, 235, 0.25);
      }
      .floating {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: 240px;
        z-index: 999;
        pointer-events: none;
        font-size: 24px;
        font-weight: 900;
        color: #93c5fd;
        text-shadow: 0 2px 14px rgba(59, 130, 246, 0.5);
        animation: floatUp 0.9s ease forwards;
      }
      @keyframes floatUp {
        0% {
          opacity: 1;
          transform: translateX(-50%) translateY(0) scale(0.95);
        }
        100% {
          opacity: 0;
          transform: translateX(-50%) translateY(-70px) scale(1.12);
        }
      }
      .modal {
        position: fixed;
        inset: 0;
        background: rgba(2, 6, 23, 0.78);
        display: none;
        align-items: flex-end;
        justify-content: center;
        z-index: 1000;
      }
      .modal.show {
        display: flex;
      }
      .modal-sheet {
        width: 100%;
        max-width: 480px;
        background: #0f172a;
        border-top-left-radius: 24px;
        border-top-right-radius: 24px;
        border: 1px solid rgba(59, 130, 246, 0.16);
        padding: 16px;
        max-height: 86vh;
        overflow: auto;
      }
      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
      }
      .modal-title {
        font-size: 20px;
        font-weight: 800;
        color: #f8fafc;
      }
      .close-btn {
        width: 40px;
        height: 40px;
        border-radius: 14px;
        border: none;
        background: rgba(30, 41, 59, 0.9);
        color: #f8fafc;
        font-size: 18px;
        cursor: pointer;
      }
      .tabs {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 10px;
        margin-bottom: 14px;
      }
      .tab-btn {
        border: none;
        border-radius: 16px;
        padding: 12px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 800;
        color: #e2e8f0;
        background: rgba(30, 41, 59, 0.9);
      }
      .tab-btn.active {
        color: #fff;
        background: linear-gradient(135deg, #2563eb, #60a5fa);
      }
      .modal-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .tile {
        background: rgba(30, 41, 59, 0.92);
        border: 1px solid rgba(148, 163, 184, 0.14);
        border-radius: 18px;
        padding: 14px;
      }
      .tile-title {
        color: #94a3b8;
        font-size: 13px;
        margin-bottom: 8px;
      }
      .tile-value {
        color: #f8fafc;
        font-size: 18px;
        font-weight: 800;
      }
      .tile-row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-top: 10px;
        color: #cbd5e1;
        font-size: 13px;
      }
      .buy-btn {
        width: 100%;
        border: none;
        border-radius: 14px;
        padding: 12px;
        margin-top: 12px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 800;
        color: #fff;
        background: linear-gradient(135deg, #2563eb, #60a5fa);
      }
      .buy-btn.green {
        background: linear-gradient(135deg, #15803d, #22c55e);
      }
      .buy-btn.gold {
        background: linear-gradient(135deg, #b45309, #f59e0b);
      }
      .note {
        color: #94a3b8;
        font-size: 13px;
        line-height: 1.45;
      }
      .warn {
        color: #fca5a5;
        font-size: 13px;
        line-height: 1.45;
        margin-top: 8px;
        font-weight: 700;
      }
      .wheel-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .wheel-disc {
        width: 220px;
        height: 220px;
        border-radius: 50%;
        border: 8px solid #1d4ed8;
        background: conic-gradient(
          #60a5fa 0 60deg,
          #1e40af 60deg 120deg,
          #93c5fd 120deg 180deg,
          #2563eb 180deg 240deg,
          #60a5fa 240deg 300deg,
          #1e40af 300deg 360deg
        );
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
        position: relative;
        transition: transform 3s cubic-bezier(0.18, 0.89, 0.32, 1.08);
      }
      .wheel-center {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: #0f172a;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        border: 4px solid #60a5fa;
      }
      .wheel-pointer {
        width: 0;
        height: 0;
        border-left: 14px solid transparent;
        border-right: 14px solid transparent;
        border-top: 22px solid #f8fafc;
        margin-bottom: -8px;
      }
      .share-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        align-items: center;
      }
      .code-box,
      .input-box {
        width: 100%;
        padding: 12px;
        border-radius: 12px;
        border: none;
        background: #1e293b;
        color: #fff;
        font-size: 14px;
      }
      .full {
        grid-column: 1 / -1;
      }
      #resultBox {
        display: none;
      }
      .daily-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin-bottom: 15px;
      }

      .daily-item {
        background: #1e293b;
        border-radius: 12px;
        padding: 10px;
        text-align: center;
        font-size: 12px;
      }

      .daily-item.active {
        border: 2px solid #3b82f6;
      }

      .daily-item.done {
        opacity: 0.5;
      }

      .daily-item .day {
        font-weight: 700;
        margin-bottom: 5px;
      }

      .daily-item .reward {
        font-size: 11px;
      }
      .quest-tabs {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-bottom: 14px;
      }

      .quest-tab-btn {
        border: none;
        border-radius: 14px;
        padding: 12px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 800;
        color: #e2e8f0;
        background: rgba(30, 41, 59, 0.9);
      }

      .quest-tab-btn.active {
        color: #fff;
        background: linear-gradient(135deg, #2563eb, #60a5fa);
      }

      .chance-green {
        color: #22c55e;
        font-weight: 900;
      }

      .chance-gold {
        color: #facc15;
        font-weight: 900;
      }

      .chance-danger {
        color: #f87171;
        font-weight: 900;
      }

      .unlock-progress {
        color: #93c5fd;
        font-weight: 800;
      }

      .levelup-modal {
        position: fixed;
        inset: 0;
        background: rgba(2, 6, 23, 0.82);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 2000;
        padding: 20px;
      }

      .levelup-modal.show {
        display: flex;
      }

      .levelup-card {
        width: 100%;
        max-width: 360px;
        background: linear-gradient(180deg, #111827, #0f172a);
        border: 1px solid rgba(250, 204, 21, 0.35);
        border-radius: 28px;
        padding: 24px;
        text-align: center;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
        animation: levelPop 0.25s ease-out;
      }

      @keyframes levelPop {
        from {
          transform: scale(0.86);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }

      .levelup-title {
        font-size: 28px;
        font-weight: 900;
        color: #facc15;
        margin-bottom: 8px;
      }

      .levelup-level {
        font-size: 38px;
        font-weight: 900;
        color: #f8fafc;
        margin-bottom: 16px;
      }

      .levelup-reward {
        background: rgba(30, 41, 59, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.16);
        border-radius: 18px;
        padding: 14px;
        margin: 10px 0;
        font-size: 18px;
        font-weight: 800;
        color: #e5e7eb;
      }

      .levelup-note {
        color: #94a3b8;
        font-size: 13px;
        margin-top: 10px;
        line-height: 1.4;
      }

      /* PREMIUM FARM DESIGN OVER OLD WORKING LOGIC */
      body {
        background: #06111f !important;
      }
      .app {
        max-width: 480px !important;
        margin: 0 auto !important;
        min-height: 100vh !important;
        padding: 8px 6px 18px !important;
      }
      .premium-game {
        position: relative;
        min-height: calc(100vh - 20px);
        overflow: hidden;
        border-radius: 28px;
        background: #06111f;
        border: 1px solid rgba(125, 211, 252, 0.28);
        box-shadow:
          0 22px 60px rgba(0, 0, 0, 0.5),
          inset 0 2px 0 rgba(255, 255, 255, 0.08);
      }
      .premium-game::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 2;
        background: linear-gradient(
          180deg,
          rgba(4, 12, 24, 0.58),
          transparent 20%,
          transparent 74%,
          rgba(4, 12, 24, 0.88)
        );
      }
      .premium-bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 1;
      }
      .premium-top {
        position: relative;
        z-index: 10;
        display: grid;
        grid-template-columns: 1.2fr 1fr 1fr 1fr;
        gap: 8px;
        padding: 10px;
        background: linear-gradient(
          180deg,
          rgba(6, 18, 34, 0.96),
          rgba(3, 10, 20, 0.96)
        );
        border-bottom: 1px solid rgba(125, 211, 252, 0.18);
        box-shadow:
          0 14px 32px rgba(0, 0, 0, 0.38),
          inset 0 2px 0 rgba(255, 255, 255, 0.08);
      }
      .player-box {
        display: grid;
        grid-template-columns: 52px 1fr;
        gap: 8px;
        align-items: center;
        min-width: 0;
      }
      .avatar {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 30px;
        background: linear-gradient(135deg, #0ea5ff, #1764ff);
        border: 2px solid rgba(255, 255, 255, 0.24);
        box-shadow: 0 8px 18px rgba(14, 165, 255, 0.3);
      }
      .player-name {
        font-size: 17px;
        font-weight: 1000;
        color: #fff;
        line-height: 1;
      }
      .player-lvl {
        color: #b8cbe3;
        font-size: 11px;
        font-weight: 900;
        margin-top: 5px;
      }
      .xp-line {
        height: 10px;
        margin-top: 5px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.55);
        overflow: hidden;
      }
      .xp-line span {
        display: block;
        height: 100%;
        width: 30%;
        border-radius: inherit;
        background: linear-gradient(90deg, #43e329, #a3e635, #facc15);
        box-shadow: 0 0 16px rgba(163, 230, 53, 0.55);
      }
      .resource-box {
        min-width: 0;
        display: grid;
        grid-template-columns: 42px 1fr;
        gap: 8px;
        align-items: center;
        padding: 9px;
        border-radius: 16px;
        background: linear-gradient(
          180deg,
          rgba(14, 35, 59, 0.94),
          rgba(4, 13, 25, 0.94)
        );
        border: 1px solid rgba(125, 211, 252, 0.18);
      }
      .resource-icon {
        font-size: 30px;
      }
      .resource-value {
        color: #fff;
        font-size: 19px;
        font-weight: 1000;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .resource-sub {
        color: #b8cbe3;
        font-size: 11px;
        font-weight: 900;
      }
      .hidden-old-stats {
        position: absolute;
        left: -9999px;
        width: 1px;
        height: 1px;
        overflow: hidden;
      }
      .warehouse-panel {
        position: relative;
        z-index: 10;
        width: calc(100% - 20px);
        margin: 8px 10px 0;
        display: grid;
        grid-template-columns: 78px 1fr 112px;
        gap: 10px;
        align-items: center;
        padding: 10px;
        border-radius: 20px;
        border: 1px solid rgba(125, 211, 252, 0.28);
        background: linear-gradient(
          180deg,
          rgba(13, 81, 159, 0.9),
          rgba(5, 27, 62, 0.95)
        );
        color: white;
        text-align: left;
        cursor: pointer;
        box-shadow:
          0 12px 26px rgba(0, 0, 0, 0.28),
          inset 0 2px 0 rgba(255, 255, 255, 0.08);
      }
      .warehouse-icon {
        font-size: 48px;
      }
      .warehouse-title {
        font-size: 17px;
        font-weight: 1000;
      }
      .warehouse-bar {
        height: 18px;
        margin-top: 8px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.62);
        overflow: hidden;
      }
      .warehouse-bar span {
        display: block;
        height: 100%;
        width: 0%;
        border-radius: inherit;
        background: linear-gradient(90deg, #22c55e, #facc15, #ff9f0a);
        box-shadow: 0 0 16px rgba(250, 204, 21, 0.42);
      }
      .warehouse-cap {
        color: #dbeafe;
        text-align: center;
        margin-top: 5px;
        font-size: 12px;
        font-weight: 900;
      }
      .warehouse-upgrade {
        text-align: center;
        border-radius: 16px;
        padding: 12px 8px;
        color: #fff;
        background: linear-gradient(180deg, #7cff32, #129909);
        font-weight: 1000;
        box-shadow:
          0 0 22px rgba(34, 197, 94, 0.42),
          inset 0 2px 0 rgba(255, 255, 255, 0.25);
      }
      .premium-status {
        position: relative;
        z-index: 10;
        margin: 8px 10px 0;
        text-align: center;
        padding: 8px;
        border-radius: 999px;
        background: rgba(2, 8, 18, 0.58);
        border: 1px solid rgba(125, 211, 252, 0.16);
        font-weight: 1000;
        color: #e5e7eb;
      }
      .side-btn {
        position: absolute;
        z-index: 11;
        width: 64px;
        min-height: 70px;
        border: none;
        border-radius: 14px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        color: #fff;
        font-weight: 1000;
        background: linear-gradient(
          180deg,
          rgba(20, 45, 72, 0.96),
          rgba(4, 13, 25, 0.96)
        );
        border: 1px solid rgba(125, 211, 252, 0.28);
        box-shadow:
          0 10px 22px rgba(0, 0, 0, 0.34),
          inset 0 2px 0 rgba(255, 255, 255, 0.1);
      }
      .side-btn span {
        font-size: 31px;
        line-height: 1;
      }
      .side-btn strong {
        font-size: 12px;
      }
      .notify {
        position: absolute;
        top: -9px;
        right: -9px;
        min-width: 25px;
        height: 25px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #ef2323;
        color: #fff;
        font-size: 13px;
        border: 2px solid rgba(255, 255, 255, 0.28);
      }
      .daily {
        top: 220px;
        left: 10px;
      }
      .tasks {
        top: 300px;
        left: 10px;
      }
      .refs {
        top: 380px;
        left: 10px;
      }
      .vip {
        top: 220px;
        right: 10px;
      }
      .boosts {
        top: 300px;
        right: 10px;
      }
      .wallet {
        top: 380px;
        right: 10px;
      }
      .tap-float-label {
        position: absolute;
        z-index: 12;
        left: 50%;
        bottom: 132px;
        transform: translateX(-50%);
        padding: 7px 16px;
        border-radius: 999px;
        background: rgba(2, 8, 18, 0.55);
        color: #fff;
        font-weight: 900;
        font-size: 13px;
      }
      .bottom-nav {
        position: absolute;
        z-index: 40;
        left: 12px;
        right: 12px;
        bottom: 12px;
        height: 88px;
        display: grid;
        grid-template-columns: 1fr 1fr 92px 1fr 1fr;
        gap: 7px;
        align-items: end;
        padding: 7px;
        border-radius: 24px;
        background: rgba(4, 12, 24, 0.88);
        border: 1px solid rgba(125, 211, 252, 0.22);
        box-shadow: 0 -12px 32px rgba(0, 0, 0, 0.42);
        overflow: visible;
      }
      .nav-btn,
      .premium-tap {
        border: none;
        color: #fff;
        font-weight: 1000;
        border-radius: 17px;
        background: linear-gradient(
          180deg,
          rgba(20, 45, 72, 0.96),
          rgba(4, 13, 25, 0.96)
        );
        border: 1px solid rgba(125, 211, 252, 0.18);
      }
      .nav-btn {
        height: 68px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .nav-btn.active {
        background: linear-gradient(135deg, #0ea5ff, #1764ff);
        box-shadow:
          0 0 22px rgba(14, 165, 255, 0.38),

    <script>
      const tg = window.Telegram?.WebApp;
      const API = "https://tg-farm-api.onrender.com/api";
      const BOT_USERNAME = "my_farm_clicker_bot";

      let tonConnectUI = null;

      function getTonConnectUI() {
        if (!window.TON_CONNECT_UI?.TonConnectUI) {
          throw new Error("TON Connect UI not loaded");
        }

        if (!tonConnectUI) {
          tonConnectUI = new window.TON_CONNECT_UI.TonConnectUI({
            manifestUrl: `${window.location.origin}/tonconnect-manifest.json`,
          });
        }

        return tonConnectUI;
      }

      if (tg) {
        tg.ready();
        tg.expand();
      }
      const initData = tg?.initData ?? "";
      function getMyTelegramId() {
        return currentState?.telegramId || tg?.initDataUnsafe?.user?.id || "";
      }

      function makeReferralLink() {
        const myTelegramId = getMyTelegramId();

        if (!myTelegramId) {
          return `https://t.me/${BOT_USERNAME}`;
        }

        return `https://t.me/${BOT_USERNAME}?start=ref_${myTelegramId}`;
      }
      const modal = document.getElementById("modal"),
        modalTitle = document.getElementById("modalTitle"),
        modalBody = document.getElementById("modalBody"),
        modalTabs = document.getElementById("modalTabs"),
        tabBuyBtn = document.getElementById("tabBuyBtn"),
        tabOwnedBtn = document.getElementById("tabOwnedBtn"),
        tabUpgradeBtn = document.getElementById("tabUpgradeBtn"),
        resultBox = document.getElementById("resultBox"),
        statusEl = document.getElementById("status"),
        coinsEl = document.getElementById("coins"),
        diamondsEl = document.getElementById("diamonds"),
        pointsEl = document.getElementById("points"),
        xpEl = document.getElementById("xp"),
        levelBadgeEl = document.getElementById("levelBadge"),
        boostStatusEl = document.getElementById("boostStatus"),
        levelUpModal = document.getElementById("levelUpModal"),
        levelUpText = document.getElementById("levelUpText"),
        levelUpCoins = document.getElementById("levelUpCoins"),
        levelUpDiamonds = document.getElementById("levelUpDiamonds"),
        levelUpCloseBtn = document.getElementById("levelUpCloseBtn");
      let currentState = null;
      let lastKnownLevel = null;
      let wheelRotation = 0;
      function setStatus(t) {
        statusEl.textContent = t;
      }
      function setResult(d) {
        resultBox.textContent =
          typeof d === "string" ? d : JSON.stringify(d, null, 2);
      }
      async function apiGet(path) {
        const res = await fetch(`${API}${path}`, {
          method: "GET",
          headers: { "x-telegram-init-data": initData },
        });
        const text = await res.text();
        let json;
        try {
          json = JSON.parse(text);
        } catch {
          json = text;
        }
        return { ok: res.ok, data: json };
      }
      async function apiPost(path, body = {}) {
        const res = await fetch(`${API}${path}`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-telegram-init-data": initData,
          },
          body: JSON.stringify(body),
        });
        const text = await res.text();
        let json;
        try {
          json = JSON.parse(text);
        } catch {
          json = text;
        }
        return { ok: res.ok, data: json };
      }
      function spawnFloatingText(text) {
        const el = document.createElement("div");
        el.className = "floating";
        el.textContent = text;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 900);
      }
      function showToast(text) {
        spawnFloatingText(text);
      }

      function showLevelUpPopup(xpData) {
        if (!xpData || !levelUpModal) return;

        levelUpText.textContent = `LVL ${xpData.level ?? currentState?.level ?? 1}`;
        levelUpCoins.textContent = `+${xpData.rewardCoins ?? 0} coins`;
        levelUpDiamonds.textContent = `+${xpData.rewardDiamonds ?? 0} diamonds`;

        levelUpModal.classList.add("show");
      }

      function handleXpResult(xpData) {
        if (xpData?.leveledUp) {
          showLevelUpPopup(xpData);

          if (xpData.level) {
            lastKnownLevel = xpData.level;
          }

          return true;
        }

        return false;
      }

      if (levelUpCloseBtn) {
        levelUpCloseBtn.addEventListener("click", () => {
          levelUpModal.classList.remove("show");
        });
      }

      function applyState(data) {
        const newLevel = data?.level ?? 1;

        if (
          lastKnownLevel !== null &&
          newLevel > lastKnownLevel &&
          levelUpModal &&
          data?.lastLevelRewardCoins > 0
        ) {
          showLevelUpPopup({
            level: newLevel,
            rewardCoins: data?.lastLevelRewardCoins ?? 0,
            rewardDiamonds: data?.lastLevelRewardDiamonds ?? 0,
          });
        }

        lastKnownLevel = newLevel;
        currentState = data;

        coinsEl.textContent = data?.coins ?? 0;
        diamondsEl.textContent = data?.diamonds ?? 0;
        pointsEl.textContent = data?.points ?? 0;
        xpEl.textContent = `${data?.xp ?? 0}/${data?.xpNeeded ?? 0}`;
        levelBadgeEl.textContent = `LVL ${newLevel}`;
        const boost = data?.boost?.active ? "ON" : "OFF";
        const auto = data?.autoCollect?.active ? "ON" : "OFF";
        const vip = data?.vip?.active ? "ON" : "OFF";
        boostStatusEl.innerText = `⚡ ${boost} | 🤖 ${auto} | 👑 ${vip}`;
      }
      async function loadState() {
        try {
          setStatus("loading...");
          const res = await apiGet("/state");
          setResult(res.data);
          if (res.ok) {
            applyState(res.data);
            setStatus("ok");
          } else {
            setStatus("error");
          }
        } catch (e) {
          setStatus("error");
          setResult(String(e));
        }
      }
      async function collect() {
        try {
          setStatus("collect...");
          const res = await apiPost("/collect");
          setResult(res.data);
          if (res.ok) {
            if (!handleXpResult(res.data?.levelUpData)) {
              showToast(`+${res.data?.added ?? 1}`);
            }

            await loadState();
            setStatus("ok");
          } else {
            setStatus("error");
          }
        } catch (e) {
          setStatus("error");
          setResult(String(e));
        }
      }
      function showModal() {
        modal.classList.add("show");
      }
      function closeModal() {
        modal.classList.remove("show");
      }
      modal.addEventListener("click", (e) => {
        if (e.target === modal) closeModal();
      });
      async function buyAnimal(type) {
        const res = await apiPost("/buy-animal", { type });
        setResult(res.data);
        if (res.ok) {
          if (!handleXpResult(res.data?.levelUpData)) {
            showToast("Куплено");
          }

          await loadState();
          renderAnimalsOwned();
        } else {
          showToast(res.data?.error || "Помилка");
        }
      }

      async function healAnimals(type) {
        const res = await apiPost("/heal", { type });
        setResult(res.data);

        if (res.ok) {
          const coins = res.data?.costCoins ?? 0;
          const points = res.data?.costPoints ?? 0;

          if (coins > 0 && points > 0) {
            showToast(`❤️ Лікування: -${coins} coins / -${points} points`);
          } else if (points > 0) {
            showToast(`❤️ Лікування: -${points} points`);
          } else if (coins > 0) {
            showToast(`❤️ Лікування: -${coins} coins`);
          } else {
            showToast("❤️ Лікування виконано");
          }

          await loadState();
          renderAnimalsOwned();
        } else {
          showToast(res.data?.error || "Помилка лікування");
        }
      }

      function renderAnimalsBuy() {
        tabBuyBtn.classList.add("active");
        tabOwnedBtn.classList.remove("active");
        tabUpgradeBtn.classList.remove("active");

        const level = currentState?.level ?? 1;

        function animalBuyCard(params) {
          const { emoji, title, price, resource, type, unlockLevel } = params;
          const unlocked = level >= unlockLevel;

          return `
                              <div class="tile">
                                <div class="tile-title">${emoji} ${title}</div>
                                <div class="tile-value">${unlocked ? `${price} coins` : `🔒 LVL ${unlockLevel}`}</div>
                                <div class="tile-row"><span>Ресурс</span><span>${resource}</span></div>
                                <div class="tile-row">
                                  <span>Прогрес</span>
                                  <span class="unlock-progress">${Math.min(level, unlockLevel)} / ${unlockLevel}</span>
                                </div>
                                <div class="tile-row"><span>Відкривається</span><span>LVL ${unlockLevel}</span></div>
                                ${
                                  unlocked
                                    ? `<button class="buy-btn" data-animal="${type}">Купити</button>`
                                    : `<button class="buy-btn gold" disabled>Потрібен LVL ${unlockLevel}</button>`
                                }
                              </div>
                            `;
        }

        modalBody.innerHTML = `
                            <div class="modal-grid">
                              ${animalBuyCard({
                                emoji: "🐔",
                                title: "Курка",
                                price: 100,
                                resource: "Яйця",
                                type: "CHICKEN",
                                unlockLevel: 1,
                              })}
                              ${animalBuyCard({
                                emoji: "🐑",
                                title: "Вівця",
                                price: 500,
                                resource: "Шерсть",
                                type: "SHEEP",
                                unlockLevel: 5,
                              })}
                              ${animalBuyCard({
                                emoji: "🐄",
                                title: "Корова",
                                price: 1000,
                                resource: "Молоко",
                                type: "COW",
                                unlockLevel: 10,
                              })}
                            </div>
                          `;

        modalBody.querySelectorAll("[data-animal]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            await buyAnimal(btn.getAttribute("data-animal"));
          });
        });
      }
      function animalFeedWarning(v) {
        return v > 0

      function getAnimalUpgradeCostPreview(type, level, rarity) {
        const costs = {
          CHICKEN: {
            1: { coins: 3000, diamonds: 0 },
            2: { coins: 12000, diamonds: 0 },
            3: { coins: 50000, diamonds: 3 },
            4: { coins: 180000, diamonds: 12 },
          },
          SHEEP: {
            1: { coins: 12000, diamonds: 0 },
            2: { coins: 50000, diamonds: 3 },
            3: { coins: 180000, diamonds: 12 },
            4: { coins: 600000, diamonds: 35 },
          },
          COW: {
            1: { coins: 50000, diamonds: 3 },
            2: { coins: 180000, diamonds: 12 },
            3: { coins: 600000, diamonds: 35 },
            4: { coins: 1500000, diamonds: 75 },
          },
        };

        const multipliers = {
          normal: 1,
          rare: 1.25,
          epic: 1.6,
          legendary: 2.2,
        };

        const safeLevel = Math.max(1, Math.min(4, Number(level || 1)));
        const base = costs[type]?.[safeLevel];

        if (!base) return null;

        const multiplier =
          multipliers[String(rarity || "normal").toLowerCase()] ?? 1;

        return {
          coins: Math.floor(base.coins * multiplier),
          diamonds: Math.floor(base.diamonds * multiplier),
          multiplier,
        };
      }

      function getAnimalUpgradeChance(level, fails = 0) {
        if (Number(fails || 0) >= 5) return 100;

        const chances = {
          1: 90,
          2: 65,
          3: 45,
          4: 25,
        };

        return chances[Math.max(1, Math.min(4, Number(level || 1)))] ?? 55;
      }

      function canPayUpgrade(cost) {
        if (!cost) return false;
        return (
          Number(currentState?.coins ?? 0) >= Number(cost.coins ?? 0) &&
          Number(currentState?.diamonds ?? 0) >= Number(cost.diamonds ?? 0)
        );
      }

          if (type === "COW") return "Корови";
          return "Тварини";

          if (type === "CHICKEN") return "eggs";
          if (type === "SHEEP") return "wool";

            const healPrices = {

                coins: { 1: 500, 2: 1000, 3: 2000 },

        modalBody.querySelectorAll("[data-unlock-slot]").forEach((btn) => {
          btn.onclick = async () => {
            await unlockAnimalSlot(btn.getAttribute("data-unlock-slot"));
          };
        });

        modalBody.querySelectorAll("[data-buy-from-slot]").forEach((btn) => {
          btn.onclick = async () => {
            await buyAnimal(btn.getAttribute("data-buy-from-slot"));
          };
        });

        modalBody.querySelectorAll("[data-upgrade-modal]").forEach((btn) => {
          btn.onclick = () => {
            const id = Number(btn.getAttribute("data-upgrade-modal"));

              ...(animals.chickenCards || []),
              ...(animals.sheepCards || []),
              ...(animals.cowCards || []),

            const type = (animals.chickenCards || []).some(
              (item) => Number(item.id) === id,

            openAnimalUpgradeModal(card, type);

        modalBody.querySelectorAll("[data-heal-one]").forEach((btn) => {

      function getSellPreviewPoints(type, resources, level) {
        if (!level || level < 4 || !resources) return 0;

        let producedPerCycle = 1;
        let pointsPerCycle = 0;

        if (type === "CHICKEN") {
          producedPerCycle = 1 + (level - 1);
          pointsPerCycle = level >= 5 ? 3 : 2;
        }

        if (type === "SHEEP") {
          producedPerCycle = 3 + (level - 1);
          pointsPerCycle = level >= 5 ? 6 : 4;
        }

        if (type === "COW") {
          producedPerCycle = 7 + (level - 1) * 2;
          pointsPerCycle = level >= 5 ? 10 : 7;
        }

        const cycles = Math.floor(resources / Math.max(1, producedPerCycle));
        return cycles * pointsPerCycle;
      }

      async function openStorageModal() {
        modalTitle.textContent = "📦 Склад";
        modalTabs.style.display = "none";

        const s = currentState?.storage || {};

        const eggs = s.eggs ?? 0;
        const wool = s.wool ?? 0;
        const milk = s.milk ?? 0;
        const capacity = s.capacity ?? 1000;
        const total = s.total ?? eggs + wool + milk;

        const coinsFromEggs = eggs * 6;
        const coinsFromWool = wool * 15;
        const coinsFromMilk = milk * 30;
        const fallbackCoins = coinsFromEggs + coinsFromWool + coinsFromMilk;
        const totalCoins =
          s.sellValue ?? s.sellCoins ?? s.coins ?? fallbackCoins;

        const percent = Math.min(100, Math.floor((total / capacity) * 100));

        let warning = "";
        if (percent >= 95) {
          warning = `<div class="warn">🚨 Склад заповнений! Виробництво майже стоїть</div>`;
        } else if (percent >= 80) {
          warning = `<div class="warn">⚠️ Склад майже повний</div>`;
        }

        modalBody.innerHTML = `
                                        <div class="modal-grid">
                                          <div class="tile full">
                                            <div class="tile-title">📊 Заповнення</div>
                                            <div class="tile-value">${total} / ${capacity}</div>

                                            ${warning}

          setResult(res.data);

          if (res.ok) {
            if (!handleXpResult(res.data?.levelUpData ?? res.data?.xp)) {
              showToast(
                `+${res.data?.earned ?? 0} coins 💰 | +${res.data?.earnedPoints ?? 0} points ⭐`,
              );
            }

      async function openQuestsModal(activeGroup = "daily") {
        modalTitle.textContent = "📜 Квести";
        modalTabs.style.display = "none";

        const res = await apiGet("/quests");
        const quests = res.data?.quests || [];

        function detectGroup(q) {
          const raw = (q.group || q.type || q.category || q.section || "")
            .toString()
            .toLowerCase();

          if (raw.includes("daily")) return "daily";
          if (raw.includes("progress")) return "progress";
          if (raw.includes("achievement")) return "achievement";

          return "progress";
        }

        const grouped = { daily: [], progress: [], achievement: [] };

        quests.forEach((q) => {
          grouped[detectGroup(q)].push(q);
        });

        function renderQuestCard(q) {
          const progress =
            typeof q.progress === "number" && typeof q.target === "number"
              ? `<div class="tile-row"><span>Прогрес</span><span>${q.progress} / ${q.target}</span></div>`
              : "";

          return `
                        <div class="tile">
                          <div class="tile-title">${q.title}</div>
                          <div class="tile-value">${q.done ? "Готово" : "Не готово"}</div>
                          ${progress}
                          <div class="tile-row"><span>Нагорода</span><span>${q.reward}</span></div>
                          <button class="buy-btn ${q.claimed ? "green" : ""}" data-quest="${q.code}" ${q.claimed ? "disabled" : ""}>
                            ${q.claimed ? "Забрано" : "Забрати"}
                          </button>
                        </div>
                      `;
        }

        function renderGroup(groupKey) {
          const items = grouped[groupKey] || [];
          if (!items.length) {
            return `<div class="tile full"><div class="note">Тут поки немає квестів</div></div>`;
          }
          return items.map(renderQuestCard).join("");
        }

        modalBody.innerHTML = `
                      <div class="quest-tabs">
                        <button class="quest-tab-btn ${activeGroup === "daily" ? "active" : ""}" data-qtab="daily">Щоденні</button>
                        <button class="quest-tab-btn ${activeGroup === "progress" ? "active" : ""}" data-qtab="progress">Прогрес</button>
                        <button class="quest-tab-btn ${activeGroup === "achievement" ? "active" : ""}" data-qtab="achievement">Досягнення</button>
                      </div>
                      <div class="modal-grid">
                        ${renderGroup(activeGroup)}
                      </div>
                    `;

        showModal();

        modalBody.querySelectorAll("[data-qtab]").forEach((btn) => {
          btn.onclick = () => openQuestsModal(btn.dataset.qtab);
        });

        modalBody.querySelectorAll("[data-quest]").forEach((btn) => {
          btn.onclick = async () => {
            const code = btn.getAttribute("data-quest");
            const resp = await apiPost("/quests/claim", { code });
            setResult(resp.data);

            if (resp.ok) {
              if (!handleXpResult(resp.data?.xp)) {
                showToast(`+${resp.data?.reward ?? 0}`);
              }

              await loadState();
              await openQuestsModal(activeGroup);
            } else {
              showToast(resp.data?.error || "Помилка");
            }
          };
        });
      }

                    <div class="tile-row"><span>10 referrals</span><span>VIP 24h</span></div>
                    <div class="tile-row"><span>25 referrals</span><span>+100 💎</span></div>
                    <div class="tile-row"><span>50 referrals</span><span>VIP 7d</span></div>
                  </div>

                  <div class="tile full">
                    <button class="buy-btn" id="openRefsFromProfileBtn">Open referrals</button>
                    <button class="buy-btn gold" id="openTopFromProfileBtn">Leaderboard</button>
                  </div>
                </div>
              `;

        showModal();

        const copyBtn = document.getElementById("copyRefFromProfileBtn");
        if (copyBtn) {
          copyBtn.onclick = async () => {
            try {
              await navigator.clipboard.writeText(refLink);
              showToast("Referral link copied");
            } catch {
              showToast(refLink);
            }
          };
        }

        const openRefsBtn = document.getElementById("openRefsFromProfileBtn");
        if (openRefsBtn) openRefsBtn.onclick = openRefsModal;

        const openTopBtn = document.getElementById("openTopFromProfileBtn");
        if (openTopBtn)
          openTopBtn.onclick = () => openLeaderboardModal("referrals");
      };

      /* FEED BUTTON BIND */
      (function () {
        function bindFeedProfileFix() {
          const feed = document.getElementById("feedSideBtn");
          if (feed) {
            feed.onclick = (e) => {
              e.preventDefault();
              e.stopPropagation();
              openFeedModal();
            };
          }

          const profile = document.getElementById("profileBtn");
          if (profile) {
            profile.onclick = (e) => {
              e.preventDefault();
              e.stopPropagation();
              openProfileModal();
            };
          }
        }

        window.addEventListener("load", bindFeedProfileFix);
        setTimeout(bindFeedProfileFix, 300);
        setTimeout(bindFeedProfileFix, 1200);
      })();

      function bindButton(id, handler) {
        const el = document.getElementById(id);
        if (el) el.addEventListener("click", handler);
      }

      bindButton("animalsBtn", openAnimalsModal);
      bindButton("storageBtn", openStorageModal);
      bindButton("feedSideBtn", openFeedModal);
      bindButton("labSideBtn", openLabModal);
      bindButton("dailyBtn", openDailyModal);
      bindButton("questsBtn", openQuestsModal);
      bindButton("boostBtn", openBoostersModal);
      bindButton("walletBtn", openWalletModal);
      bindButton("profileBtn", openProfileModal);
      bindButton("shopBtn", openShopModal);
      bindButton("closeModalBtn", closeModal);
      bindButton("tapBtn", collect);

      bindButton("animalsBtnOld", openAnimalsModal);
      bindButton("storageBtnOld", openStorageModal);
      bindButton("feedBtnOld", openFeedModal);
      bindButton("labBtnOld", openLabModal);
      bindButton("dailyBtnOld", openDailyModal);
      bindButton("questsBtnOld", openQuestsModal);
      bindButton("boostBtnOld", openBoostersModal);
      bindButton("walletBtnOld", openWalletModal);
      bindButton("shopBtnOld", openShopModal);
      bindButton("refsBtnOld", openRefsModal);
      bindButton("wheelBtn", openWheelModal);

      if (tabBuyBtn) tabBuyBtn.addEventListener("click", renderAnimalsBuy);
      if (tabOwnedBtn)
        tabOwnedBtn.addEventListener("click", renderAnimalsOwned);
      if (tabUpgradeBtn)
        tabUpgradeBtn.addEventListener("click", renderAnimalsUpgrade);

      loadState();
    </script>
  </body>
</html>
