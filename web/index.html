<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Farm Clicker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        color: #e5e7eb;
        background:
          radial-gradient(
            circle at top,
            rgba(59, 130, 246, 0.18),
            transparent 30%
          ),
          linear-gradient(180deg, #0b1220 0%, #111827 45%, #0f172a 100%);
      }
      .app {
        max-width: 480px;
        margin: 0 auto;
        min-height: 100vh;
        padding: 16px 14px 28px;
      }
      .card {
        background: rgba(17, 24, 39, 0.88);
        border: 1px solid rgba(59, 130, 246, 0.18);
        border-radius: 24px;
        padding: 16px;
        margin-bottom: 16px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.25);
        backdrop-filter: blur(8px);
      }
      .top-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
      }
      .title {
        font-size: 28px;
        font-weight: 800;
        color: #f8fafc;
        line-height: 1.1;
      }
      .subtitle {
        margin-top: 6px;
        color: #94a3b8;
        font-size: 13px;
      }
      .level-badge {
        min-width: 90px;
        text-align: center;
        padding: 14px 12px;
        border-radius: 18px;
        font-size: 16px;
        font-weight: 800;
        color: #fff;
        background: linear-gradient(135deg, #2563eb, #60a5fa);
        box-shadow: 0 10px 24px rgba(37, 99, 235, 0.28);
      }
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }
      .stat-box {
        background: rgba(30, 41, 59, 0.85);
        border: 1px solid rgba(148, 163, 184, 0.14);
        border-radius: 18px;
        padding: 12px 8px;
        text-align: center;
      }
      .stat-label {
        color: #94a3b8;
        font-size: 11px;
        margin-bottom: 8px;
      }
      .stat-value {
        color: #f8fafc;
        font-size: 18px;
        font-weight: 800;
      }
      .section-title {
        font-size: 18px;
        font-weight: 800;
        color: #f8fafc;
        margin-bottom: 12px;
      }
      .status-line {
        margin-top: 12px;
        text-align: center;
        color: #cbd5e1;
        font-size: 14px;
        font-weight: 700;
        line-height: 1.5;
      }
      .tap-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 10px 0 2px;
      }
      .tap-btn {
        width: 200px;
        height: 200px;
        border: none;
        border-radius: 50%;
        cursor: pointer;
        color: #fff;
        font-size: 34px;
        font-weight: 900;
        letter-spacing: 1px;
        background: radial-gradient(
          circle at 30% 20%,
          #93c5fd,
          #3b82f6 55%,
          #1d4ed8 100%
        );
        box-shadow:
          0 20px 50px rgba(37, 99, 235, 0.34),
          inset 0 8px 18px rgba(255, 255, 255, 0.22);
        transition: transform 0.08s ease;
      }
      .tap-btn:active {
        transform: scale(0.96);
      }
      .tap-hint {
        margin-top: 18px;
        text-align: center;
        color: #94a3b8;
        font-size: 14px;
      }
      .menu-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }
      .menu-btn {
        background: rgba(30, 41, 59, 0.85);
        border: 1px solid rgba(148, 163, 184, 0.14);
        border-radius: 22px;
        min-height: 98px;
        padding: 12px 8px;
        cursor: pointer;
        color: #f8fafc;
        font-size: 13px;
        font-weight: 800;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .menu-emoji {
        font-size: 30px;
        line-height: 1;
      }
      .main-btn {
        width: 100%;
        border: none;
        border-radius: 18px;
        padding: 16px;
        margin-top: 12px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 800;
        color: white;
        background: linear-gradient(135deg, #2563eb, #60a5fa);
        box-shadow: 0 12px 28px rgba(37, 99, 235, 0.25);
      }
      .floating {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: 240px;
        z-index: 999;
        pointer-events: none;
        font-size: 24px;
        font-weight: 900;
        color: #93c5fd;
        text-shadow: 0 2px 14px rgba(59, 130, 246, 0.5);
        animation: floatUp 0.9s ease forwards;
      }
      @keyframes floatUp {
        0% {
          opacity: 1;
          transform: translateX(-50%) translateY(0) scale(0.95);
        }
        100% {
          opacity: 0;
          transform: translateX(-50%) translateY(-70px) scale(1.12);
        }
      }
      .modal {
        position: fixed;
        inset: 0;
        background: rgba(2, 6, 23, 0.78);
        display: none;
        align-items: flex-end;
        justify-content: center;
        z-index: 1000;
      }
      .modal.show {
        display: flex;
      }
      .modal-sheet {
        width: 100%;
        max-width: 480px;
        background: #0f172a;
        border-top-left-radius: 24px;
        border-top-right-radius: 24px;
        border: 1px solid rgba(59, 130, 246, 0.16);
        padding: 16px;
        max-height: 86vh;
        overflow: auto;
      }
      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
      }
      .modal-title {
        font-size: 20px;
        font-weight: 800;
        color: #f8fafc;
      }
      .close-btn {
        width: 40px;
        height: 40px;
        border-radius: 14px;
        border: none;
        background: rgba(30, 41, 59, 0.9);
        color: #f8fafc;
        font-size: 18px;
        cursor: pointer;
      }
      .tabs {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 10px;
        margin-bottom: 14px;
      }
      .tab-btn {
        border: none;
        border-radius: 16px;
        padding: 12px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 800;
        color: #e2e8f0;
        background: rgba(30, 41, 59, 0.9);
      }
      .tab-btn.active {
        color: #fff;
        background: linear-gradient(135deg, #2563eb, #60a5fa);
      }
      .modal-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .tile {
        background: rgba(30, 41, 59, 0.92);
        border: 1px solid rgba(148, 163, 184, 0.14);
        border-radius: 18px;
        padding: 14px;
      }
      .tile-title {
        color: #94a3b8;
        font-size: 13px;
        margin-bottom: 8px;
      }
      .tile-value {
        color: #f8fafc;
        font-size: 18px;
        font-weight: 800;
      }
      .tile-row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-top: 10px;
        color: #cbd5e1;
        font-size: 13px;
      }
      .buy-btn {
        width: 100%;
        border: none;
        border-radius: 14px;
        padding: 12px;
        margin-top: 12px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 800;
        color: #fff;
        background: linear-gradient(135deg, #2563eb, #60a5fa);
      }
      .buy-btn.green {
        background: linear-gradient(135deg, #15803d, #22c55e);
      }
      .buy-btn.gold {
        background: linear-gradient(135deg, #b45309, #f59e0b);
      }
      .note {
        color: #94a3b8;
        font-size: 13px;
        line-height: 1.45;
      }
      .warn {
        color: #fca5a5;
        font-size: 13px;
        line-height: 1.45;
        margin-top: 8px;
        font-weight: 700;
      }
      .wheel-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .wheel-disc {
        width: 220px;
        height: 220px;
        border-radius: 50%;
        border: 8px solid #1d4ed8;
        background: conic-gradient(
          #60a5fa 0 60deg,
          #1e40af 60deg 120deg,
          #93c5fd 120deg 180deg,
          #2563eb 180deg 240deg,
          #60a5fa 240deg 300deg,
          #1e40af 300deg 360deg
        );
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
        position: relative;
        transition: transform 3s cubic-bezier(0.18, 0.89, 0.32, 1.08);
      }
      .wheel-center {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: #0f172a;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        border: 4px solid #60a5fa;
      }
      .wheel-pointer {
        width: 0;
        height: 0;
        border-left: 14px solid transparent;
        border-right: 14px solid transparent;
        border-top: 22px solid #f8fafc;
        margin-bottom: -8px;
      }
      .share-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        align-items: center;
      }
      .code-box,
      .input-box {
        width: 100%;
        padding: 12px;
        border-radius: 12px;
        border: none;
        background: #1e293b;
        color: #fff;
        font-size: 14px;
      }
      .full {
        grid-column: 1 / -1;
      }
      #resultBox {
        display: none;
      }
      .daily-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin-bottom: 15px;
      }

      .daily-item {
        background: #1e293b;
        border-radius: 12px;
        padding: 10px;
        text-align: center;
        font-size: 12px;
      }

      .daily-item.active {
        border: 2px solid #3b82f6;
      }

      .daily-item.done {
        opacity: 0.5;
      }

      .daily-item .day {
        font-weight: 700;
        margin-bottom: 5px;
      }

      .daily-item .reward {
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="card">
        <div class="top-row">
          <div>
            <div class="title">🚜 My Farm Clicker</div>
            <div class="subtitle">Ферма в Telegram Mini App</div>
          </div>
          <div class="level-badge" id="levelBadge">LVL 1</div>
        </div>
        <div class="stats-grid">
          <div class="stat-box">
            <div class="stat-label">Coins</div>
            <div class="stat-value" id="coins">0</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Diamonds</div>
            <div class="stat-value" id="diamonds">0</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Points</div>
            <div class="stat-value" id="points">0</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">XP</div>
            <div class="stat-value" id="xp">0</div>
          </div>
        </div>
        <div class="status-line" id="boostStatus">⚡ OFF | 🤖 OFF | 👑 OFF</div>
      </div>
      <div class="card">
        <div class="section-title">💰 Тапай і заробляй</div>
        <div class="tap-wrap">
          <button class="tap-btn" id="tapBtn">TAP</button>
          <div class="tap-hint">1 тап = 1 монета</div>
        </div>
        <div class="status-line" id="status">ok</div>
      </div>
      <div class="card">
        <div class="section-title">🗂 Меню</div>
        <div class="menu-grid">
          <button class="menu-btn" id="animalsBtn">
            <span class="menu-emoji">🐔</span><span>Тварини</span></button
          ><button class="menu-btn" id="storageBtn">
            <span class="menu-emoji">📦</span><span>Склад</span></button
          ><button class="menu-btn" id="feedBtn">
            <span class="menu-emoji">🌾</span><span>Корм</span></button
          ><button class="menu-btn" id="labBtn">
            <span class="menu-emoji">🧪</span><span>Лабораторія</span></button
          ><button class="menu-btn" id="dailyBtn">
            <span class="menu-emoji">🎁</span><span>Daily</span></button
          ><button class="menu-btn" id="questsBtn">
            <span class="menu-emoji">📜</span><span>Квести</span></button
          ><button class="menu-btn" id="wheelBtn">
            <span class="menu-emoji">🎰</span><span>Wheel</span></button
          ><button class="menu-btn" id="shopBtn">
            <span class="menu-emoji">💎</span><span>Diamonds</span></button
          ><button class="menu-btn" id="boostBtn">
            <span class="menu-emoji">⚡</span><span>Boosters</span></button
          ><button class="menu-btn" id="refsBtn">
            <span class="menu-emoji">👥</span><span>Referrals</span></button
          ><button class="menu-btn" id="refreshBtn">
            <span class="menu-emoji">🔄</span><span>Оновити</span>
          </button>
        </div>
        <button class="main-btn" id="loadStateBtn">Оновити стан</button>
      </div>
      <div id="resultBox">ще нічого</div>
    </div>
    <div class="modal" id="modal">
      <div class="modal-sheet">
        <div class="modal-header">
          <div class="modal-title" id="modalTitle">Вікно</div>
          <button class="close-btn" id="closeModalBtn">✕</button>
        </div>
        <div id="modalTabs" style="display: none">
          <div class="tabs">
            <button class="tab-btn active" id="tabBuyBtn">Купити</button
            ><button class="tab-btn" id="tabOwnedBtn">Мої</button
            ><button class="tab-btn" id="tabUpgradeBtn">Upgrade</button>
          </div>
        </div>
        <div id="modalBody"></div>
      </div>
    </div>
    <script>
      const tg = window.Telegram?.WebApp;
      const API = "https://tg-farm-api.onrender.com/api";
      const BOT_USERNAME = "my_farm_clicker_bot";
      if (tg) {
        tg.ready();
        tg.expand();
      }
      const initData = tg?.initData ?? "";
      const shareBase = `https://t.me/${BOT_USERNAME}?start=ref_`;
      const modal = document.getElementById("modal"),
        modalTitle = document.getElementById("modalTitle"),
        modalBody = document.getElementById("modalBody"),
        modalTabs = document.getElementById("modalTabs"),
        tabBuyBtn = document.getElementById("tabBuyBtn"),
        tabOwnedBtn = document.getElementById("tabOwnedBtn"),
        tabUpgradeBtn = document.getElementById("tabUpgradeBtn"),
        resultBox = document.getElementById("resultBox"),
        statusEl = document.getElementById("status"),
        coinsEl = document.getElementById("coins"),
        diamondsEl = document.getElementById("diamonds"),
        pointsEl = document.getElementById("points"),
        xpEl = document.getElementById("xp"),
        levelBadgeEl = document.getElementById("levelBadge"),
        boostStatusEl = document.getElementById("boostStatus");
      let currentState = null;
      let wheelRotation = 0;
      function setStatus(t) {
        statusEl.textContent = t;
      }
      function setResult(d) {
        resultBox.textContent =
          typeof d === "string" ? d : JSON.stringify(d, null, 2);
      }
      async function apiGet(path) {
        const res = await fetch(`${API}${path}`, {
          method: "GET",
          headers: { "x-telegram-init-data": initData },
        });
        const text = await res.text();
        let json;
        try {
          json = JSON.parse(text);
        } catch {
          json = text;
        }
        return { ok: res.ok, data: json };
      }
      async function apiPost(path, body = {}) {
        const res = await fetch(`${API}${path}`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-telegram-init-data": initData,
          },
          body: JSON.stringify(body),
        });
        const text = await res.text();
        let json;
        try {
          json = JSON.parse(text);
        } catch {
          json = text;
        }
        return { ok: res.ok, data: json };
      }
      function spawnFloatingText(text) {
        const el = document.createElement("div");
        el.className = "floating";
        el.textContent = text;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 900);
      }
      function showToast(text) {
        spawnFloatingText(text);
      }
      function applyState(data) {
        currentState = data;
        coinsEl.textContent = data?.coins ?? 0;
        diamondsEl.textContent = data?.diamonds ?? 0;
        pointsEl.textContent = data?.points ?? 0;
        xpEl.textContent = data?.xp ?? 0;
        levelBadgeEl.textContent = `LVL ${data?.level ?? 1}`;
        const boost = data?.boost?.active ? "ON" : "OFF";
        const auto = data?.autoCollect?.active ? "ON" : "OFF";
        const vip = data?.vip?.active ? "ON" : "OFF";
        boostStatusEl.innerText = `⚡ ${boost} | 🤖 ${auto} | 👑 ${vip}`;
      }
      async function loadState() {
        try {
          setStatus("loading...");
          const res = await apiGet("/state");
          setResult(res.data);
          if (res.ok) {
            applyState(res.data);
            setStatus("ok");
          } else {
            setStatus("error");
          }
        } catch (e) {
          setStatus("error");
          setResult(String(e));
        }
      }
      async function collect() {
        try {
          setStatus("collect...");
          const res = await apiPost("/collect");
          setResult(res.data);
          if (res.ok) {
            showToast(`+${res.data?.added ?? 1}`);
            await loadState();
            setStatus("ok");
          } else {
            setStatus("error");
          }
        } catch (e) {
          setStatus("error");
          setResult(String(e));
        }
      }
      function showModal() {
        modal.classList.add("show");
      }
      function closeModal() {
        modal.classList.remove("show");
      }
      modal.addEventListener("click", (e) => {
        if (e.target === modal) closeModal();
      });
      async function buyAnimal(type) {
        const res = await apiPost("/buy-animal", { type });
        setResult(res.data);
        if (res.ok) {
          showToast("Куплено");
          await loadState();
          renderAnimalsOwned();
        } else {
          showToast(res.data?.error || "Помилка");
        }
      }
      function renderAnimalsBuy() {
        tabBuyBtn.classList.add("active");
        tabOwnedBtn.classList.remove("active");
        tabUpgradeBtn.classList.remove("active");
        modalBody.innerHTML = `<div class="modal-grid"><div class="tile"><div class="tile-title">🐔 Курка</div><div class="tile-value">100 coins</div><div class="tile-row"><span>Ресурс</span><span>Яйця</span></div><button class="buy-btn" data-animal="CHICKEN">Купити</button></div><div class="tile"><div class="tile-title">🐑 Вівця</div><div class="tile-value">500 coins</div><div class="tile-row"><span>Ресурс</span><span>Шерсть</span></div><button class="buy-btn" data-animal="SHEEP">Купити</button></div><div class="tile"><div class="tile-title">🐄 Корова</div><div class="tile-value">1000 coins</div><div class="tile-row"><span>Ресурс</span><span>Молоко</span></div><button class="buy-btn" data-animal="COW">Купити</button></div></div>`;
        modalBody
          .querySelectorAll(".buy-btn")
          .forEach((btn) =>
            btn.addEventListener(
              "click",
              async () => await buyAnimal(btn.dataset.animal),
            ),
          );
      }
      function animalFeedWarning(v) {
        return v > 0
          ? `<div class="tile-row"><span>Корм</span><span>${v}</span></div>`
          : `<div class="warn">Немає корму ❌</div>`;
      }
      function renderAnimalsOwned() {
        tabBuyBtn.classList.remove("active");
        tabOwnedBtn.classList.add("active");
        tabUpgradeBtn.classList.remove("active");

        const animals = currentState?.animals || {};
        const ready = currentState?.ready || {};
        const feed = currentState?.feedStock || {};

        function productionPerCycle(type, level) {
          if (!level) return 0;

          if (type === "CHICKEN") return 1 + (level - 1);
          if (type === "SHEEP") return 3 + (level - 1);
          if (type === "COW") return 7 + (level - 1) * 2;

          return 0;
        }

        function cycleSeconds(type) {
          if (type === "CHICKEN") return 20;
          if (type === "SHEEP") return 45;
          if (type === "COW") return 90;
          return 1;
        }

        function productionText(type, level) {
          const perCycle = productionPerCycle(type, level);
          return perCycle > 0 ? `${perCycle} / цикл` : "-";
        }

        function productionPerHour(type, level, count) {
          if (!level || !count) return 0;

          const perCycle = productionPerCycle(type, level);
          const perHourOne = (3600 / cycleSeconds(type)) * perCycle;
          return Math.floor(perHourOne * count);
        }

        modalBody.innerHTML = `
                <div class="modal-grid">
                  <div class="tile">
                    <div class="tile-title">🐔 Курки</div>
                    <div class="tile-value">${animals.chicken ?? 0}</div>
                    <div class="tile-row"><span>LVL</span><span>${animals.chickenLevel ?? 0}</span></div>
                    <div class="tile-row"><span>Продуктивність</span><span>${productionText("CHICKEN", animals.chickenLevel ?? 0)}</span></div>
                    <div class="tile-row"><span>За годину</span><span>${productionPerHour("CHICKEN", animals.chickenLevel ?? 0, animals.chicken ?? 0)}</span></div>
                    <div class="tile-row"><span>Готово</span><span>${ready.eggsReady ?? 0}</span></div>
                    ${animalFeedWarning(feed.chicken ?? 0)}
                  </div>

                  <div class="tile">
                    <div class="tile-title">🐑 Вівці</div>
                    <div class="tile-value">${animals.sheep ?? 0}</div>
                    <div class="tile-row"><span>LVL</span><span>${animals.sheepLevel ?? 0}</span></div>
                    <div class="tile-row"><span>Продуктивність</span><span>${productionText("SHEEP", animals.sheepLevel ?? 0)}</span></div>
                    <div class="tile-row"><span>За годину</span><span>${productionPerHour("SHEEP", animals.sheepLevel ?? 0, animals.sheep ?? 0)}</span></div>
                    <div class="tile-row"><span>Готово</span><span>${ready.woolReady ?? 0}</span></div>
                    ${animalFeedWarning(feed.sheep ?? 0)}
                  </div>

                  <div class="tile">
                    <div class="tile-title">🐄 Корови</div>
                    <div class="tile-value">${animals.cow ?? 0}</div>
                    <div class="tile-row"><span>LVL</span><span>${animals.cowLevel ?? 0}</span></div>

            tg.openTelegramLink(
              `https://t.me/share/url?url=${encodeURIComponent(shareLink)}&text=${encodeURIComponent("Заходь у гру 🚜")}`,
            );
          else
            window.open(
              `https://t.me/share/url?url=${encodeURIComponent(shareLink)}&text=${encodeURIComponent("Заходь у гру 🚜")}`,
              "_blank",
            );
        };
        document.getElementById("applyRefBtn").onclick = async () => {
          const code = document.getElementById("refCodeInput").value,
            resp = await apiPost("/referrals/apply", { code });
          setResult(resp.data);
          if (resp.ok) {
            showToast(`+${resp.data?.rewardYou ?? 0}`);
            await loadState();
            await openRefsModal();
          } else {
            showToast(resp.data?.error || "Помилка");
          }
        };
      }
      document.getElementById("tapBtn").addEventListener("click", collect);
      document
        .getElementById("loadStateBtn")
        .addEventListener("click", loadState);
      document
        .getElementById("refreshBtn")
        .addEventListener("click", loadState);
      document
        .getElementById("animalsBtn")
        .addEventListener("click", openAnimalsModal);
      document
        .getElementById("storageBtn")
        .addEventListener("click", openStorageModal);
      document
        .getElementById("feedBtn")
        .addEventListener("click", openFeedModal);
      document.getElementById("labBtn").addEventListener("click", openLabModal);
      document
        .getElementById("boostBtn")
        .addEventListener("click", openBoostersModal);
      document
        .getElementById("dailyBtn")
        .addEventListener("click", openDailyModal);
      document
        .getElementById("questsBtn")
        .addEventListener("click", openQuestsModal);
      document
        .getElementById("wheelBtn")
        .addEventListener("click", openWheelModal);
      document
        .getElementById("shopBtn")
        .addEventListener("click", openShopModal);
      document
        .getElementById("refsBtn")
        .addEventListener("click", openRefsModal);
      document
        .getElementById("closeModalBtn")
        .addEventListener("click", closeModal);
      tabBuyBtn.addEventListener("click", renderAnimalsBuy);
      tabOwnedBtn.addEventListener("click", renderAnimalsOwned);
      tabUpgradeBtn.addEventListener("click", renderAnimalsUpgrade);
      loadState();
    </script>
  </body>
</html>
