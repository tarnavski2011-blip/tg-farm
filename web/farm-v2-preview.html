<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>My Farm 2.0 — перегляд карти</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101e1a;color:#f4f5ed;font-family:system-ui,Arial,sans-serif}
header{padding:12px 16px;background:#182e26;display:flex;justify-content:space-between;align-items:center;gap:10px}
small{color:#c4d6ca}button{border:0;border-radius:10px;padding:10px 13px;font-weight:700;background:#f1c96a;color:#242019;cursor:pointer}
#viewport{height:calc(100dvh - 116px);overflow:hidden;position:relative;touch-action:none;background:radial-gradient(ellipse at center,#679f60,#264c39)}
#world{position:absolute;left:50%;top:50%;width:840px;height:840px;transform-origin:center;display:grid;grid-template-columns:repeat(7,120px);grid-template-rows:repeat(7,120px);border:3px solid #2a422c;box-shadow:0 15px 50px #0007}
.tile{position:relative;border:2px solid #64895c;background:repeating-linear-gradient(45deg,#75ad66 0 12px,#79b36b 12px 24px);overflow:hidden}
.tile.locked{background:repeating-linear-gradient(45deg,#526853 0 12px,#5a705a 12px 24px)}
.tile.locked:after{content:"🔒";position:absolute;inset:0;display:grid;place-items:center;background:#101d18a8;font-size:24px}
.tile.open{background:repeating-linear-gradient(45deg,#7fbc70 0 12px,#83c174 12px 24px)}
.tile.center{display:grid;place-items:center}
.house{font-size:58px;filter:drop-shadow(0 5px 2px #0006);cursor:pointer}
.pen{position:relative;border:5px dashed #a36d3a;border-radius:9px;background:#92c878a8;width:94%;height:94%;display:flex;align-items:center;justify-content:center;gap:2px;flex-wrap:wrap;padding:5px;cursor:pointer}
.pen b{position:absolute;top:0;left:3px;background:#253c27;color:white;font-size:11px;padding:2px 5px;border-radius:5px}
.animal{font-size:21px;animation:walk 3s ease-in-out infinite alternate}.animal:nth-child(3n){animation-delay:-1.1s}.animal:nth-child(2n){animation-delay:-2s}
@keyframes walk{from{transform:translate(-5px,2px) rotate(-5deg)}to{transform:translate(5px,-3px) rotate(4deg)}}
footer{height:54px;background:#182e26;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;gap:8px;font-size:12px}
#toast{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);background:#172b22eb;border:1px solid #9ec08e;padding:10px 15px;border-radius:12px;max-width:90%;text-align:center;display:none;pointer-events:none}
</style></head><body>
<header><div><strong>🌿 My Farm Clicker 2.0</strong><div><small>Етап 4 · API + справжні тварини</small></div></div><button id="reset">⌖ Центр</button></header>
<div id="viewport"><div id="world"></div><div id="toast"></div></div>
<footer><span id="status">Підключення до API…</span><span>Перетягни карту · масштаб двома пальцями</span></footer>
<script>
const world=document.getElementById('world'),viewport=document.getElementById('viewport'),toast=document.getElementById('toast');
function message(t){toast.textContent=t;toast.style.display='block';clearTimeout(message.t);message.t=setTimeout(()=>toast.style.display='none',2300)}
const tg=window.Telegram?.WebApp;
tg?.ready?.();
const params=new URLSearchParams(location.search);
const apiBase=(params.get('api')||'http://localhost:3000').replace(/\/$/,'');
const auth=tg?.initData||'';
const status=document.getElementById('status');
const farmKey='myfarm_v2_camera_'+(tg?.initDataUnsafe?.user?.id||'preview');
const animalTypes={CHICKEN:{emoji:'🐔',name:'Кури',x:2,y:3},SHEEP:{emoji:'🐑',name:'Вівці',x:4,y:3},COW:{emoji:'🐄',name:'Корови',x:3,y:4}};
const demoTiles=Array.from({length:49},(_,i)=>({x:i%7,y:Math.floor(i/7),unlocked:i%7>=2&&i%7<=4&&Math.floor(i/7)>=2&&Math.floor(i/7)<=4}));
function renderFarm(tiles,animals){
 world.replaceChildren();
 const byPosition=new Map(tiles.map(t=>[`${t.x},${t.y}`,t]));
 for(let y=0;y<7;y++)for(let x=0;x<7;x++){
  const open=!!byPosition.get(`${x},${y}`)?.unlocked;
  const tile=document.createElement('div');tile.className='tile '+(open?'open':'locked');tile.dataset.x=x;tile.dataset.y=y;
  if(open){
   if(x===3&&y===3){tile.classList.add('center');const h=document.createElement('div');h.className='house';h.textContent='🏠';h.onclick=()=>message('Профіль відкриватиметься в основній грі');tile.append(h)}
   for(const [type,info] of Object.entries(animalTypes)){
    if(info.x!==x||info.y!==y)continue;
    const list=animals[type]||[];const p=document.createElement('div');p.className='pen';
    const label=document.createElement('b');label.textContent=`${info.name}: ${list.length}/6`;p.append(label);
    for(const animal of list.slice(0,6)){const a=document.createElement('span');a.className='animal';a.textContent=info.emoji;a.title=`Рівень ${animal.level||1}`;a.onclick=e=>{e.stopPropagation();message(`${info.name} · рівень ${animal.level||1} · HP ${animal.hp??'?'}%`)};p.append(a)}
    p.onclick=()=>message(`${info.name}: ${list.length} тварин · список підключимо в основній грі`);tile.append(p);
   }
  }else tile.onclick=()=>message('Закрита ділянка · купівлю додамо окремо');
  world.append(tile);
 }
}
function restoreCamera(){try{const s=JSON.parse(localStorage.getItem(farmKey));if(s&&Number.isFinite(s.scale)&&Number.isFinite(s.tx)&&Number.isFinite(s.ty)){scale=Math.max(.25,Math.min(2,s.scale));tx=s.tx;ty=s.ty;render()}}catch{}}
function saveCamera(){try{localStorage.setItem(farmKey,JSON.stringify({scale,tx,ty}))}catch{}}
async function loadFarm(){
 if(!auth){renderFarm(demoTiles,{});status.textContent='Демо: відкрий через Telegram для реальних даних';return}
 try{
  const headers={'x-telegram-init-data':auth};
  const [mapRes,stateRes]=await Promise.all([fetch(apiBase+'/api/farm-map',{headers}),fetch(apiBase+'/api/state',{headers})]);
  const map=await mapRes.json();const state=await stateRes.json();
  if(!mapRes.ok||!stateRes.ok)throw Error(map?.error||state?.error||`HTTP ${mapRes.status}/${stateRes.status}`);
  if(!Array.isArray(map.farm?.tiles)||map.farm.tiles.length!==49)throw Error('API не повернув 49 ділянок');
  const animals={CHICKEN:state.animals?.chickenCards||[],SHEEP:state.animals?.sheepCards||[],COW:state.animals?.cowCards||[]};
  renderFarm(map.farm.tiles,animals);
  status.textContent=`Реальна ферма · ${map.farm.tiles.filter(t=>t.unlocked).length}/49 ділянок`;
 }catch(err){renderFarm(demoTiles,{});status.textContent='API недоступний · показано демо';message('Помилка API: '+String(err.message||err))}
}
let scale=.56,tx=0,ty=0;const pointers=new Map();let last=null;
function render(){world.style.transform=`translate(calc(-50% + ${tx}px),calc(-50% + ${ty}px)) scale(${scale})`}
function center(){scale=Math.min(.76,(viewport.clientWidth-18)/840,(viewport.clientHeight-18)/840);tx=0;ty=0;render();saveCamera()}center();document.getElementById('reset').onclick=center;
viewport.addEventListener('pointerdown',e=>{viewport.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});last=null});
viewport.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const old=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});const a=[...pointers.values()];if(a.length===1){tx+=e.clientX-old.x;ty+=e.clientY-old.y}else if(a.length===2){const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(last)scale=Math.max(.25,Math.min(2,scale*d/last));last=d}render()});
for(const ev of ['pointerup','pointercancel'])viewport.addEventListener(ev,e=>{pointers.delete(e.pointerId);last=null});
viewport.addEventListener('wheel',e=>{e.preventDefault();scale=Math.max(.25,Math.min(2,scale*(e.deltaY>0?.92:1.08)));render();saveCamera()},{passive:false});
window.addEventListener('resize',render);restoreCamera();loadFarm();
</script></body></html>
